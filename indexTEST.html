    function AdminZedFaresEditor({ darkMode, pushAdminHistory }) {
      const { t } = React.useContext(I18nContext);
      const [text, setText] = useState(() => {
        try {
          return JSON.stringify(getJSON('admin_zed_fare_tables', {}), null, 2);
        } catch (_) {
          return '{}';
        }
      });
      const [err, setErr] = useState('');
      const validateAndSave = () => {
        setErr('');
        try {
          const o = JSON.parse(text);
          if (!o || typeof o !== 'object' || Array.isArray(o)) {
            setErr(t('admin_zed_fares_invalid'));
            return;
          }
          for (const k of Object.keys(o)) {
            const e = o[k];
            if (!e || typeof e !== 'object' || Array.isArray(e)) {
              setErr(t('admin_zed_fares_invalid'));
              return;
            }
            const cur = String(e.currency || '').toUpperCase();
            if (cur !== 'USD' && cur !== 'CAD') {
              setErr(t('admin_zed_fares_invalid'));
              return;
            }
            if (!Array.isArray(e.zones) || e.zones.length === 0) {
              setErr(t('admin_zed_fares_invalid'));
              return;
            }
            for (const z of e.zones) {
              if (!z || typeof z !== 'object' || typeof z.max !== 'number' || !toText(z.label, '')) {
                setErr(t('admin_zed_fares_invalid'));
                return;
              }
              if (z.fare != null && typeof z.fare !== 'number') {
                setErr(t('admin_zed_fares_invalid'));
                return;
              }
            }
            o[k] = { currency: cur, zones: e.zones };
          }
          setJSON('admin_zed_fare_tables', o);
          if (pushAdminHistory) pushAdminHistory('save', `ZED fare tables updated (${Object.keys(o).length} carriers)`, 'ok');
          window.alert(t('admin_zed_fares_saved'));
        } catch (_) {
          setErr(t('admin_zed_fares_invalid'));
        }
      };
      const handleReset = () => {
        setJSON('admin_zed_fare_tables', {});
        setText('{}');
        setErr('');
        if (pushAdminHistory) pushAdminHistory('save', 'ZED fare table overrides cleared', 'ok');
        window.alert(t('admin_zed_fares_cleared'));
      };
      return (
        <div className="space-y-4 animate-fade-in max-w-4xl">
          <div>
            <h3 className={`text-lg font-black uppercase tracking-tight ${darkMode ? 'text-white' : 'text-[#152C53]'}`}>{t('admin_zed_fares_title')}</h3>
            <p className={`text-[10px] font-bold uppercase tracking-widest mt-1 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('admin_zed_fares_desc')}</p>
          </div>
          <pre className={`text-[10px] p-3 rounded-xl border overflow-x-auto ${darkMode ? 'bg-slate-900 border-slate-600 text-slate-400' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>{t('admin_zed_fares_placeholder')}</pre>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            rows={16}
            spellCheck={false}
            className={`w-full font-mono text-xs p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-[#FFC136] focus:ring-inset ${darkMode ? 'bg-slate-900 border-slate-600 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}
            aria-label={t('admin_zed_fares_title')}
          />
          {err ? <p className="text-sm font-bold text-red-500">{err}</p> : null}
          <div className="flex flex-wrap gap-3">
            <button type="button" onClick={validateAndSave} className="px-6 py-3 bg-[#152C53] text-white font-black uppercase tracking-widest text-[10px] rounded-xl shadow-lg active:scale-95 transition-all">
              {t('admin_zed_fares_save')}
            </button>
            <button type="button" onClick={handleReset} className="px-6 py-3 bg-slate-200 text-slate-700 font-black uppercase tracking-widest text-[10px] rounded-xl hover:bg-slate-300 transition-all">
              {t('admin_zed_fares_reset')}
            </button>
          </div>
        </div>
      );
    }

    function AdminAirlinesEditor({ darkMode, editableAirlines, setEditableAirlines, saveAdminData }) {
      const [airlineSearch, setAirlineSearch] = useState('');
      const [editingAirline, setEditingAirline] = useState(null);
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [unsaved, setUnsaved] = useState(false);
      const filtered = editableAirlines.filter(a => a.name.toLowerCase().includes(airlineSearch.toLowerCase()));

      const updateAirline = (idx, field, value) => {
        setEditableAirlines(editableAirlines.map((a, i) => i === idx ? { ...a, [field]: value } : a));
        setUnsaved(true);
      };
      const addAirline = () => {
        const newAirline = { name: 'New Airline', country: '', flag: '🌐', zed: 'LOW', js: false, faJs: false, parentOverride: null, bookingPeriod: '90 Days', embargoes: 'None.' };
        const updated = [...editableAirlines, newAirline];
        setEditableAirlines(updated);
        setEditingAirline(updated.length - 1);
        setUnsaved(true);
        setTimeout(() => {
          const el = document.getElementById('admin-airline-' + (updated.length - 1));
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      };
      const confirmRemove = (idx) => setDeleteConfirm(idx);
      const removeAirline = () => {
        const updated = editableAirlines.filter((_, i) => i !== deleteConfirm);
        saveAdminData('airlines', updated);
        if (editingAirline === deleteConfirm) setEditingAirline(null);
        setDeleteConfirm(null);
        setUnsaved(false);
      };
      const handleSaveAll = () => {
        // Validate before saving
        const issues = [];
        editableAirlines.forEach((a, i) => {
          if (!a.name || a.name.trim() === '' || a.name === 'New Airline') issues.push(`Row ${i+1}: Missing airline name`);
          if (!a.country || a.country.trim() === '') issues.push(`Row ${i+1} (${a.name}): Missing country`);
          if (!['LOW','MED','MEDIUM','HIGH','SPECIAL','NOT ACTIVE'].includes((a.zed || '').toUpperCase())) issues.push(`Row ${i+1} (${a.name}): Invalid ZED tier "${a.zed}"`);
        });
        if (issues.length > 0) {
          alert('Validation warnings:\n\n' + issues.slice(0, 10).join('\n') + (issues.length > 10 ? `\n...and ${issues.length - 10} more` : '') + '\n\nData will still be saved.');
        }
        const sorted = [...editableAirlines].sort((a, b) => a.name.localeCompare(b.name));
        setEditableAirlines(sorted);
        setEditingAirline(null);
        saveAdminData('airlines', sorted); setUnsaved(false);
      };
      const handleReset = () => setDeleteConfirm('reset');

      return (
        <div className="space-y-6">
          {deleteConfirm === 'reset' && (
            <ConfirmDeleteModal
              message="This will reset all ZED airline data to factory defaults. This cannot be undone."
              onConfirm={() => { saveAdminData('airlines', AIRLINE_DATA); setEditableAirlines(AIRLINE_DATA); setDeleteConfirm(null); setUnsaved(false); }}
              onCancel={() => setDeleteConfirm(null)}
            />
          )}
          {typeof deleteConfirm === 'number' && (
            <ConfirmDeleteModal
              message={`Delete "${editableAirlines[deleteConfirm]?.name}"? This cannot be undone.`}
              onConfirm={removeAirline}
              onCancel={() => setDeleteConfirm(null)}
            />
          )}
          <div className="flex gap-4 items-center flex-wrap">
            <div className="relative flex-1 min-w-[200px]">
              <Icons.Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300" />
              <input type="text" placeholder="Search airlines..." className={`w-full pl-11 pr-5 py-3 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-[#FFC136] focus:ring-inset ${darkMode ? 'bg-slate-800 border-slate-600 text-slate-100 placeholder:text-slate-500' : 'bg-white border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={airlineSearch} onChange={e => setAirlineSearch(e.target.value)} />
            </div>
            <button onClick={addAirline} className="px-6 py-3 bg-[#152C53] text-white font-black uppercase tracking-widest text-[10px] rounded-2xl shadow-lg active:scale-95 transition-all">+ Add Airline</button>
            <button onClick={handleSaveAll} className={`px-6 py-3 font-black uppercase tracking-widest text-[10px] rounded-2xl shadow-lg active:scale-95 transition-all ${unsaved ? 'bg-[#FFC136] text-[#152C53] animate-pulse' : 'bg-emerald-500 text-white'}`}>
              {unsaved ? '● Save Changes' : 'Save All'}
            </button>
            <button onClick={handleReset} className="px-6 py-3 bg-slate-100 text-slate-500 hover:bg-red-50 hover:text-red-500 font-black uppercase tracking-widest text-[10px] rounded-2xl transition-all" title="Resets all airlines to factory defaults. Cannot be undone.">↺ Reset Defaults</button>
          </div>
          {unsaved && <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center gap-3"><Icons.AlertTriangle className="w-4 h-4 text-amber-500 shrink-0" /><p className="text-[10px] font-bold text-amber-700 uppercase tracking-wide">You have unsaved changes</p></div>}
          <div className="grid grid-cols-1 gap-2">
            {filtered.map((airline) => {
              const realIdx = editableAirlines.indexOf(airline);
              const isOpen = editingAirline === realIdx;
              return (
                <div key={realIdx} id={`admin-airline-${realIdx}`} className={`rounded-xl border overflow-hidden ${darkMode ? 'bg-slate-800 border-slate-600' : 'bg-white border-slate-200'}`}>
                  <div className={`flex items-center justify-between px-5 py-3.5 cursor-pointer transition-colors ${darkMode ? 'hover:bg-slate-700/50' : 'hover:bg-slate-50'}`} onClick={() => setEditingAirline(isOpen ? null : realIdx)}>
                    <div className="flex items-center gap-3">
                      <span className="text-lg">{airline.flag}</span>
                      <div>
                        <p className={`font-bold text-sm ${darkMode ? 'text-slate-100' : 'text-[#152C53]'}`}>{airline.name}</p>
                        <p className={`text-[9px] font-medium tracking-wide ${darkMode ? 'text-slate-400' : 'text-slate-400'}`}>{airline.country} · ZED {airline.zed} · {airline.bookingPeriod}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className={`px-3 py-1 rounded-full text-[9px] font-black uppercase ${airline.zed === 'NOT ACTIVE' ? (darkMode ? 'bg-slate-700 text-slate-400' : 'bg-slate-100 text-slate-400') : (darkMode ? 'bg-emerald-900/50 text-emerald-400' : 'bg-emerald-50 text-emerald-600')}`}>{airline.zed}</span>
                      <Icons.ChevronDown className={`w-4 h-4 transition-transform ${darkMode ? 'text-slate-400' : 'text-slate-300'} ${isOpen ? 'rotate-180' : ''}`} />
                    </div>
                  </div>
                  {isOpen && (
                    <div className={`px-5 pb-5 border-t pt-4 grid grid-cols-2 md:grid-cols-3 gap-3 animate-fade-in ${darkMode ? 'border-slate-600' : 'border-slate-100'}`}>
                      {[['name','Airline Name','text'],['country','Country','text'],['flag','Flag Emoji','text'],['bookingPeriod','Booking Period','text']].map(([field, label, type]) => (
                        <div key={field} className="space-y-1">
                          <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{label}</label>
                          <input type={type} className={`w-full p-3 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-[#FFC136] focus:ring-inset ${darkMode ? 'bg-slate-700 border-slate-600 text-slate-100' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={airline[field] || ''} onChange={e => updateAirline(realIdx, field, e.target.value)} />
                        </div>
                      ))}
                      <div className="space-y-1">
                        <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">ZED Fare</label>
                        <select className={`w-full p-3 border rounded-xl font-bold text-sm outline-none ${darkMode ? 'bg-slate-700 border-slate-600 text-slate-100' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={airline.zed} onChange={e => updateAirline(realIdx, 'zed', e.target.value)}>
                          {['LOW','MED','HIGH','SPECIAL','NOT ACTIVE'].map(v => <option key={v} value={v}>{v}</option>)}
                        </select>
                      </div>
                      <div className="space-y-1">
                        <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Parent Override</label>
                        <select className={`w-full p-3 border rounded-xl font-bold text-sm outline-none ${darkMode ? 'bg-slate-700 border-slate-600 text-slate-100' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={airline.parentOverride || 'null'} onChange={e => updateAirline(realIdx, 'parentOverride', e.target.value === 'null' ? null : e.target.value)}>
                          <option value="null">Same as ZED</option>
                          {['LOW','MED','HIGH','NOT ACTIVE'].map(v => <option key={v} value={v}>{v}</option>)}
                        </select>
                      </div>
                      <div className="col-span-2 md:col-span-3 space-y-1">
                        <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Embargoes</label>
                        <textarea rows="2" className={`w-full p-3 border rounded-xl font-bold text-sm outline-none resize-none ${darkMode ? 'bg-slate-700 border-slate-600 text-slate-100' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={airline.embargoes || ''} onChange={e => updateAirline(realIdx, 'embargoes', e.target.value)} />
                      </div>
                      <div className="flex items-center gap-6">
                        {[['js','Pilot JS'],['faJs','F/A JS']].map(([field, label]) => (
                          <label key={field} className="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" className="w-4 h-4 accent-[#152C53]" checked={!!airline[field]} onChange={e => updateAirline(realIdx, field, e.target.checked)} />
                            <span className={`text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>{label}</span>
                          </label>
                        ))}
                      </div>
                      <div className="flex justify-end col-span-2 gap-3 items-end">
                        <button onClick={() => confirmRemove(realIdx)} className="px-4 py-2 bg-red-50 text-red-500 hover:bg-red-500 hover:text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">Remove</button>
                        <button onClick={() => { saveAdminData('airlines', editableAirlines); setEditingAirline(null); setUnsaved(false); }} className="px-4 py-2 bg-emerald-500 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all active:scale-95">Save</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

        });

        setEditableFAQ(editableFAQ.map((f, i) => i === idx ? { ...f, [field]: value } : f));

    function AdminStaffEditor({ darkMode, editableStaff, setEditableStaff, saveAdminData }) {

    // ── Reusable picker components (defined at top level to avoid re-mount on parent render) ──

    function DateInput({ value, onChange, className: cls, darkMode }) {
      const inputRef = useRef(null);
      const toDisplay = (v) => {
        if (!v) return '';
        const s = String(v);
        return s.replace(/-/g, '/');
      };
      const toIsoForPicker = (v) => {
        if (!v) return '';
        const s = String(v).replace(/\//g, '-');
        return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
      };
      const handleType = (e) => {
        let v = e.target.value.replace(/[^\d]/g, '');
        if (v.length > 8) v = v.slice(0, 8);
        if (v.length >= 5) v = v.slice(0,4) + '-' + v.slice(4);
        if (v.length >= 8) v = v.slice(0,7) + '-' + v.slice(7);
        onChange(v);
      };
      return (
        <div className="relative" style={{ position: 'relative' }}>
          <input
            ref={inputRef}
            type="text"
            inputMode="numeric"
            placeholder="YYYY/MM/DD"
            maxLength="10"
            className={cls}
            value={toDisplay(value)}
            onChange={handleType}
          />
          <input
            type="date"
            tabIndex={-1}
            aria-hidden="true"
            value={toIsoForPicker(value)}
            onChange={e => onChange(e.target.value)}
            className="absolute inset-0 opacity-0 cursor-pointer"
            style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', opacity: 0, cursor: 'pointer', zIndex: 1, pointerEvents: 'none' }}
            ref={el => { if (el) el._dateRef = el; }}
          />
          <button
            type="button"
            tabIndex={-1}
            onClick={() => {
              const dateEl = inputRef.current?.parentNode?.querySelector('input[type="date"]');
              if (dateEl) {
                dateEl.style.pointerEvents = 'auto';
                dateEl.showPicker?.();
                dateEl.focus();
                setTimeout(() => { dateEl.style.pointerEvents = 'none'; }, 300);
              }
            }}
            className={`absolute right-3 top-1/2 -translate-y-1/2 z-10 ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-slate-700'} transition-colors`}
            title="Open calendar"
            aria-label="Open calendar"
          >
            <Icons.Calendar className="w-4 h-4" />
          </button>
        </div>
      );
    }

    function TripAirportPicker({ value, onChange, placeholder, darkMode, airports, airportCodes }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      const results = useMemo(() => {
        if (!query || query.length < 1) return [];
        const q = query.toLowerCase();
        return airportCodes.filter(code => {
          const ap = airports[code];
          return code.toLowerCase().includes(q) || ap.name.toLowerCase().includes(q) || ap.city.toLowerCase().includes(q);
        }).slice(0, 8);
      }, [query, airportCodes, airports]);

      useEffect(() => {
        const handleClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, []);

      return (
        <div className="relative z-[500]" ref={ref}>
          <input
            type="text"
            placeholder={placeholder || "Airport code or city..."}
            className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400 placeholder-slate-500' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53] placeholder-slate-400'}`}
            value={value ? `${value} — ${airports[value]?.city || ''}` : query}
            onChange={e => { setQuery(e.target.value); setOpen(true); if (value) onChange(''); }}
            onFocus={() => { if (!value) setOpen(true); if (value) { setQuery(''); onChange(''); } }}
          />
          {value && (
            <button onClick={() => { onChange(''); setQuery(''); }} className={`absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-slate-700'}`}>✕</button>
          )}
          {open && results.length > 0 && !value && (
            <div className={`absolute top-full left-0 w-full mt-1 rounded-xl shadow-xl border z-[600] max-h-48 overflow-y-auto ${darkMode ? 'bg-slate-800 border-slate-600' : 'bg-white border-slate-200'}`}>
              {results.map(code => (
                <button key={code} className={`w-full px-4 py-3 text-left text-sm flex items-center gap-3 transition-colors ${darkMode ? 'hover:bg-slate-700' : 'hover:bg-slate-50'}`} onClick={() => { onChange(code); setQuery(''); setOpen(false); }}>
                  <span className={`font-black text-xs ${darkMode ? 'text-[#FFC136]' : 'text-[#152C53]'}`}>{code}</span>
                  <span className={`font-medium truncate ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>{airports[code].city} — {airports[code].name}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    function TripAirlinePicker({ value, onChange, darkMode, airlines }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      const activeAirlines = useMemo(() => airlines.filter(a => a.zed && a.zed.toUpperCase() !== 'NOT ACTIVE'), [airlines]);
      const results = useMemo(() => {
        if (!query || query.length < 1) return activeAirlines.slice(0, 10);
        const q = query.toLowerCase();
        return activeAirlines.filter(a => a.name.toLowerCase().includes(q) || a.country.toLowerCase().includes(q)).slice(0, 10);
      }, [query, activeAirlines]);

      useEffect(() => {
        const handleClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, []);

      const selected = value ? airlines.find(a => a.name === value) : null;

      return (
        <div className="relative z-[500]" ref={ref}>
          <input
            type="text"
            placeholder="Type airline name..."
            className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400 placeholder-slate-500' : 'bg-white border-slate-200 text-[#152C53] focus:border-[#152C53] placeholder-slate-400'}`}
            value={value && !open ? `${selected?.flag || ''} ${value}` : query}
            onChange={e => { setQuery(e.target.value); setOpen(true); if (value) onChange(''); }}
            onFocus={() => { setOpen(true); if (value) { setQuery(''); onChange(''); } }}
          />
          {value && !open && (
            <button onClick={() => { onChange(''); setQuery(''); setOpen(true); }} className={`absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-slate-700'}`}>✕</button>
          )}
          {open && results.length > 0 && (
            <div className={`absolute top-full left-0 w-full mt-1 rounded-xl shadow-xl border z-[600] max-h-56 overflow-y-auto ${darkMode ? 'bg-slate-800 border-slate-600' : 'bg-white border-slate-200'}`}>
              {results.map(a => (
                <button key={a.name} className={`w-full px-4 py-3 text-left text-sm flex items-center justify-between gap-2 transition-colors ${darkMode ? 'hover:bg-slate-700' : 'hover:bg-slate-50'}`} onClick={() => { onChange(a.name); setQuery(''); setOpen(false); }}>
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-base shrink-0">{a.flag}</span>
                    <span className={`font-bold truncate ${darkMode ? 'text-slate-200' : 'text-slate-700'}`}>{a.name}</span>
                  </div>
                  <span className={`shrink-0 px-2 py-0.5 rounded-full text-[8px] font-black uppercase text-white ${a.zed === 'LOW' ? 'bg-emerald-500' : a.zed === 'MED' || a.zed === 'MEDIUM' ? 'bg-amber-500' : a.zed === 'HIGH' ? 'bg-red-500' : 'bg-slate-500'}`}>{a.zed}</span>
                </button>
              ))}
              {results.length === 0 && (
                <div className={`px-4 py-6 text-center text-sm font-bold ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>No airlines match</div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── Travel Log Component ──
    function TravelLog({ darkMode, airlines, airports, currentUser }) {
      const { t } = React.useContext(I18nContext);
      const [tab, setTab] = useState(() => {
        let v = getJSONValidated('travel_log_tab', 'airlines', val => typeof val === 'string' ? val : 'airlines');
        if (v === 'bingo') {
          v = 'airlines';
          setJSON('travel_log_tab', 'airlines');
        }
        return v;
      });
      const [flownAirlines, setFlownAirlines] = useState(() => getJSONValidated('travel_log_airlines', [], toStringArray));
      const [visitedAirports, setVisitedAirports] = useState(() => getJSONValidated('travel_log_airports', [], toStringArray));
      const [airlineSearch, setAirlineSearch] = useState('');
      const [airportSearch, setAirportSearch] = useState('');
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(() => getJSONValidated('travel_log_last_updated', null, v => typeof v === 'number' ? v : null));
      const [copiedSummary, setCopiedSummary] = useState(false);
      const [travelLogLoadNonce, setTravelLogLoadNonce] = useState(0);
      const [travelLogSyncBanner, setTravelLogSyncBanner] = useState(null);
      const [travelLogSyncBannerDismissed, setTravelLogSyncBannerDismissed] = useState(false);
      const [travelLogSaveFailed, setTravelLogSaveFailed] = useState(false);
      const [travelLogSaveBannerDismissed, setTravelLogSaveBannerDismissed] = useState(false);
      const travelLogSaveTimerRef = React.useRef(null);
      const employeeId = currentUser && currentUser.id ? String(currentUser.id) : null;

      const touchLastUpdated = () => {
        const ts = Date.now();
        setLastUpdated(ts);
        setJSON('travel_log_last_updated', ts);
      };

      const saveAirlines = (updated) => {
        setFlownAirlines(updated);
        setJSON('travel_log_airlines', updated);
        if (updated && updated.length >= 0) touchLastUpdated();
      };
      const saveAirports = (updated) => {
        setVisitedAirports(updated);
        setJSON('travel_log_airports', updated);
        if (updated && updated.length >= 0) touchLastUpdated();
      };

      const handleTabChange = (newTab) => {
        setTab(newTab);
        setJSON('travel_log_tab', newTab);
      };

      const focusTravelLogTab = (newTab) => {
        handleTabChange(newTab);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.getElementById(`travel-log-tab-btn-${newTab}`)?.focus();
          });
        });
      };

      const toggleAirline = (name) => {
        const updated = flownAirlines.includes(name) ? flownAirlines.filter(n => n !== name) : [...flownAirlines, name];
        saveAirlines(updated);
      };
      const toggleAirport = (code) => {
        const updated = visitedAirports.includes(code) ? visitedAirports.filter(c => c !== code) : [...visitedAirports, code];
        saveAirports(updated);
      };

      // Stats calculations
      const visitedCountries = useMemo(() => {
        const countries = new Set();
        visitedAirports.forEach(code => { const ap = airports[code]; if (ap) countries.add(ap.country); });
        return [...countries].sort();
      }, [visitedAirports, airports]);

      const visitedContinents = useMemo(() => {
        const continentMap = { 'Canada': 'North America', 'USA': 'North America', 'Mexico': 'North America', 'Brazil': 'South America', 'Argentina': 'South America', 'Colombia': 'South America', 'Chile': 'South America', 'Peru': 'South America', 'UK': 'Europe', 'France': 'Europe', 'Germany': 'Europe', 'Italy': 'Europe', 'Spain': 'Europe', 'Netherlands': 'Europe', 'Switzerland': 'Europe', 'Ireland': 'Europe', 'Japan': 'Asia', 'China': 'Asia', 'South Korea': 'Asia', 'India': 'Asia', 'Thailand': 'Asia', 'Singapore': 'Asia', 'Australia': 'Oceania', 'New Zealand': 'Oceania', 'South Africa': 'Africa', 'Kenya': 'Africa', 'Morocco': 'Africa', 'Nigeria': 'Africa', 'UAE': 'Middle East', 'Qatar': 'Middle East', 'Saudi Arabia': 'Middle East', 'Israel': 'Middle East', 'Turkey': 'Europe' };
        const conts = new Set();
        visitedCountries.forEach(c => { const cont = continentMap[c]; if (cont) conts.add(cont); else conts.add('Other'); });
        return [...conts].sort();
      }, [visitedCountries]);

      // Load from backend when user is known (or after reconnect)
      useEffect(() => {
        if (!employeeId) return;
        let cancelled = false;
        (async () => {
          try {
            const res = await fetch(`/api/travel-log?employeeId=${encodeURIComponent(employeeId)}`);
            if (!res.ok) {
              let kind = 'server';
              if (res.status === 503) {
                try {
                  const errBody = await res.json();
                  if (errBody && errBody.error === 'offline') kind = 'offline';
                } catch {
                  kind = 'offline';
                }
              }
              if (!cancelled) {
                setTravelLogSyncBanner(kind);
                setTravelLogSyncBannerDismissed(false);
              }
              return;
            }
            const data = await res.json();
            if (cancelled || !data) return;
            if (!cancelled) {
              setTravelLogSyncBanner(null);
              setTravelLogSyncBannerDismissed(false);
              setTravelLogSaveFailed(false);
              setTravelLogSaveBannerDismissed(false);
            }
            if (Array.isArray(data.airlines)) setFlownAirlines(data.airlines);
            if (Array.isArray(data.airports)) setVisitedAirports(data.airports);
            if (typeof data.lastUpdated === 'number') setLastUpdated(data.lastUpdated);
          } catch {
            if (!cancelled) {
              setTravelLogSyncBanner('offline');
              setTravelLogSyncBannerDismissed(false);
            }
          }
        })();
        return () => { cancelled = true; };
      }, [employeeId, travelLogLoadNonce]);

      useEffect(() => {
        if (!employeeId) {
          setTravelLogSyncBanner(null);
          setTravelLogSyncBannerDismissed(false);
          setTravelLogSaveFailed(false);
          setTravelLogSaveBannerDismissed(false);
        }
      }, [employeeId]);

      useEffect(() => {
        if (!employeeId) return;
        const onOffline = () => {
          setTravelLogSyncBanner('offline');
          setTravelLogSyncBannerDismissed(false);
        };
        const onOnline = () => setTravelLogLoadNonce(n => n + 1);
        window.addEventListener('offline', onOffline);
        window.addEventListener('online', onOnline);
        return () => {
          window.removeEventListener('offline', onOffline);
          window.removeEventListener('online', onOnline);
        };
      }, [employeeId]);

      // Persist to backend (debounced) when travel log changes
      useEffect(() => {
        if (!employeeId) return;
        if (travelLogSaveTimerRef.current) clearTimeout(travelLogSaveTimerRef.current);
        travelLogSaveTimerRef.current = setTimeout(() => {
          travelLogSaveTimerRef.current = null;
          const payload = {
            employeeId,
            airlines: flownAirlines,
            airports: visitedAirports,
            lastUpdated: lastUpdated || Date.now(),
          };
          fetch('/api/travel-log', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          })
            .then((res) => {
              if (res.ok) {
                setTravelLogSaveFailed(false);
                setTravelLogSaveBannerDismissed(false);
              } else {
                setTravelLogSaveFailed(true);
                setTravelLogSaveBannerDismissed(false);
              }
            })
            .catch(() => {
              setTravelLogSaveFailed(true);
              setTravelLogSaveBannerDismissed(false);
            });
        }, 550);
        return () => {
          if (travelLogSaveTimerRef.current) clearTimeout(travelLogSaveTimerRef.current);
        };
      }, [employeeId, flownAirlines, visitedAirports, lastUpdated]);

      const [airlineFilter, setAirlineFilter] = useState('all');
      const [airportFilter, setAirportFilter] = useState('all');
      const [airlineSort, setAirlineSort] = useState('name');

      const filteredAirlines = useMemo(() => {
        let list = airlines.filter(a => a.name.toLowerCase().includes(airlineSearch.toLowerCase()));
        if (airlineFilter === 'flown') list = list.filter(a => flownAirlines.includes(a.name));
        else if (airlineFilter === 'notflown') list = list.filter(a => !flownAirlines.includes(a.name));
        if (airlineSort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
        else if (airlineSort === 'region') list = [...list].sort((a, b) => a.country.localeCompare(b.country));
        else if (airlineSort === 'zed') list = [...list].sort((a, b) => (a.zed || '').localeCompare(b.zed || ''));
        return list;
      }, [airlineSearch, airlines, airlineFilter, airlineSort, flownAirlines]);

      const airportEntries = useMemo(() => {
        let entries = Object.entries(airports).map(([code, data]) => ({ code, ...data }));
        if (airportSearch) entries = entries.filter(a => a.code.toLowerCase().includes(airportSearch.toLowerCase()) || a.name.toLowerCase().includes(airportSearch.toLowerCase()) || a.city.toLowerCase().includes(airportSearch.toLowerCase()));
        if (airportFilter === 'visited') entries = entries.filter(a => visitedAirports.includes(a.code));
        else if (airportFilter === 'notvisited') entries = entries.filter(a => !visitedAirports.includes(a.code));
        return entries;
      }, [airports, airportSearch, airportFilter, visitedAirports]);

      const airportsByCountry = useMemo(() => {
        const grouped = {};
        airportEntries.forEach(a => {
          if (!grouped[a.country]) grouped[a.country] = [];
          grouped[a.country].push(a);
        });
        return Object.entries(grouped).sort((a, b) => a[0].localeCompare(b[0]));
      }, [airportEntries]);

      const lastUpdatedLabel = React.useMemo(() => {
        if (!lastUpdated) return null;
        try {
          return formatSiteDateTime(lastUpdated);
        } catch {
          return null;
        }
      }, [lastUpdated]);

      const tabs = [
        { id: 'airlines', label: 'Airlines', icon: Icons.Plane, count: `${flownAirlines.length}/${airlines.length}` },
        { id: 'airports', label: 'Airports', icon: Icons.MapPin, count: `${visitedAirports.length}` },
        { id: 'stats', label: 'Stats', icon: Icons.Trophy, count: null },
      ];

      const handleCopySummary = async () => {
        const parts = [
          t('travellog_summary_clip'),
          `${flownAirlines.length} ${t('travellog_airlines_flown_clip')}`,
          `${visitedAirports.length} ${t('travellog_airports_visited_clip')}`,
          `${visitedCountries.length} ${t('travellog_countries_clip')}`,
          `${visitedContinents.length} ${t('travellog_continents_clip')}`,
        ];
        const text = parts.join(' · ');
        const ok = await copyText(text);
        if (ok) {
          setCopiedSummary(true);
          setTimeout(() => setCopiedSummary(false), 2000);
        }
      };

      return (
        <div className="space-y-6 animate-slide-up">
          {showResetConfirm && (
            <ConfirmDeleteModal
              message={t('travellog_reset_confirm_message')}
              confirmLabel={t('travellog_reset_confirm')}
              onConfirm={() => {
                saveAirlines([]);
                saveAirports([]);
                touchLastUpdated();
                setShowResetConfirm(false);
              }}
              onCancel={() => setShowResetConfirm(false)}
            />
          )}
        <div className={toolShellClass(darkMode)}>
            {/* Header */}
            <div className={TOOL_HEADER_CLASS}>
              <div className="flex items-center justify-between gap-4 flex-wrap">
                <div className="flex items-center gap-4">
                  <div className={toolIconWrapClass(darkMode)}>
                    <Icons.MapPin className="w-6 h-6 text-white" />
                  </div>
                  <div>
                    <h2 className={TOOL_H2_CLASS}>{t('travellog_title')}</h2>
                    <p className={TOOL_SUBTITLE_CLASS}>{t('travellog_subtitle')}</p>
                    <p className="text-blue-200/60 font-semibold text-[9px] mt-1">
                      {flownAirlines.length} {t('travellog_airlines')} · {visitedAirports.length} {t('travellog_airports')} · {visitedCountries.length} {t('travellog_countries')} · {visitedContinents.length} {t('travellog_continents')}
                    </p>
                    <ToolTrustChips
                      darkMode={darkMode}
                      t={t}
                      personal
                      freshnessLine={lastUpdatedLabel ? t('trust_line_log_last_saved').replace('{when}', lastUpdatedLabel) : null}
                    />
                  </div>
                </div>
                <div className="flex flex-col items-end gap-2">
                  <button
                    onClick={() => setShowResetConfirm(true)}
                    className="px-4 py-2 bg-white/10 hover:bg-red-500/80 text-white/60 hover:text-white font-black uppercase tracking-widest text-[9px] rounded-xl transition-all border border-white/10 flex items-center gap-1.5"
                  >
                    <Icons.Trash className="w-3 h-3" /> {t('travellog_reset_all')}
                  </button>
                </div>
              </div>
            </div>

            {/* Tab navigation */}
            <div
              className={`px-4 sm:px-8 lg:px-10 py-4 border-b flex flex-wrap gap-2 ${darkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-50 border-slate-100'}`}
              role="tablist"
              aria-label="Travel log sections"
            >
              {tabs.map(tabDef => (
                <button
                  key={tabDef.id}
                  id={`travel-log-tab-btn-${tabDef.id}`}
                  role="tab"
                  type="button"
                  aria-selected={tab === tabDef.id}
                  aria-controls={`travel-log-tab-${tabDef.id}`}
                  tabIndex={tab === tabDef.id ? 0 : -1}
                  onClick={() => handleTabChange(tabDef.id)}
                  onKeyDown={(e) => {
                    const i = tabs.findIndex((t) => t.id === tabDef.id);
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                      e.preventDefault();
                      focusTravelLogTab(tabs[(i + 1) % tabs.length].id);
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                      e.preventDefault();
                      focusTravelLogTab(tabs[(i - 1 + tabs.length) % tabs.length].id);
                    } else if (e.key === 'Home') {
                      e.preventDefault();
                      focusTravelLogTab(tabs[0].id);
                    } else if (e.key === 'End') {
                      e.preventDefault();
                      focusTravelLogTab(tabs[tabs.length - 1].id);
                    }
                  }}
                  className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${tab === tabDef.id ? 'bg-[#152C53] text-white shadow-lg' : (darkMode ? 'bg-slate-700 text-slate-400 hover:text-white' : 'bg-white text-slate-500 hover:text-[#152C53] border border-slate-200')}`}
                >
                  <tabDef.icon className="w-3.5 h-3.5" /> {t(`travellog_tab_${tabDef.id}`)}
                  {tabDef.count && <span className={`px-2 py-0.5 rounded-full text-[8px] ${tab === tabDef.id ? 'bg-white/20' : (darkMode ? 'bg-slate-600' : 'bg-slate-100')}`}>{tabDef.count}</span>}
                </button>
              ))}
            </div>

            <div className={TOOL_BODY_CLASS}>
              {employeeId && travelLogSyncBanner && !travelLogSyncBannerDismissed && (
                <div
                  role="alert"
                  className={`mb-4 flex items-start gap-3 rounded-2xl border px-4 py-3 ${travelLogSyncBanner === 'offline' ? (darkMode ? 'bg-amber-950/40 border-amber-700/50 text-amber-100/95' : 'bg-amber-50 border-amber-200 text-amber-950') : (darkMode ? 'bg-slate-800/90 border-slate-600 text-slate-200' : 'bg-slate-100 border-slate-300 text-slate-800')}`}
                >
                  <Icons.AlertTriangle className={`w-5 h-5 shrink-0 mt-0.5 ${travelLogSyncBanner === 'offline' ? (darkMode ? 'text-amber-400' : 'text-amber-600') : (darkMode ? 'text-slate-400' : 'text-slate-500')}`} aria-hidden="true" />
                  <p className="flex-1 text-xs sm:text-sm font-semibold leading-relaxed">
                    {travelLogSyncBanner === 'offline' ? t('travellog_offline_banner') : t('travellog_sync_failed_banner')}
                  </p>
                  <button
                    type="button"
                    onClick={() => setTravelLogSyncBannerDismissed(true)}
                    className={`shrink-0 p-1.5 rounded-lg transition-colors ${darkMode ? 'hover:bg-white/10 text-slate-400 hover:text-white' : 'hover:bg-black/5 text-slate-500 hover:text-slate-800'}`}
                    aria-label={t('travellog_sync_dismiss_aria')}
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>
              )}
              {employeeId && travelLogSaveFailed && !travelLogSaveBannerDismissed && (
                <div
                  role="status"
                  className={`mb-4 flex items-start gap-3 rounded-2xl border px-4 py-3 ${darkMode ? 'bg-rose-950/35 border-rose-800/50 text-rose-50' : 'bg-rose-50 border-rose-200 text-rose-950'}`}
                >
                  <Icons.AlertTriangle className={`w-5 h-5 shrink-0 mt-0.5 ${darkMode ? 'text-rose-400' : 'text-rose-600'}`} aria-hidden="true" />
                  <p className="flex-1 text-xs sm:text-sm font-semibold leading-relaxed">{t('travellog_save_failed_banner')}</p>
                  <button
                    type="button"
                    onClick={() => setTravelLogSaveBannerDismissed(true)}
                    className={`shrink-0 p-1.5 rounded-lg transition-colors ${darkMode ? 'hover:bg-white/10 text-rose-300 hover:text-white' : 'hover:bg-black/5 text-rose-600 hover:text-rose-900'}`}
                    aria-label={t('travellog_save_dismiss_aria')}
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>
              )}
              {/* ── AIRLINES TAB ── */}
              {tab === 'airlines' && (
                <section
                  id="travel-log-tab-airlines"
                  role="tabpanel"
                  aria-labelledby="travel-log-tab-btn-airlines"
                  className="space-y-4"
                >
                  <div className="relative">
                    <Icons.Search className={`absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 ${darkMode ? 'text-slate-500' : 'text-slate-300'}`} />
                    <input type="text" placeholder={t('travellog_search_airlines')} value={airlineSearch} onChange={e => setAirlineSearch(e.target.value)}
                      className={`w-full pl-11 pr-5 py-3 rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 text-white focus:border-[#FFC136]' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'} border`} />
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <span className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('travellog_show')}</span>
                    {['all', 'flown', 'notflown'].map(f => (
                      <button key={f} onClick={() => setAirlineFilter(f)} className={`px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase tracking-widest ${airlineFilter === f ? 'bg-[#152C53] text-white' : darkMode ? 'bg-slate-700 text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-500 hover:text-[#152C53]'}`}>
                        {f === 'all' ? t('travellog_all') : f === 'flown' ? t('travellog_flown_only') : t('travellog_not_flown')}
                      </button>
                    ))}
                    <span className={`text-[9px] font-black uppercase tracking-widest ml-2 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('travellog_sort')}</span>
                    {['name', 'region', 'zed'].map(s => (
                      <button key={s} onClick={() => setAirlineSort(s)} className={`px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase tracking-widest ${airlineSort === s ? 'bg-[#152C53] text-white' : darkMode ? 'bg-slate-700 text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-500 hover:text-[#152C53]'}`}>
                        {s === 'name' ? t('travellog_name') : s === 'region' ? t('travellog_region') : t('travellog_sort_zed')}
                      </button>
                    ))}
                  </div>
                  {flownAirlines.length === 0 && !airlineSearch && (
                    <div className={`${darkMode ? 'bg-slate-800/80 border-slate-700 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-600'} border rounded-xl px-4 py-3 text-[10px] font-bold uppercase tracking-widest`}>
                      {t('travellog_empty_airlines')}
                    </div>
                  )}
                  <div className={`rounded-xl border overflow-hidden ${darkMode ? 'border-slate-700' : 'border-slate-200'}`}>
                    <div className="max-h-[500px] overflow-y-auto custom-scroll">
                      {filteredAirlines.length === 0 ? (
                        <div className="px-4 py-6 text-center text-[10px] font-bold uppercase tracking-widest text-slate-400">
                          {t('travellog_no_match_airlines')}
                        </div>
                      ) : (
                        filteredAirlines.map(a => {
                          const isFlown = flownAirlines.includes(a.name);
                          return (
                            <button
                              key={a.name}
                              onClick={() => toggleAirline(a.name)}
                              className={`w-full px-4 py-3 flex items-center justify-between border-b last:border-0 transition-all min-h-[44px] ${isFlown ? (darkMode ? 'bg-emerald-950/30 border-slate-700' : 'bg-emerald-50 border-emerald-100') : (darkMode ? 'bg-slate-800 border-slate-700 hover:bg-slate-750' : 'bg-white border-slate-100 hover:bg-slate-50')}`}
                            >
                              <div className="flex items-center gap-3">
                                <span className="text-lg">{a.flag}</span>
                                <div className="text-left">
                                  <span className={`font-bold text-sm block ${isFlown ? (darkMode ? 'text-emerald-300' : 'text-emerald-700') : (darkMode ? 'text-slate-300' : 'text-slate-700')}`}>{a.name}</span>
                                  <span className={`text-[10px] ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{a.country}</span>
                                </div>
                              </div>
                              <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${isFlown ? 'bg-emerald-500 border-emerald-500 text-white' : (darkMode ? 'border-slate-600' : 'border-slate-300')}`}>

                  <div className={`text-center py-3 rounded-xl ${darkMode ? 'bg-slate-800' : 'bg-slate-50'}`}>

                      {flownAirlines.length} {t('travellog_of')} {airlines.length} {t('travellog_airlines')} {t('travellog_flown')} · {Math.round(flownAirlines.length / airlines.length * 100)}% {t('travellog_complete')}
                    </span>
                    <div className={`w-full max-w-xs mx-auto h-2 rounded-full mt-2 overflow-hidden ${darkMode ? 'bg-slate-700' : 'bg-slate-200'}`}>

              {/* ── AIRPORTS TAB ── */}
              {tab === 'airports' && (
                <section
                  id="travel-log-tab-airports"
                  role="tabpanel"
                  aria-labelledby="travel-log-tab-btn-airports"
                  className="space-y-4"
                >
                  <div className="relative">
                    <Icons.Search className={`absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 ${darkMode ? 'text-slate-500' : 'text-slate-300'}`} />
                    <input type="text" placeholder={t('travellog_search_airports')} value={airportSearch} onChange={e => setAirportSearch(e.target.value)}
                      className={`w-full pl-11 pr-5 py-3 rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 text-white focus:border-[#FFC136]' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'} border`} />
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <span className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('travellog_show')}</span>

                      <button key={f} onClick={() => setAirportFilter(f)} className={`px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase tracking-widest ${airportFilter === f ? 'bg-[#152C53] text-white' : darkMode ? 'bg-slate-700 text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-500 hover:text-[#152C53]'}`}>
                        {f === 'all' ? t('travellog_all') : f === 'visited' ? t('travellog_visited_only') : t('travellog_not_visited')}
                      </button>

                  </div>
                  {visitedAirports.length === 0 && !airportSearch && (
                    <div className={`${darkMode ? 'bg-slate-800/80 border-slate-700 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-600'} border rounded-xl px-4 py-3 text-[10px] font-bold uppercase tracking-widest`}>
                      {t('travellog_empty_airports')}
                    </div>
                  )}
                  <div className="max-h-[500px] overflow-y-auto custom-scroll space-y-4">
                    {airportsByCountry.length === 0 ? (
<div className="px-4 py-6 text-center text-[10px] font-bold uppercase tracking-widest text-slate-400">
                      {t('travellog_no_match_airports')}
                    </div>
                    ) : (
                      airportsByCountry.map(([country, aps]) => {
                        const visitedInCountry = aps.filter(a => visitedAirports.includes(a.code)).length;
                        return (

                            <div className="flex items-center justify-between mb-2">
                              <span className={`text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{country}</span>

                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                              {aps.map(a => {
                                const isVisited = visitedAirports.includes(a.code);
                                return (
                                  <button
                                    key={a.code}
                                    onClick={() => toggleAirport(a.code)}
                                    className={`px-3 py-2.5 rounded-xl text-left transition-all min-h-[44px] border ${isVisited ? (darkMode ? 'bg-emerald-950/30 border-emerald-800 text-emerald-300' : 'bg-emerald-50 border-emerald-200 text-emerald-700') : (darkMode ? 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-400')}`}
                                  >
                                    <span className="font-black text-xs block">{a.code}</span>
                                    <span className={`text-[9px] font-medium block truncate ${isVisited ? '' : (darkMode ? 'text-slate-600' : 'text-slate-400')}`}>{a.city}</span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                  <div className={`text-center py-3 rounded-xl ${darkMode ? 'bg-slate-800' : 'bg-slate-50'}`}>
                    <span className={`text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                      {visitedAirports.length} {t('travellog_airports_visited')} · {visitedCountries.length} {t('travellog_countries')}
                    </span>
                  </div>
                </section>
              )}

              {/* ── STATS TAB ── */}
              {tab === 'stats' && (
                <section
                  id="travel-log-tab-stats"
                  role="tabpanel"
                  aria-labelledby="travel-log-tab-btn-stats"
                  className="space-y-6"
                >
                  <div className="flex items-center justify-between gap-3 flex-wrap">
                    <p className={`text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                      {t('travellog_summary')}
                    </p>
                    <button
                      type="button"
                      onClick={handleCopySummary}
                      className={`px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center gap-1.5 ${darkMode ? 'bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700' : 'bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100'}`}
                    >
                      <Icons.Copy className="w-3 h-3" />
                      {copiedSummary ? t('common_copied') : t('travellog_copy_summary')}
                    </button>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    {[
                      { labelKey: 'travellog_airlines_flown', value: flownAirlines.length, icon: Icons.Plane, color: 'text-blue-500' },
                      { labelKey: 'travellog_airports_visited_label', value: visitedAirports.length, icon: Icons.MapPin, color: 'text-emerald-500' },
                      { labelKey: 'travellog_countries_label', value: visitedCountries.length, icon: Icons.Globe, color: 'text-purple-500' },
                      { labelKey: 'travellog_continents_label', value: visitedContinents.length, icon: Icons.Route, color: 'text-amber-500' },
                    ].map(s => (
                      <div key={s.labelKey} className={`p-5 rounded-2xl border text-center ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                        <s.icon className={`w-6 h-6 mx-auto mb-2 ${s.color}`} />
                        <div className={`text-3xl font-black ${darkMode ? 'text-white' : 'text-[#152C53]'}`}>{s.value}</div>
                        <div className={`text-[9px] font-black uppercase tracking-widest mt-1 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t(s.labelKey)}</div>
                      </div>
                    ))}
                  </div>

                  {/* Airline completion by region */}
                  <div className={`p-5 rounded-2xl border ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                    <h3 className={`text-[10px] font-black uppercase tracking-widest mb-4 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('travellog_airlines_by_region')}</h3>
                    {[
                      { label: 'Canada', countries: ['Canada'], color: 'bg-red-500' },
                      { label: 'USA', countries: ['USA'], color: 'bg-blue-500' },
                      { label: 'Europe', countries: ['UK','France','Germany','Italy','Spain','Netherlands','Switzerland','Ireland','Portugal','Greece','Iceland','Norway','Sweden','Finland','Denmark','Poland','Austria','Belgium','Czech Rep.','Croatia','Turkey','Romania','Scandinavia','Malta','Luxembourg'], color: 'bg-violet-500' },
                      { label: 'Asia & Pacific', countries: ['Japan','China','South Korea','India','Thailand','Singapore','Vietnam','Philippines','Indonesia','Malaysia','Hong Kong','Taiwan','Pakistan','Sri Lanka','Brunei','Australia','New Zealand','Fiji','Fr. Polynesia'], color: 'bg-pink-500' },
                      { label: 'Middle East', countries: ['UAE','Qatar','Saudi Arabia','Oman','Kuwait','Bahrain','Jordan','Israel'], color: 'bg-amber-500' },
                      { label: 'Americas', countries: ['Mexico','Argentina','Brazil','Colombia','Chile','Dominican Rep.','Trinidad','Venezuela','Bolivia','Cayman Is.'], color: 'bg-emerald-500' },
                      { label: 'Africa', countries: ['Morocco','S. Africa','Kenya'], color: 'bg-orange-500' },
                    ].map(region => {
                      const total = airlines.filter(a => region.countries.includes(a.country)).length;
                      if (total === 0) return null;
                      const flown = flownAirlines.filter(n => { const a = airlines.find(x => x.name === n); return a && region.countries.includes(a.country); }).length;
                      const pct = total > 0 ? Math.round(flown / total * 100) : 0;
                      return (
                        <div key={region.label} className="mb-3 last:mb-0">
                          <div className="flex items-center justify-between mb-1">
                            <span className={`text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>{region.label}</span>
                            <span className={`text-[10px] font-bold ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{flown}/{total} · {pct}%</span>
                          </div>
                          <div className={`w-full h-2.5 rounded-full overflow-hidden ${darkMode ? 'bg-slate-700' : 'bg-slate-100'}`}>
                            <div className={`h-full rounded-full transition-all duration-700 ${region.color}`} style={{ width: `${pct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Countries visited list */}
                  {visitedCountries.length > 0 && (
                    <div className={`p-5 rounded-2xl border ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                      <h3 className={`text-[10px] font-black uppercase tracking-widest mb-3 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('travellog_countries_visited')} ({visitedCountries.length})</h3>
                      <div className="flex flex-wrap gap-2">
                        {visitedCountries.map(c => (
                          <span key={c} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold ${darkMode ? 'bg-slate-700 text-slate-300' : 'bg-slate-100 text-slate-600'}`}>{c}</span>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Continents */}
                  {visitedContinents.length > 0 && (
                    <div className={`p-5 rounded-2xl border ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                      <h3 className={`text-[10px] font-black uppercase tracking-widest mb-3 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('travellog_continents_reached')} ({visitedContinents.length}/7)</h3>
                      <div className="flex flex-wrap gap-2">
                        {['North America', 'South America', 'Europe', 'Asia', 'Africa', 'Oceania', 'Middle East'].map(c => {
                          const reached = visitedContinents.includes(c);
                          return (
                            <span key={c} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all ${reached ? 'bg-emerald-500 text-white' : (darkMode ? 'bg-slate-700 text-slate-600' : 'bg-slate-100 text-slate-300')}`}>{reached ? '✓ ' : ''}{c}</span>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </section>
              )}

              <div className={`mt-6 text-[9px] font-bold uppercase tracking-widest text-center ${darkMode ? 'text-slate-600' : 'text-slate-400'}`}>
                {t('travellog_storage_notice')}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TripTimelinePage({ darkMode, airlines, airports, tripId, onBack, onDirtyChange }) {
      const { t, locale } = React.useContext(I18nContext);
      const [trips, setTrips] = useState(() => {
        const raw = getJSON('my_trips', []);
        const arr = Array.isArray(raw) ? raw : [];
        const clean = sanitizeMyTripsList(arr);
        if (myTripsNeedsSanitize(arr)) setJSON('my_trips', clean);
        return clean;
      });
      const trip = useMemo(() => trips.find((x) => x.id === tripId), [trips, tripId]);

      const timelineRouteMiles = useMemo(() => {
        if (!trip?.segments) return 0;
        let sum = 0;
        for (const s of trip.segments) {
          const o = airports[normalizeIataCode(s.origin)];
          const d = airports[normalizeIataCode(s.destination)];
          if (o && d) sum += calculateGreatCircleMiles(o.lat, o.lon, d.lat, d.lon);
        }
        return Math.round(sum);
      }, [trip, airports]);

      const tripsSnapshotForUndoRef = useRef(null);
      tripsSnapshotForUndoRef.current = trips;
      const undoStackRef = useRef([]);
      const redoStackRef = useRef([]);
      const [undoTick, setUndoTick] = useState(0);
      const [lastSavedAt, setLastSavedAt] = useState(null);

      const onTimelineDragStart = React.useCallback(() => {
        const snap = tripsSnapshotForUndoRef.current;
        if (snap == null) return;
        try {
          undoStackRef.current.push(JSON.stringify(snap));
          if (undoStackRef.current.length > 35) undoStackRef.current.shift();
          redoStackRef.current = [];
          setUndoTick((x) => x + 1);
        } catch (_) {}
      }, []);

      const saveTrips = (updated) => {
        setTrips(updated);
        setJSON('my_trips', updated);
      };

      const updateTrip = (id, changes) => {
        setTrips((prev) => {
          const next = prev.map((tr) => (tr.id === id ? { ...tr, ...changes } : tr));
          setJSON('my_trips', next);
          return next;
        });
      };

      const updateSegment = (tripId2, segId, changes, meta) => {
        const timelineDragEnd = meta && meta.timelineDragEnd === true;
        setTrips((prevTrips) => {
          if (!timelineDragEnd) {
            redoStackRef.current = [];
            undoStackRef.current.push(JSON.stringify(prevTrips));
            if (undoStackRef.current.length > 35) undoStackRef.current.shift();
          }
          const tr = prevTrips.find((x) => x.id === tripId2);
          if (!tr) return prevTrips;
          const segments = tr.segments.map((s) => {
            if (s.id !== segId) return s;
            const updated = { ...s, ...changes };
            if (changes.airline) {
              const match = airlines.find((a) => a.name === changes.airline);
              if (match) updated.fareZone = match.zed;
            }
            return updated;
          });
          const next = prevTrips.map((x) => (x.id === tripId2 ? { ...x, segments } : x));
          setJSON('my_trips', next);
          return next;
        });
        if (!timelineDragEnd) {
          setUndoTick((x) => x + 1);
        }
        setLastSavedAt(new Date());
      };

      const duplicateSegment = (segId) => {
        redoStackRef.current = [];
        setTrips((prevTrips) => {
          const tr = prevTrips.find((x) => x.id === trip.id);
          if (!tr) return prevTrips;
          const idx = tr.segments.findIndex((s) => s.id === segId);
          if (idx < 0) return prevTrips;
          undoStackRef.current.push(JSON.stringify(prevTrips));
          if (undoStackRef.current.length > 35) undoStackRef.current.shift();
          const s = tr.segments[idx];
          const dup = { ...s, id: `seg_${Date.now()}_${Math.random().toString(36).slice(2, 6)}` };
          delete dup.segStatus;
          delete dup.timelineColor;
          delete dup.notes;
          const segments = [...tr.segments.slice(0, idx + 1), dup, ...tr.segments.slice(idx + 1)];
          const next = prevTrips.map((x) => (x.id === trip.id ? { ...x, segments } : x));
          setJSON('my_trips', next);
          return next;
        });
        setUndoTick((x) => x + 1);
        setLastSavedAt(new Date());
      };

      const undoTimelineEdit = () => {
        const raw = undoStackRef.current.pop();
        if (!raw) return;
        try {
          setTrips((current) => {
            redoStackRef.current.push(JSON.stringify(current));
            if (redoStackRef.current.length > 35) redoStackRef.current.shift();
            const prev = JSON.parse(raw);
            setJSON('my_trips', prev);
            return prev;
          });
          setUndoTick((x) => x + 1);
          setLastSavedAt(new Date());
        } catch (_) {}
      };

      const redoTimelineEdit = () => {
        const raw = redoStackRef.current.pop();
        if (!raw) return;
        try {
          setTrips((current) => {
            undoStackRef.current.push(JSON.stringify(current));
            if (undoStackRef.current.length > 35) undoStackRef.current.shift();
            const next = JSON.parse(raw);
            setJSON('my_trips', next);
            return next;
          });
          setUndoTick((x) => x + 1);
          setLastSavedAt(new Date());
        } catch (_) {}
      };

      const canUndoTimeline = useMemo(() => {
        void undoTick;
        return undoStackRef.current.length > 0;
      }, [undoTick]);

      const canRedoTimeline = useMemo(() => {
        void undoTick;
        return redoStackRef.current.length > 0;
      }, [undoTick]);

      const timelineDirty = canUndoTimeline || canRedoTimeline;
      React.useEffect(() => {
        if (typeof onDirtyChange === 'function') onDirtyChange(timelineDirty);
        return () => {
          if (typeof onDirtyChange === 'function') onDirtyChange(false);
        };
      }, [timelineDirty, onDirtyChange]);

      React.useEffect(() => {
        const onStorage = (e) => {
          if (e.key === 'my_trips' && e.newValue) {
            try {
              const parsed = JSON.parse(e.newValue);
              setTrips(sanitizeMyTripsList(Array.isArray(parsed) ? parsed : []));
            } catch (_) {}
          }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      if (!tripId) {
        return (
          <div className="space-y-4 animate-slide-up">
            <button type="button" onClick={() => onBack(null)} className={`flex items-center gap-2 font-black uppercase tracking-widest text-xs transition-colors ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-[#152C53]'}`}>
              <Icons.ArrowLeft className="w-4 h-4" /> {t('mytrips_back')}
            </button>
            <p className={`text-sm ${darkMode ? 'text-slate-500' : 'text-slate-600'}`}>{t('mytrips_timeline_missing')}</p>
          </div>
        );
      }

      if (!trip) {
        return (
          <div className="space-y-4 animate-slide-up">
            <button type="button" onClick={() => onBack(null)} className={`flex items-center gap-2 font-black uppercase tracking-widest text-xs transition-colors ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-[#152C53]'}`}>
              <Icons.ArrowLeft className="w-4 h-4" /> {t('mytrips_back')}
            </button>
            <p className={`text-sm ${darkMode ? 'text-slate-500' : 'text-slate-600'}`}>{t('mytrips_timeline_not_found')}</p>
          </div>
        );
      }

      return (
        <div className="flex flex-col flex-1 min-h-0 w-full gap-2 sm:gap-3 animate-slide-up">
          <div className="flex flex-col gap-2 shrink-0 px-0.5">
            <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
              <div>
                <button type="button" onClick={() => onBack(trip.id)} className={`flex items-center gap-2 font-black uppercase tracking-widest text-xs transition-colors mb-1.5 sm:mb-2 ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-[#152C53]'}`}>
                  <Icons.ArrowLeft className="w-4 h-4" /> {t('mytrips_timeline_back')}
                </button>
                <h2 className={`text-lg sm:text-2xl md:text-3xl font-black uppercase tracking-tight ${darkMode ? 'text-white' : 'text-[#152C53]'}`}>{trip.name}</h2>
                <p className={`text-[10px] font-bold uppercase tracking-widest mt-0.5 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_timeline_subtitle')}</p>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button type="button" onClick={undoTimelineEdit} disabled={!canUndoTimeline} className={`px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest border transition-all ${canUndoTimeline ? (darkMode ? 'bg-slate-800 border-slate-600 text-slate-200 hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50') : 'opacity-40 cursor-not-allowed border-transparent'}`}>
                  {t('mytrips_timeline_undo')}
                </button>
                <button type="button" onClick={redoTimelineEdit} disabled={!canRedoTimeline} className={`px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest border transition-all ${canRedoTimeline ? (darkMode ? 'bg-slate-800 border-slate-600 text-slate-200 hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50') : 'opacity-40 cursor-not-allowed border-transparent'}`}>
                  {t('mytrips_timeline_redo')}
                </button>
                    {lastSavedAt && (
                  <span className={`text-[8px] font-bold uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                    {t('mytrips_timeline_saved')}{' '}
                    {formatSiteDateTime(lastSavedAt)}
                  </span>
                )}
              </div>
            </div>
          </div>

          <div className="flex-1 min-h-0 flex flex-col gap-3">
            {(!trip.segments || trip.segments.length === 0) ? (
              <div className={`flight-timeline-print-root flex-1 flex flex-col overflow-hidden rounded-xl sm:rounded-2xl border shadow-xl ${darkMode ? 'bg-[#1e293b] border-slate-700/60' : 'bg-white border-slate-300'}`}>
                <div className={`px-6 py-12 text-center text-sm font-medium ${darkMode ? 'text-slate-500' : 'text-slate-600'}`}>{t('mytrips_timeline_no_segments')}</div>
              </div>
            ) : (
              <div className="flex flex-col flex-1 min-h-0 gap-3">
                <div className="grid grid-cols-1 lg:grid-cols-2 lg:grid-rows-[minmax(0,1fr)] lg:items-stretch lg:h-full lg:min-h-0 gap-3 flex-1 min-h-0">
                  <div className="flex flex-col min-h-0 h-full lg:min-h-0">
                    <div className="shrink-0 px-0.5">
                      <p className={`text-[9px] font-black uppercase tracking-[0.2em] mb-1.5 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_section_route')}</p>
                      <div className={`h-px w-full mb-2 ${darkMode ? 'bg-slate-600/80' : 'bg-slate-200'}`} aria-hidden="true" />
                    </div>
                    <div className="w-full flex-1 min-h-0 flex flex-col h-full">
                      <MyTripsRouteMap
                        darkMode={darkMode}
                        airports={airports}
                        trip={trip}
                        tripName={trip.name}
                        t={t}
                        totalMiles={timelineRouteMiles}
                      />
                    </div>
                  </div>

                  <div className="flex flex-col min-h-0 h-full lg:min-h-0">
                    <div className="shrink-0 px-0.5">
                      <p className={`text-[9px] font-black uppercase tracking-[0.2em] mb-1.5 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_section_timeline')}</p>
                      <div className={`h-px w-full mb-2 ${darkMode ? 'bg-slate-600/80' : 'bg-slate-200'}`} aria-hidden="true" />
                    </div>
                    <div className={`flight-timeline-print-root min-h-0 flex flex-col flex-1 overflow-hidden rounded-xl sm:rounded-2xl border shadow-xl ${darkMode ? 'bg-[#1e293b] border-slate-700/60' : 'bg-white border-slate-300'}`}>
                      <GanttTimeline
                        trip={trip}
                        darkMode={darkMode}
                        locale={locale}
                        updateSegment={updateSegment}
                        airports={airports}
                        fillViewport
                        t={t}
                        onDuplicateSegment={duplicateSegment}
                        onTimelineDragStart={onTimelineDragStart}
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function TripPlanner({ darkMode, airlines, airports, onOpenTripTimeline, focusTripId, onFocusTripConsumed }) {
      const { t } = React.useContext(I18nContext);
      const [trips, setTrips] = useState(() => {
        const raw = getJSON('my_trips', []);
        const arr = Array.isArray(raw) ? raw : [];
        const clean = sanitizeMyTripsList(arr);
        if (myTripsNeedsSanitize(arr)) setJSON('my_trips', clean);
        return clean;
      });
      const [activeTrip, setActiveTrip] = useState(null);
      const [showNewTrip, setShowNewTrip] = useState(false);
      const [newTripName, setNewTripName] = useState('');
      const [newTripStart, setNewTripStart] = useState('');
      const [newTripEnd, setNewTripEnd] = useState('');
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [collapsedSegments, setCollapsedSegments] = useState(new Set());
      const [tripFilter, setTripFilter] = useState('all');
      const [tripSort, setTripSort] = useState('newest');
      const [tripSearch, setTripSearch] = useState('');
      const [currency, setCurrency] = useState('CAD');
      const [segmentDeleteConfirm, setSegmentDeleteConfirm] = useState(null);
      const [copied, setCopied] = useState(false);
      const [clipboardError, setClipboardError] = useState('');
      const [editingTripName, setEditingTripName] = useState(false);
      const [tripNameDraft, setTripNameDraft] = useState('');

      React.useEffect(() => {
        if (activeTrip) setSegmentDeleteConfirm(null);
      }, [activeTrip]);

      React.useEffect(() => {
        if (!clipboardError) return;
        const id = setTimeout(() => setClipboardError(''), 4500);
        return () => clearTimeout(id);
      }, [clipboardError]);

      React.useEffect(() => {
        if (!activeTrip) return;
        const tr = trips.find((x) => x.id === activeTrip);
        if (tr && !editingTripName) setTripNameDraft(tr.name);
      }, [activeTrip, trips, editingTripName]);

      React.useEffect(() => {
        if (!focusTripId) return;
        if (trips.some((tr) => tr.id === focusTripId)) {
          setActiveTrip(focusTripId);
          onFocusTripConsumed?.();
        }
      }, [focusTripId, trips, onFocusTripConsumed]);

      const saveTrips = (updated) => {
        setTrips(updated);
        setJSON('my_trips', updated);
      };

      const airportCodes = useMemo(() => Object.keys(airports).sort(), [airports]);

      const getSegmentDistance = (seg) => {
        const o = airports[seg.origin];
        const d = airports[seg.destination];
        if (o && d) return calculateGreatCircleMiles(o.lat, o.lon, d.lat, d.lon);
        return 0;
      };

      const getSegmentFare = (seg) => {
        const miles = getSegmentDistance(seg);
        const zone = getZoneByMiles(miles);
        if (!zone) return null;
        const airlineObj = seg.airline ? (Array.isArray(airlines) ? airlines.find(a => a.name === seg.airline) : null) : null;
        if (airlineObj) {
          const custom = typeof getAirlineFare === 'function' ? getAirlineFare(airlineObj.name, miles) : null;
          if (custom && custom.isCustom && !custom.unavailable) {
            const fareUsd = custom.currency === 'CAD' ? (custom.fare / getCadRate()) : custom.fare;
            return { miles, zone, fare: fareUsd };
          }
          const tier = (airlineObj.zed || 'LOW').toUpperCase();
          const genericUsd = typeof getGenericZedFareUSD === 'function' ? getGenericZedFareUSD(tier, miles) : null;
          if (genericUsd != null && genericUsd > 0) return { miles, zone, fare: genericUsd };
          const rates = BASE_ZED_RATES[zone];
          if (rates) { const fare = rates[tier] || rates['LOW'] || 0; if (fare) return { miles, zone, fare }; }
        }
        if (!seg.fareZone) return null;
        const tier = seg.fareZone.toUpperCase();
        const rates = BASE_ZED_RATES[zone];
        if (!rates) return null;
        const fare = rates[tier] || rates['LOW'] || 0;
        return { miles, zone, fare };
      };

      const TRIP_STATUSES = [
        { id: 'planning', labelKey: 'mytrips_planning', color: 'bg-blue-500' },
        { id: 'upcoming', labelKey: 'mytrips_upcoming', color: 'bg-[#FFC136]', text: 'text-[#152C53]' },
        { id: 'completed', labelKey: 'mytrips_completed', color: 'bg-emerald-500' },
      ];

      const TRAVELER_OPTIONS = [
        { id: 'employee', labelKey: 'mytrips_traveler_employee', icon: '👨‍✈️', max: 1 },
        { id: 'spouse', labelKey: 'mytrips_traveler_spouse', icon: '💍', max: 1 },
        { id: 'child', labelKey: 'mytrips_traveler_child', icon: '👧', max: 4 },
        { id: 'parent', labelKey: 'mytrips_traveler_parent', icon: '👨‍👩', max: 2 },
        { id: 'companion', labelKey: 'mytrips_traveler_companion', icon: '🧳', max: 1 },
      ];
