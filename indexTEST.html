      // Helper to get traveler count object from trip (handles legacy array format)
      const getTravelers = (trip) => {
        const t = trip.travelers;
        if (!t) return { employee: 1 };
        if (Array.isArray(t)) {
          const obj = {};
          t.forEach(id => { obj[id] = (obj[id] || 0) + 1; });
          return obj;
        }
        return t;
      };

      const getTravelerCount = (trip) => {
        const t = getTravelers(trip);
        return Object.values(t).reduce((sum, n) => sum + n, 0);
      };

      const createTrip = () => {
        if (!newTripName.trim()) return;
        const trip = {
          id: `trip_${Date.now()}`,
          name: newTripName.trim(),
          startDate: newTripStart,
          endDate: newTripEnd,
          segments: [],
          travelers: { employee: 1 },
          status: 'planning',
          created: new Date().toISOString(),
        };
        const updated = [trip, ...trips];
        saveTrips(updated);
        setActiveTrip(trip.id);
        setShowNewTrip(false);
        setNewTripName('');
        setNewTripStart('');
        setNewTripEnd('');
      };

      const createTripFromTemplate = (templateName, segmentCount) => {
        const seg = () => ({ id: `seg_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, airline: '', origin: '', destination: '', date: '', flightNo: '', fareZone: '', depTime: '', arrTime: '', aircraftIcao: '' });
        const segments = Array.from({ length: segmentCount }, seg);
        const trip = { id: `trip_${Date.now()}`, name: templateName, startDate: '', endDate: '', segments, travelers: { employee: 1 }, status: 'planning', created: new Date().toISOString() };
        saveTrips([trip, ...trips]);
        setActiveTrip(trip.id);
        setShowNewTrip(false);
        setNewTripName('');
      };

      const deleteTrip = (id) => {
        saveTrips(trips.filter(t => t.id !== id));
        if (activeTrip === id) setActiveTrip(null);
        setDeleteConfirm(null);
      };

      const duplicateTrip = (trip) => {
        const stripSeg = (s) => {
          const next = { ...s, id: `seg_${Date.now()}_${Math.random().toString(36).slice(2,6)}` };
          delete next.segStatus;
          delete next.timelineColor;
          delete next.notes;
          return next;
        };
        const copy = {
          ...trip,
          id: `trip_${Date.now()}`,
          name: `${trip.name} ${t('mytrips_copy_suffix')}`,
          status: 'planning',
          created: new Date().toISOString(),
          segments: trip.segments.map(stripSeg),
        };
        delete copy.notes;
        saveTrips([copy, ...trips]);
      };

      const updateTrip = (id, changes) => {
        const updated = trips.map(t => t.id === id ? { ...t, ...changes } : t);
        saveTrips(updated);
      };

      const addSegment = (tripId) => {
        const trip = trips.find(t => t.id === tripId);
        // Smart auto-chain: prefill origin from last segment's destination
        const lastSeg = trip?.segments?.length > 0 ? trip.segments[trip.segments.length - 1] : null;
        const seg = {
          id: `seg_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
          airline: '',
          origin: lastSeg?.destination || '',
          destination: '',
          date: '',
          flightNo: '',
          fareZone: '',
          depTime: '',
          arrTime: '',
          aircraftIcao: '',
        };
        if (trip) updateTrip(tripId, { segments: [...trip.segments, seg] });
      };

      const addReturnLeg = (tripId) => {
        const trip = trips.find(t => t.id === tripId);
        if (!trip || trip.segments.length === 0) return;
        const firstOrigin = trip.segments[0].origin;
        const lastDest = trip.segments[trip.segments.length - 1].destination;
        if (!firstOrigin || !lastDest) return;
        const seg = {
          id: `seg_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
          airline: '',
          origin: lastDest,
          destination: firstOrigin,
          date: trip.endDate || '',
          flightNo: '',
          fareZone: '',
          depTime: '',
          arrTime: '',
          aircraftIcao: '',
        };
        updateTrip(tripId, { segments: [...trip.segments, seg] });
      };

      const formatFare = (usd) => {
        const n = Number(usd) || 0;
        if (!n) return currency === 'CAD' ? '$0 CAD' : '$0.00 USD';
        if (currency === 'CAD') return `$${Math.round(n * getCadRate()).toLocaleString()} CAD`;
        return `$${roundUsdCents(n).toFixed(2)} USD`;
      };

      const adjustTraveler = (tripId, travelerId, delta) => {
        const trip = trips.find(t => t.id === tripId);
        if (!trip) return;
        const travelers = { ...getTravelers(trip) };
        const opt = TRAVELER_OPTIONS.find(t => t.id === travelerId);
        const current = travelers[travelerId] || 0;
        const next = Math.max(0, Math.min(opt?.max || 1, current + delta));
        if (next === 0) { delete travelers[travelerId]; }
        else { travelers[travelerId] = next; }
        // Ensure at least one traveler
        if (Object.values(travelers).reduce((s, n) => s + n, 0) === 0) travelers.employee = 1;
        updateTrip(tripId, { travelers });
      };

      const sortedTripsForFilter = useMemo(() => {
        let result = [...trips];
        if (tripFilter !== 'all') result = result.filter(t => (t.status || 'planning') === tripFilter);
        if (tripSort === 'newest') result.sort((a, b) => new Date(b.created) - new Date(a.created));
        else if (tripSort === 'oldest') result.sort((a, b) => new Date(a.created) - new Date(b.created));
        else if (tripSort === 'date') result.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
        else if (tripSort === 'name') result.sort((a, b) => a.name.localeCompare(b.name));
        return result;
      }, [trips, tripFilter, tripSort]);

      const filteredTrips = useMemo(() => {
        const q = tripSearch.trim().toLowerCase();
        if (!q) return sortedTripsForFilter;
        return sortedTripsForFilter.filter((trip) => {
          if (String(trip.name || '').toLowerCase().includes(q)) return true;
          return (trip.segments || []).some((s) =>
            [s.origin, s.destination, s.airline, s.flightNo, s.aircraftIcao].some((f) => String(f || '').toLowerCase().includes(q))
          );
        });
      }, [sortedTripsForFilter, tripSearch]);

      const updateSegment = (tripId, segId, changes) => {
        const trip = trips.find(t => t.id === tripId);
        if (!trip) return;
        const segments = trip.segments.map(s => {
          if (s.id !== segId) return s;
          const updated = { ...s, ...changes };
          if (changes.airline) {
            const match = airlines.find(a => a.name === changes.airline);
            if (match) updated.fareZone = match.zed;
          }
          return updated;
        });
        updateTrip(tripId, { segments });
      };

      const removeSegment = (tripId, segId) => {
        const trip = trips.find(t => t.id === tripId);
        if (trip) updateTrip(tripId, { segments: trip.segments.filter(s => s.id !== segId) });
      };

      const moveSegment = (tripId, segId, direction) => {
        const trip = trips.find(t => t.id === tripId);
        if (!trip) return;
        const segs = [...trip.segments];
        const idx = segs.findIndex(s => s.id === segId);
        if (idx < 0) return;
        const newIdx = idx + direction;
        if (newIdx < 0 || newIdx >= segs.length) return;
        [segs[idx], segs[newIdx]] = [segs[newIdx], segs[idx]];
        updateTrip(tripId, { segments: segs });
      };

      const toggleCollapse = (segId) => {
        setCollapsedSegments(prev => {
          const next = new Set(prev);
          next.has(segId) ? next.delete(segId) : next.add(segId);
          return next;
        });
      };

      const expandAllSegments = () => {
        setCollapsedSegments(new Set());
      };

      const collapseAllSegments = (tripId) => {
        const tr = trips.find((x) => x.id === tripId);
        if (!tr || !tr.segments.length) return;
        setCollapsedSegments(new Set(tr.segments.map((s) => s.id)));
      };

      const getTripTotalFare = (trip) => {
        let total = 0;
        let totalMiles = 0;
        const travelerCount = getTravelerCount(trip);
        trip.segments.forEach(seg => {
          const info = getSegmentFare(seg);
          if (info) { total += info.fare; totalMiles += info.miles; }
        });
        return { total: total * travelerCount, totalPerPerson: total, totalMiles, travelerCount };
      };

      const getAirlineEmbargo = (airlineName) => {
        const a = airlines.find(x => x.name === airlineName);
        if (!a) return null;
        const e = a.embargoes;
        if (!e || e === 'No current embargoes reported.' || e.trim().toLowerCase() === 'none.' || e.trim() === '') return null;
        return e;
      };

      // Connection time between segments (in minutes) — js/mytrips-timezones.js
      const getConnectionTime = (prevSeg, nextSeg) => {
        const tz = window.MTTripTZ;
        if (!tz || typeof tz.tripConnectionMinutesBetweenSegments !== 'function') return null;
        return tz.tripConnectionMinutesBetweenSegments(prevSeg, nextSeg, airports);
      };

      const getConnectionWarning = (minutes) => {
        if (minutes === null) return null;
        if (minutes > 1560) return null; // Over 26 hours — not a connection, likely separate travel days
        if (minutes < 0) return { level: 'error', text: 'Departure is before previous arrival', color: 'text-red-500', bg: darkMode ? 'bg-red-950/40 border-red-800' : 'bg-red-50 border-red-200' };
        if (minutes < 60) return { level: 'error', text: `Only ${minutes} min connection — very tight!`, color: 'text-red-500', bg: darkMode ? 'bg-red-950/40 border-red-800' : 'bg-red-50 border-red-200' };
        if (minutes < 120) return { level: 'warn', text: `${minutes} min connection — could be tight for international`, color: 'text-amber-500', bg: darkMode ? 'bg-amber-950/40 border-amber-800' : 'bg-amber-50 border-amber-200' };
        const hrs = Math.floor(minutes / 60);
        const mins = minutes % 60;
        return { level: 'ok', text: `${hrs}h ${mins}m connection`, color: darkMode ? 'text-slate-400' : 'text-slate-500', bg: darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200' };
      };

      const triggerCopiedFeedback = () => {
        setCopied(true);
        setClipboardError('');
        setTimeout(() => setCopied(false), 2000);
      };

      const copyTripSummary = async (trip) => {
        const fare = getTripTotalFare(trip);
        const codes = trip.segments.map(s => s.origin).filter(Boolean);
        const lastDest = trip.segments.length > 0 ? trip.segments[trip.segments.length - 1]?.destination : '';
        if (lastDest) codes.push(lastDest);

        let text = `✈️ ${trip.name}\n`;
        if (trip.startDate) text += `📅 ${formatStoredYmdDisplay(trip.startDate)}${trip.endDate ? ` → ${formatStoredYmdDisplay(trip.endDate)}` : ''}\n`;
        if (trip.travelers) {
          const counts = getTravelers(trip);
          const labels = TRAVELER_OPTIONS.filter(opt => counts[opt.id] > 0).map(opt => counts[opt.id] > 1 ? `${t(opt.labelKey)} (${counts[opt.id]})` : t(opt.labelKey));
          if (labels.length > 0) text += `👥 ${labels.join(', ')}\n`;
        }
        if (codes.length >= 2) text += `🛫 ${codes.join(' → ')}\n`;
        text += `📊 ${trip.segments.length} segment${trip.segments.length !== 1 ? 's' : ''}`;
        if (fare.totalMiles > 0) text += ` · ${fare.totalMiles.toLocaleString()} mi`;
        if (fare.total > 0) text += ` · ~${formatFare(fare.total)} est.`;
        text += '\n\n';

        trip.segments.forEach((seg, i) => {
          const sf = getSegmentFare(seg);
          text += `${i + 1}. `;
          if (seg.origin && seg.destination) text += `${seg.origin} → ${seg.destination}`;
          if (seg.airline) text += ` (${seg.airline})`;
          if (seg.date) text += ` — ${formatStoredYmdDisplay(seg.date)}`;
          if (seg.depTime) text += ` dep ${seg.depTime}`;
          if (seg.arrTime) text += ` arr ${seg.arrTime}`;
          if (seg.flightNo) text += ` [${seg.flightNo}]`;
          if (seg.aircraftIcao) text += ` · ${seg.aircraftIcao}`;
          if (sf) text += ` · ${formatFare(sf.fare)} · ${sf.miles.toLocaleString()} mi`;
          text += '\n';
        });

        if (trip.journal) text += `\n📖 Journal: ${trip.journal}\n`;

        const ok = await copyTextToClipboard(text);
        if (ok) triggerCopiedFeedback();
        else setClipboardError(t('mytrips_clipboard_failed'));
      };

      const copyTripToCalendar = async (trip) => {
        const { body, events } = buildTripICSString(trip);
        if (events > 0) {
          const ok = await copyTextToClipboard(body);
          if (ok) triggerCopiedFeedback();
          else setClipboardError(t('mytrips_clipboard_failed'));
          return;
        }
        let cal = `${trip.name}\n`;
        if (trip.startDate) cal += `Dates: ${formatStoredYmdDisplay(trip.startDate)}${trip.endDate ? ` to ${formatStoredYmdDisplay(trip.endDate)}` : ''}\n`;
        cal += `\nSegments:\n`;
        trip.segments.forEach((seg, i) => {
          cal += `${i + 1}. ${seg.origin || '?'} → ${seg.destination || '?'}`;
          if (seg.date) cal += ` (${formatStoredYmdDisplay(seg.date)})`;
          if (seg.airline) cal += ` ${seg.airline}`;
          cal += '\n';
        });
        const ok = await copyTextToClipboard(cal);
        if (ok) triggerCopiedFeedback();
        else setClipboardError(t('mytrips_clipboard_failed'));
      };

      const currentTrip = trips.find(t => t.id === activeTrip);
      const tripDateOrderBad = currentTrip && currentTrip.startDate && currentTrip.endDate && currentTrip.endDate.localeCompare(currentTrip.startDate) < 0;
      const segmentsTimeNoDate = currentTrip && (currentTrip.segments || []).some((s) => (s.depTime || s.arrTime) && !s.date);

      // ── TRIP LIST VIEW ──
      if (!activeTrip) {
        return (
          <div className="space-y-8 animate-slide-up">
        <div className={toolShellClass(darkMode)}>
              <div className={TOOL_HEADER_CLASS}>
                <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
                  <div className="flex items-center gap-4 min-w-0">
                    <div className={toolIconWrapClass(darkMode)}>
                      <Icons.Briefcase className="w-6 h-6 text-white" />
                    </div>
                    <div className="min-w-0">
                      <h2 className={TOOL_H2_CLASS}>{t('mytrips_title')}</h2>
                      <p className={`text-[10px] sm:text-xs font-bold uppercase tracking-widest mt-1.5 ${darkMode ? 'text-blue-200/55' : 'text-blue-100/75'}`}>{t('mytrips_subtitle')}</p>
                      <ToolTrustChips darkMode={darkMode} t={t} estimate personal />
                    </div>
                  </div>
                  <div className="flex flex-wrap items-center gap-2 shrink-0">
                    <button onClick={() => setShowNewTrip(true)} className="px-5 py-2.5 bg-[#FFC136] text-[#152C53] font-black uppercase tracking-widest text-[9px] rounded-xl shadow-lg hover:shadow-xl active:scale-95 transition-all flex items-center gap-1.5">
                      <Icons.Plus className="w-3.5 h-3.5" /> {t('mytrips_new_trip')}
                    </button>
                  </div>
                </div>
              </div>

              <div className="p-4 sm:p-8">
                {/* Filter & Sort controls */}
                {trips.length > 0 && !showNewTrip && (
                  <div className="flex flex-wrap items-center gap-3 mb-6">
                    <div className="relative flex-1 min-w-[200px] max-w-md">
                      <Icons.Search className={`absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none ${darkMode ? 'text-slate-500' : 'text-slate-400'}`} />
                      <input type="search" value={tripSearch} onChange={(e) => setTripSearch(e.target.value)} placeholder={t('mytrips_search_placeholder')} className={`w-full pl-10 pr-3 py-2 rounded-lg text-xs font-bold outline-none border transition-all ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-200 placeholder:text-slate-500 focus:border-slate-500' : 'bg-white border-slate-200 text-[#152C53] placeholder:text-slate-400 focus:border-[#152C53]'}`} />
                    </div>
                    <div className={`h-5 w-px hidden sm:block ${darkMode ? 'bg-slate-700' : 'bg-slate-200'}`}></div>
                    <div className="flex items-center gap-1.5">
                      {[{id:'all',labelKey:'mytrips_all'}, ...TRIP_STATUSES].map(f => (
                        <button key={f.id} onClick={() => setTripFilter(f.id)} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest transition-all ${tripFilter === f.id ? (f.id === 'all' ? (darkMode ? 'bg-white text-[#152C53]' : 'bg-[#152C53] text-white') : `${f.color} ${f.text || 'text-white'}`) : (darkMode ? 'bg-slate-800 text-slate-500 hover:text-slate-300' : 'bg-slate-100 text-slate-400 hover:text-slate-600')}`}>{t(f.labelKey)}</button>
                      ))}
                    </div>
                    <div className={`h-5 w-px ${darkMode ? 'bg-slate-700' : 'bg-slate-200'}`}></div>
                    <select value={tripSort} onChange={e => setTripSort(e.target.value)} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest outline-none border ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-400' : 'bg-white border-slate-200 text-slate-500'}`}>
                      <option value="newest">{t('mytrips_sort_newest')}</option>
                      <option value="oldest">{t('mytrips_sort_oldest')}</option>
                      <option value="date">{t('mytrips_sort_date')}</option>
                      <option value="name">{t('mytrips_sort_name')}</option>
                    </select>
                    <div className={`h-5 w-px ${darkMode ? 'bg-slate-700' : 'bg-slate-200'}`}></div>
                    <div className="flex items-center gap-1.5">
                      {['USD','CAD'].map(c => (
                        <button key={c} onClick={() => setCurrency(c)} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest transition-all ${currency === c ? (darkMode ? 'bg-emerald-600 text-white' : 'bg-emerald-500 text-white') : (darkMode ? 'bg-slate-800 text-slate-500 hover:text-slate-300' : 'bg-slate-100 text-slate-400 hover:text-slate-600')}`}>{c}</button>
                      ))}
                    </div>
                  </div>
                )}
                {showNewTrip && (
                  <div className={`p-5 sm:p-8 rounded-2xl border-2 border-dashed mb-6 animate-fade-in-fast ${darkMode ? 'bg-slate-800 border-[#FFC136]/30' : 'bg-[#FFC136]/5 border-[#FFC136]/40'}`}>
                    <h3 className={`text-xs font-black uppercase tracking-widest mb-5 ${darkMode ? 'text-[#FFC136]' : 'text-[#152C53]'}`}>{t('mytrips_create_new')}</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
                      <div className="sm:col-span-1">
                        <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_trip_name')}</label>
                        <input type="text" placeholder={t('mytrips_trip_name_placeholder')} className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={newTripName} onChange={e => setNewTripName(e.target.value)} onKeyDown={e => e.key === 'Enter' && createTrip()} />
                      </div>
                      <div>
                        <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_start_date')}</label>
                        <DateInput darkMode={darkMode} value={newTripStart} onChange={setNewTripStart} className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all pr-10 ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400 placeholder-slate-500' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} />
                      </div>
                      <div>
                        <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_end_date')}</label>
                        <DateInput darkMode={darkMode} value={newTripEnd} onChange={setNewTripEnd} className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all pr-10 ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400 placeholder-slate-500' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} />
                      </div>
                    </div>
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => { setShowNewTrip(false); setNewTripName(''); }} className={`px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${darkMode ? 'bg-slate-700 text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-500 hover:text-slate-700'}`}>{t('mytrips_cancel')}</button>
                      <button onClick={createTrip} disabled={!newTripName.trim()} className={`px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${newTripName.trim() ? 'bg-[#152C53] text-white shadow-lg active:scale-95' : (darkMode ? 'bg-slate-700 text-slate-600 cursor-not-allowed' : 'bg-slate-100 text-slate-300 cursor-not-allowed')}`}>{t('mytrips_create_trip')}</button>
                    </div>
                    <p className={`mt-4 pt-4 border-t text-[9px] font-black uppercase tracking-widest ${darkMode ? 'border-slate-700 text-slate-500' : 'border-slate-200 text-slate-400'}`}>{t('mytrips_or_template')}</p>
                    <div className="flex gap-2 flex-wrap">
                      <button onClick={() => createTripFromTemplate(t('mytrips_template_weekend'), 2)} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest border ${darkMode ? 'bg-slate-800 border-slate-600 text-slate-300 hover:border-[#FFC136]' : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-[#152C53]'}`}>{t('mytrips_template_weekend')}</button>
                      <button onClick={() => createTripFromTemplate(t('mytrips_template_euro'), 3)} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest border ${darkMode ? 'bg-slate-800 border-slate-600 text-slate-300 hover:border-[#FFC136]' : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-[#152C53]'}`}>{t('mytrips_template_euro')}</button>
                    </div>
                  </div>
                )}

                {trips.length === 0 && !showNewTrip && (
                  <div className="py-16 text-center">
                    <Icons.Route className={`w-14 h-14 mx-auto mb-4 ${darkMode ? 'text-slate-600' : 'text-slate-200'}`} />
                    <p className={`font-black uppercase tracking-widest text-sm mb-2 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_no_trips')}</p>
                    <p className={`text-xs font-medium ${darkMode ? 'text-slate-600' : 'text-slate-300'}`}>{t('mytrips_no_trips_hint')}</p>
                  </div>
                )}

                {trips.length > 0 && filteredTrips.length === 0 && sortedTripsForFilter.length > 0 && tripSearch.trim() && (
                  <div className="py-12 text-center">
                    <p className={`font-black uppercase tracking-widest text-sm ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_no_search_matches')}</p>
                    <button type="button" onClick={() => setTripSearch('')} className={`mt-2 text-[10px] font-bold uppercase tracking-widest ${darkMode ? 'text-blue-400' : 'text-blue-500'}`}>{t('mytrips_clear_search')}</button>
                  </div>
                )}
                {trips.length > 0 && filteredTrips.length === 0 && sortedTripsForFilter.length === 0 && (
                  <div className="py-12 text-center">
                    <p className={`font-black uppercase tracking-widest text-sm ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_no')} {tripFilter !== 'all' ? t('mytrips_' + tripFilter) + ' ' : ''}{t('mytrips_no_trips_filter')}</p>
                    <button type="button" onClick={() => setTripFilter('all')} className={`mt-2 text-[10px] font-bold uppercase tracking-widest ${darkMode ? 'text-blue-400' : 'text-blue-500'}`}>{t('mytrips_show_all')}</button>
                  </div>
                )}

                <div className="space-y-4">
                  {filteredTrips.map(trip => {
                    const fareInfo = getTripTotalFare(trip);
                    const statusObj = TRIP_STATUSES.find(s => s.id === trip.status) || TRIP_STATUSES[0];
                    const routeStr = trip.segments.length > 0
                      ? trip.segments.map(s => s.origin).filter(Boolean).concat(trip.segments.length > 0 && trip.segments[trip.segments.length - 1].destination ? [trip.segments[trip.segments.length - 1].destination] : []).join(' → ')
                      : null;
                    return (
                      <div key={trip.id} className={`rounded-2xl border p-4 sm:p-6 transition-all hover:shadow-lg cursor-pointer group ${darkMode ? 'bg-slate-800 border-slate-700 hover:border-slate-500' : 'bg-slate-50 border-slate-200 hover:border-slate-400'}`} onClick={() => setActiveTrip(trip.id)}>
                        <div className="flex items-start justify-between gap-4">
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2 mb-2 flex-wrap">
                              <button
                                onClick={(e) => { e.stopPropagation(); const order = ['planning','upcoming','completed']; const idx = order.indexOf(trip.status || 'planning'); const next = order[(idx + 1) % order.length]; updateTrip(trip.id, { status: next }); }}
                                className={`px-2.5 py-0.5 rounded-full text-[8px] font-black uppercase tracking-widest transition-all hover:scale-105 active:scale-95 ${statusObj.text || 'text-white'} ${statusObj.color}`}
                                title={t('mytrips_click_status')}
                              >{t(statusObj.labelKey)} ↻</button>
                              <h3 className={`font-black uppercase tracking-tight text-base sm:text-lg ${darkMode ? 'text-white' : 'text-[#152C53]'}`}>{trip.name}</h3>
                            </div>
                            {routeStr && <p className={`text-sm font-bold mb-2 ${darkMode ? 'text-[#FFC136]' : 'text-[#152C53]/70'}`}>{routeStr}</p>}
                            <div className={`flex items-center gap-4 text-[10px] font-bold uppercase tracking-widest flex-wrap ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                              {trip.startDate && <span>{formatStoredYmdDisplay(trip.startDate)}{trip.endDate ? ` → ${formatStoredYmdDisplay(trip.endDate)}` : ''}</span>}
                              <span>{trip.segments.length} {trip.segments.length !== 1 ? t('mytrips_segments') : t('mytrips_segment')}</span>
                              {fareInfo.total > 0 && <span className={darkMode ? 'text-emerald-400' : 'text-emerald-600'}>~{formatFare(fareInfo.total)}</span>}
                              {fareInfo.totalMiles > 0 && <span>{fareInfo.totalMiles.toLocaleString()} mi</span>}
                              {fareInfo.travelerCount > 1 && <span>{TRAVELER_OPTIONS.filter(t => (getTravelers(trip))[t.id] > 0).map(t => { const c = getTravelers(trip)[t.id]; return c > 1 ? `${t.icon}×${c}` : t.icon; }).join(' ')}</span>}
                            </div>
                          </div>
                          <div className="flex items-center gap-2 shrink-0" onClick={e => e.stopPropagation()}>
                            <button type="button" onClick={() => duplicateTrip(trip)} className={`p-2 rounded-lg transition-all ${darkMode ? 'hover:bg-slate-700 text-slate-500 hover:text-white' : 'hover:bg-slate-200 text-slate-400 hover:text-slate-700'}`} title={t('mytrips_duplicate')}><Icons.Copy className="w-4 h-4" /></button>
                            {deleteConfirm === trip.id ? (
                              <div className="flex items-center gap-1 animate-fade-in">
                                <button onClick={() => deleteTrip(trip.id)} className="px-3 py-1.5 bg-red-500 text-white rounded-lg text-[9px] font-black uppercase">{t('mytrips_delete')}</button>
                                <button onClick={() => setDeleteConfirm(null)} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase ${darkMode ? 'bg-slate-700 text-slate-400' : 'bg-slate-200 text-slate-500'}`}>{t('mytrips_cancel')}</button>
                              </div>
                            ) : (
                              <button onClick={() => setDeleteConfirm(trip.id)} className={`p-2 rounded-lg transition-all ${darkMode ? 'hover:bg-red-950 text-slate-500 hover:text-red-400' : 'hover:bg-red-50 text-slate-400 hover:text-red-500'}`} title={t('mytrips_delete')}><Icons.Trash className="w-4 h-4" /></button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ── TRIP DETAIL VIEW ──
      if (!currentTrip) {
        return (
          <div className="space-y-4 animate-slide-up">
            <button type="button" onClick={() => setActiveTrip(null)} className={`flex items-center gap-2 font-black uppercase tracking-widest text-xs transition-colors ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-[#152C53]'}`}>
              <Icons.ArrowLeft className="w-4 h-4" /> {t('mytrips_back')}
            </button>
            <p className={`text-sm ${darkMode ? 'text-slate-500' : 'text-slate-600'}`}>{t('mytrips_timeline_not_found')}</p>
          </div>
        );
      }

      const fareInfo = getTripTotalFare(currentTrip);

      return (
        <div className="space-y-6 animate-slide-up">
          <div className="flex flex-col gap-2">
            <div className="flex items-center justify-between flex-wrap gap-4">
              <button type="button" onClick={() => setActiveTrip(null)} className={`flex items-center gap-2 font-black uppercase tracking-widest text-xs transition-colors ${darkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-[#152C53]'}`}>
                <Icons.ArrowLeft className="w-4 h-4" /> {t('mytrips_back')}
              </button>
              <div className="flex items-center gap-2 flex-wrap">
                {TRIP_STATUSES.map(s => (
                  <button type="button" key={s.id} onClick={() => updateTrip(currentTrip.id, { status: s.id })} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all border ${currentTrip.status === s.id ? `${s.color} ${s.text || 'text-white'} border-transparent shadow-lg` : (darkMode ? 'bg-slate-800 text-slate-500 border-slate-700 hover:border-slate-500' : 'bg-white text-slate-400 border-slate-200 hover:border-slate-400')}`}>{t(s.labelKey)}</button>
                ))}
              </div>
            </div>
            {clipboardError && (
              <div className={`flex items-center gap-2 px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wide border ${darkMode ? 'bg-red-950/50 border-red-800 text-red-300' : 'bg-red-50 border-red-200 text-red-700'}`}>
                <Icons.AlertTriangle className="w-4 h-4 shrink-0" /> {clipboardError}
              </div>
            )}
          </div>

        <div className={toolShellClass(darkMode, { overflow: 'visible' })}>
            <div className={TOOL_HEADER_CLASS}>
              <div className="flex items-start justify-between gap-4 flex-wrap">
                <div className="min-w-0 flex-1">
                  <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 min-w-0">
                    {editingTripName ? (
                      <div className="flex flex-wrap items-center gap-2 w-full min-w-0">
                        <input
                          type="text"
                          value={tripNameDraft}
                          onChange={(e) => setTripNameDraft(e.target.value)}
                          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); const n = tripNameDraft.trim(); if (n) updateTrip(currentTrip.id, { name: n }); setEditingTripName(false); } if (e.key === 'Escape') { setTripNameDraft(currentTrip.name); setEditingTripName(false); } }}
                          className="flex-1 min-w-0 max-w-xl px-3 py-2 rounded-xl text-lg sm:text-2xl font-black uppercase tracking-tight bg-white/15 border border-white/25 text-white placeholder:text-white/40 outline-none focus:border-[#FFC136]"
                          autoFocus
                        />
                        <button type="button" onClick={() => { const n = tripNameDraft.trim(); if (n) updateTrip(currentTrip.id, { name: n }); setEditingTripName(false); }} className="px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest bg-[#FFC136] text-[#152C53] shrink-0">{t('mytrips_save_name')}</button>
                        <button type="button" onClick={() => { setTripNameDraft(currentTrip.name); setEditingTripName(false); }} className={`px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest shrink-0 ${darkMode ? 'bg-white/10 text-white/80' : 'bg-white/20 text-white'}`}>{t('mytrips_cancel')}</button>
                      </div>
                    ) : (
                      <div className="flex items-start gap-2 min-w-0">
                        <h2 className="text-2xl sm:text-4xl font-black uppercase tracking-tight leading-tight break-words">{currentTrip.name}</h2>
                        <button type="button" onClick={() => { setTripNameDraft(currentTrip.name); setEditingTripName(true); }} className="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white/70 shrink-0 mt-0.5" title={t('mytrips_rename_trip')} aria-label={t('mytrips_rename_trip')}>
                          <Icons.Pencil className="w-4 h-4" />
                        </button>
                      </div>
                    )}
                  </div>
                  {(tripDateOrderBad || segmentsTimeNoDate) && (
                    <div className="mt-3 space-y-2">
                      {tripDateOrderBad && (
                        <div className={`flex items-start gap-2 px-3 py-2.5 rounded-xl porter-warning-banner border ${darkMode ? 'bg-amber-950/40 border-amber-700 text-amber-100' : 'bg-amber-100 border-amber-300 text-amber-950'}`}>
                          <Icons.AlertTriangle className="w-4 h-4 shrink-0 mt-0.5" /> {t('mytrips_warning_end_before_start')}
                        </div>
                      )}
                      {segmentsTimeNoDate && (
                        <div className={`flex items-start gap-2 px-3 py-2.5 rounded-xl porter-warning-banner border ${darkMode ? 'bg-sky-950/40 border-sky-800 text-sky-100' : 'bg-sky-50 border-sky-200 text-sky-950'}`}>
                          <Icons.Clock className="w-4 h-4 shrink-0 mt-0.5" /> {t('mytrips_warning_times_no_date')}
                        </div>
                      )}
                    </div>
                  )}
                  <div className="flex items-center gap-4 mt-2 text-[10px] font-bold text-white/40 uppercase tracking-widest flex-wrap">
                    {currentTrip.startDate && <span className="flex items-center gap-1.5"><Icons.Calendar className="w-3.5 h-3.5" />{formatStoredYmdDisplay(currentTrip.startDate)}{currentTrip.endDate ? ` → ${formatStoredYmdDisplay(currentTrip.endDate)}` : ''}</span>}
                    <span>{currentTrip.segments.length} {currentTrip.segments.length !== 1 ? t('mytrips_segments') : t('mytrips_segment')}</span>
                  </div>
                  <ToolTrustChips darkMode={darkMode} t={t} estimate personal />
                </div>
                <div className="flex flex-col gap-2 shrink-0">
                  <button type="button" onClick={() => copyTripSummary(currentTrip)} className={`px-4 py-3 font-black uppercase tracking-widest text-[10px] rounded-2xl transition-all flex items-center justify-center gap-2 ${copied ? 'bg-emerald-500 text-white' : 'bg-white/10 text-white/70 hover:bg-white/20 border border-white/10'}`}>
                    {copied ? <><Icons.Check className="w-4 h-4" /> {t('common_copied')}</> : <><Icons.Share className="w-4 h-4" /> {t('mytrips_share')}</>}
                  </button>
                  <button type="button" onClick={() => copyTripToCalendar(currentTrip)} className="px-4 py-2 bg-white/5 text-white/60 hover:bg-white/10 font-black uppercase tracking-widest text-[9px] rounded-2xl border border-white/10 flex items-center justify-center gap-1.5">
                    <Icons.Calendar className="w-3.5 h-3.5" /> {t('mytrips_copy_calendar')}
                  </button>
                  <button type="button" onClick={() => addSegment(currentTrip.id)} className="px-5 py-3 bg-[#FFC136] text-[#152C53] font-black uppercase tracking-widest text-[10px] rounded-2xl shadow-xl hover:shadow-2xl active:scale-95 transition-all flex items-center justify-center gap-2">
                    <Icons.Plus className="w-4 h-4" /> {t('mytrips_add_flight')}
                  </button>
                  {currentTrip.segments.length > 0 && currentTrip.segments[0].origin && currentTrip.segments[currentTrip.segments.length - 1].destination && currentTrip.segments[currentTrip.segments.length - 1].destination !== currentTrip.segments[0].origin && (
                    <button type="button" onClick={() => addReturnLeg(currentTrip.id)} className="px-4 py-2.5 bg-white/10 text-white/70 hover:bg-white/20 font-black uppercase tracking-widest text-[9px] rounded-2xl transition-all flex items-center justify-center gap-2 border border-white/10">
                      <Icons.ArrowLeft className="w-3.5 h-3.5" /> {t('mytrips_add_return')}
                    </button>
                  )}
                </div>
              </div>

              {/* Route visualization */}
              {currentTrip.segments.length > 0 && (() => {
                const codes = currentTrip.segments.map(s => s.origin).filter(Boolean);
                const lastDest = currentTrip.segments[currentTrip.segments.length - 1]?.destination;
                if (lastDest) codes.push(lastDest);
                if (codes.length < 2) return null;
                return (
                  <div className="mt-6 flex items-center gap-2 flex-wrap">
                    {codes.map((code, i) => (
                      <React.Fragment key={i}>
                        <div className="flex flex-col items-center">
                          <span className="text-lg sm:text-2xl font-black tracking-tight">{code}</span>
                          <span className="text-[8px] font-bold text-white/30 uppercase">{airports[code]?.city || ''}</span>
                        </div>
                        {i < codes.length - 1 && (
                          <div className="flex items-center gap-1 px-1">
                            <div className="w-6 sm:w-10 h-px bg-white/30"></div>
                            <Icons.Plane className="w-3.5 h-3.5 text-[#FFC136] shrink-0" />
                            <div className="w-6 sm:w-10 h-px bg-white/30"></div>
                          </div>
                        )}
                      </React.Fragment>
                    ))}
                  </div>
                );
              })()}

              {/* Trip fare summary bar */}
              {(fareInfo.total > 0 || fareInfo.totalMiles > 0) && (
                <div className="mt-5 flex items-center gap-3 flex-wrap text-[10px] font-black uppercase tracking-widest">
                  {fareInfo.totalMiles > 0 && (
                    <div className="px-4 py-2 rounded-xl bg-white/10 border border-white/10 flex items-center gap-2">
                      <Icons.Route className="w-3.5 h-3.5 text-white/50" />
                      <span className="text-white/70">{fareInfo.totalMiles.toLocaleString()} {t('mytrips_mi_total')}</span>
                    </div>
                  )}
                  {fareInfo.total > 0 && (
                    <div className="px-4 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/20 flex items-center gap-2">
                      <Icons.Ticket className="w-3.5 h-3.5 text-emerald-300" />
                      <span className="text-emerald-200">~{formatFare(fareInfo.total)} est.{fareInfo.travelerCount > 1 ? ` (${fareInfo.travelerCount} ${t('mytrips_travelers')} · ${formatFare(fareInfo.totalPerPerson)}/${t('mytrips_per_person')})` : ` ${t('mytrips_base_fare')}`}</span>
                    </div>
                  )}
                  <div className="flex items-center gap-1">
                    {['USD','CAD'].map(c => (
                      <button type="button" key={c} onClick={() => setCurrency(c)} className={`px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase tracking-widest transition-all ${currency === c ? 'bg-white/20 text-white' : 'bg-white/5 text-white/30 hover:text-white/60'}`}>{c}</button>
                    ))}
                  </div>
                </div>
              )}

              {/* Travelers */}
              <div className="mt-5">
                <span className="text-[9px] font-black uppercase tracking-widest text-white/30 block mb-2">{t('mytrips_whos_traveling')}</span>
                <div className="flex flex-wrap gap-2">
                  {TRAVELER_OPTIONS.map(trav => {
                    const travelers = getTravelers(currentTrip);
                    const count = travelers[trav.id] || 0;
                    const isActive = count > 0;
                    if (trav.id === 'employee') {
                      return (
                        <button key={trav.id} onClick={() => adjustTraveler(currentTrip.id, trav.id, isActive ? -1 : 1)} className={`px-3.5 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center gap-2 transition-all ${isActive ? 'bg-white/20 text-white border border-white/20' : 'bg-white/5 text-white/30 hover:bg-white/10 hover:text-white/60 border border-white/5'}`}>
                          <span className="text-sm">{trav.icon}</span> {t(trav.labelKey)}
                          {isActive && <span className="text-[8px] ml-0.5">✓</span>}
                        </button>
                      );
                    }
                    if (trav.max > 1) {
                      return (
                        <div key={trav.id} className={`rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center gap-1 transition-all ${isActive ? 'bg-white/20 text-white border border-white/20' : 'bg-white/5 text-white/30 border border-white/5'}`}>
                          <button onClick={() => adjustTraveler(currentTrip.id, trav.id, -1)} className={`px-2.5 py-2 hover:bg-white/10 rounded-l-xl transition-all ${count === 0 ? 'opacity-30 cursor-not-allowed' : ''}`} disabled={count === 0}>−</button>
                          <span className="px-1 py-2 flex items-center gap-1.5 min-w-[80px] justify-center">
                            <span className="text-sm">{trav.icon}</span>
                            {count > 0 ? `${t(trav.labelKey)} (${count})` : t(trav.labelKey)}
                          </span>
                          <button onClick={() => adjustTraveler(currentTrip.id, trav.id, 1)} className={`px-2.5 py-2 hover:bg-white/10 rounded-r-xl transition-all ${count >= trav.max ? 'opacity-30 cursor-not-allowed' : ''}`} disabled={count >= trav.max}>+</button>
                        </div>
                      );
                    }
                    return (
                      <button key={trav.id} onClick={() => adjustTraveler(currentTrip.id, trav.id, isActive ? -1 : 1)} className={`px-3.5 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all flex items-center gap-2 ${isActive ? 'bg-white/20 text-white border border-white/20' : 'bg-white/5 text-white/30 hover:bg-white/10 hover:text-white/60 border border-white/5'}`}>
                        <span className="text-sm">{trav.icon}</span> {t(trav.labelKey)}
                        {isActive && <span className="text-[8px] ml-0.5">✓</span>}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

            {currentTrip.segments.length > 0 && typeof onOpenTripTimeline === 'function' && (
              <div className={`flex flex-wrap items-center justify-end gap-1.5 sm:gap-2 px-4 sm:px-8 py-3 sm:py-4 border-b ${darkMode ? 'border-slate-700/80 bg-slate-900/30' : 'border-slate-200 bg-slate-50/80'}`}>
                <div className="try-me-flight-timeline flex items-end shrink-0">
                  <span
                    className={`try-me-handwritten-text shrink-0 pb-0.5 pr-0.5 ${darkMode ? 'text-white/[0.93]' : 'text-[#152C53]'}`}
                    style={darkMode ? { textShadow: '0 1px 2px rgba(0,0,0,0.5)' } : { textShadow: '0 1px 0 rgba(255,255,255,0.6)' }}
                  >
                    {t('mytrips_timeline_try_me')}
                  </span>
                  <svg
                    className={`try-me-hand-drawn-arrow shrink-0 block h-9 w-[76px] sm:h-10 sm:w-[84px] -ml-0.5 ${darkMode ? 'text-white/[0.95]' : 'text-[#152C53]'}`}
                    viewBox="0 0 84 38"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                    focusable="false"
                    preserveAspectRatio="xMidYMid meet"
                  >
                    <path
                      d="M 2 33 C 12 30 20 23 30 16 C 40 9 52 5 62 4 C 66 3.5 69 3.5 71 5"
                      stroke="currentColor"
                      strokeWidth="2.15"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      fill="none"
                      style={{ filter: darkMode ? 'drop-shadow(0 1px 1px rgba(0,0,0,0.55))' : 'drop-shadow(0 1px 0 rgba(255,255,255,0.4))' }}
                    />
                    <path
                      d="M 70 0.5 L 83 5 L 70 9.5 Z"
                      fill="currentColor"
                      opacity="0.97"
                      style={{ filter: darkMode ? 'drop-shadow(0 1px 1px rgba(0,0,0,0.45))' : undefined }}
                    />
                  </svg>
                </div>
                <button
                  type="button"
                  onClick={() => onOpenTripTimeline(currentTrip.id)}
                  className={`shrink-0 px-4 py-2.5 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all flex items-center gap-2 ring-2 ring-offset-2 ${darkMode ? 'bg-[#FFC136] text-[#152C53] hover:brightness-110 shadow-md ring-[#FFC136]/40 ring-offset-slate-900' : 'bg-[#152C53] text-white hover:bg-[#1a3a66] shadow-md ring-[#152C53]/25 ring-offset-white'}`}
                >
                  <span style={{ fontSize: 14 }}>📅</span>
                  {t('mytrips_open_timeline_page')}
                </button>
              </div>
            )}

            <div className="p-4 sm:p-8 space-y-4">
              {currentTrip.segments.length === 0 && (
                <div className="py-12 text-center">
                  <Icons.PlaneTakeoff className={`w-12 h-12 mx-auto mb-3 ${darkMode ? 'text-slate-600' : 'text-slate-200'}`} />
                  <p className={`font-black uppercase tracking-widest text-sm mb-1 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_no_flights')}</p>
                  <p className={`text-xs font-medium ${darkMode ? 'text-slate-600' : 'text-slate-300'}`}>{t('mytrips_no_flights_hint')}</p>
                </div>
              )}

              {currentTrip.segments.length > 1 && (
                <div className={`flex flex-wrap items-center gap-2 pb-1 border-b ${darkMode ? 'border-slate-700' : 'border-slate-200'}`}>
                  <span className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_segments')}</span>
                  <button type="button" onClick={() => expandAllSegments()} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest transition-all ${darkMode ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{t('mytrips_expand_all')}</button>
                  <button type="button" onClick={() => collapseAllSegments(currentTrip.id)} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest transition-all ${darkMode ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{t('mytrips_collapse_all')}</button>
                </div>
              )}

              {currentTrip.segments.map((seg, idx) => {
                const segFare = getSegmentFare(seg);
                const embargo = getAirlineEmbargo(seg.airline);
                const isCollapsed = collapsedSegments.has(seg.id);
                return (
                  <div key={seg.id} className={`rounded-2xl border overflow-visible transition-all ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                    {/* Segment header bar — always visible, clickable to collapse */}
                    <div className={`rounded-t-2xl overflow-hidden px-4 sm:px-6 py-4 sm:py-3 flex items-center justify-between cursor-pointer ${darkMode ? 'bg-slate-700/50 hover:bg-slate-700' : 'bg-slate-100 hover:bg-slate-200/70'} transition-colors`} onClick={() => toggleCollapse(seg.id)}>
                      <div className="flex items-center gap-3 flex-wrap flex-1 min-w-0">
                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-[10px] font-black shrink-0 ${darkMode ? 'bg-slate-600 text-slate-300' : 'bg-[#152C53] text-white'}`}>{idx + 1}</span>
                        <span className={`font-black uppercase tracking-widest text-[10px] ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                          {seg.origin && seg.destination ? `${seg.origin} → ${seg.destination}` : t('mytrips_new_segment')}
                        </span>
                        {seg.airline && <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full ${darkMode ? 'bg-slate-600 text-slate-400' : 'bg-white text-slate-500'}`}>{seg.airline}</span>}
                        {seg.aircraftIcao && <span className={`text-[9px] font-black px-2 py-0.5 rounded-md ${darkMode ? 'bg-slate-600/80 text-slate-300' : 'bg-white text-slate-600 border border-slate-200'}`}>{seg.aircraftIcao}</span>}
                        {seg.date && <span className={`text-[9px] font-bold ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{formatStoredYmdDisplay(seg.date)}</span>}
                        {segFare && <span className={`text-[9px] font-black ${darkMode ? 'text-emerald-400' : 'text-emerald-600'}`}>{formatFare(segFare.fare)} · {segFare.miles.toLocaleString()} mi</span>}
                        {embargo && <Icons.AlertTriangle className="w-3.5 h-3.5 text-amber-500 shrink-0" />}
                      </div>
                      <div className="flex items-center gap-0.5 sm:gap-1 shrink-0" onClick={e => e.stopPropagation()}>
                        {idx > 0 && <button onClick={() => moveSegment(currentTrip.id, seg.id, -1)} className={`p-2 rounded-lg transition-all ${darkMode ? 'hover:bg-slate-600 text-slate-500 hover:text-white' : 'hover:bg-slate-200 text-slate-400 hover:text-slate-600'}`} title={t('mytrips_move_up')}><span className="text-xs font-black">↑</span></button>}
                        {idx < currentTrip.segments.length - 1 && <button onClick={() => moveSegment(currentTrip.id, seg.id, 1)} className={`p-2 rounded-lg transition-all ${darkMode ? 'hover:bg-slate-600 text-slate-500 hover:text-white' : 'hover:bg-slate-200 text-slate-400 hover:text-slate-600'}`} title={t('mytrips_move_down')}><span className="text-xs font-black">↓</span></button>}
                        {segmentDeleteConfirm === seg.id ? (
                          <div className="flex items-center gap-1 animate-fade-in flex-wrap justify-end">
                            <button type="button" onClick={() => { removeSegment(currentTrip.id, seg.id); setSegmentDeleteConfirm(null); }} className="px-2.5 py-1.5 bg-red-500 text-white rounded-lg text-[8px] sm:text-[9px] font-black uppercase tracking-tight">{t('mytrips_delete')}</button>
                            <button type="button" onClick={() => setSegmentDeleteConfirm(null)} className={`px-2.5 py-1.5 rounded-lg text-[8px] sm:text-[9px] font-black uppercase tracking-tight ${darkMode ? 'bg-slate-700 text-slate-400' : 'bg-slate-200 text-slate-500'}`}>{t('mytrips_cancel')}</button>
                          </div>
                        ) : (
                          <button type="button" onClick={() => setSegmentDeleteConfirm(seg.id)} className={`p-2 rounded-lg transition-all ${darkMode ? 'hover:bg-red-950 text-slate-500 hover:text-red-400' : 'hover:bg-red-50 text-slate-400 hover:text-red-500'}`} title={t('mytrips_delete')} aria-label={t('mytrips_delete')}><Icons.Trash className="w-4 h-4" /></button>
                        )}
                        <Icons.ChevronDown className={`w-4 h-4 transition-transform duration-200 ${isCollapsed ? '' : 'rotate-180'} ${darkMode ? 'text-slate-500' : 'text-slate-400'}`} />
                      </div>
                    </div>

                    {/* Collapsible content */}
                    {!isCollapsed && (
                      <div className="px-4 sm:px-6 py-4 sm:py-5 space-y-4 animate-fade-in-fast rounded-b-2xl">
                        {/* Embargo warning */}
                        {embargo && (
                          <div className={`p-3 rounded-xl border flex items-start gap-2.5 ${darkMode ? 'bg-amber-950/30 border-amber-800/50' : 'bg-amber-50 border-amber-200'}`}>
                            <Icons.AlertTriangle className="w-4 h-4 text-amber-500 shrink-0 mt-0.5" />
                            <div>
                              <span className="text-[9px] font-black uppercase tracking-widest text-amber-600 block mb-0.5">{t('mytrips_active_embargo')}</span>
                              <p className={`text-xs font-medium leading-relaxed ${darkMode ? 'text-amber-200' : 'text-amber-900'}`}>{embargo}</p>
                            </div>
                          </div>
                        )}

                        {/* Row 1: Airline + Flight No */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_airline')}</label>
                            <TripAirlinePicker darkMode={darkMode} airlines={airlines} value={seg.airline} onChange={v => updateSegment(currentTrip.id, seg.id, { airline: v })} />
                          </div>
                          <div>
                            <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_flight_number')}</label>
                            <input type="text" placeholder={t('mytrips_flight_placeholder')} className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400 placeholder-slate-500' : 'bg-white border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={seg.flightNo} onChange={e => updateSegment(currentTrip.id, seg.id, { flightNo: e.target.value })} />
                          </div>
                        </div>

                        {/* Aircraft (ICAO type designator) */}
                        <div>
                          <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_aircraft')}</label>
                          <TripAircraftIcaoCombobox
                            darkMode={darkMode}
                            value={seg.aircraftIcao || ''}
                            onChange={(v) => updateSegment(currentTrip.id, seg.id, { aircraftIcao: v })}
                            t={t}
                          />
                          <p className={`text-[8px] font-medium mt-1.5 leading-relaxed ${darkMode ? 'text-slate-600' : 'text-slate-400'}`}>{t('mytrips_aircraft_hint')}</p>
                        </div>

                        {/* Row 1b: Date + Departure + Arrival */}
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <div>
                            <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_date')}</label>
                            <DateInput darkMode={darkMode} value={seg.date} onChange={v => updateSegment(currentTrip.id, seg.id, { date: v })} className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all pr-10 ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400 placeholder-slate-500' : 'bg-white border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} />
                          </div>
                          <div>
                            <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_departure_time')}</label>
                            <input type="time" className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400' : 'bg-white border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={seg.depTime || ''} onChange={e => updateSegment(currentTrip.id, seg.id, { depTime: e.target.value })} />
                          </div>
                          <div>
                            <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_arrival_time')}</label>
                            <input type="time" className={`w-full p-3 border rounded-xl font-bold text-sm outline-none transition-all ${darkMode ? 'bg-slate-700 border-slate-600 text-white focus:border-slate-400' : 'bg-white border-slate-200 text-[#152C53] focus:border-[#152C53]'}`} value={seg.arrTime || ''} onChange={e => updateSegment(currentTrip.id, seg.id, { arrTime: e.target.value })} />
                          </div>
                        </div>

                        {/* Connection time warning */}
                        {idx > 0 && (() => {
                          const connMin = getConnectionTime(currentTrip.segments[idx - 1], seg);
                          const warn = getConnectionWarning(connMin);
                          if (!warn) return null;
                          return (
                            <div className={`p-2.5 rounded-xl border flex items-center gap-2.5 text-[10px] font-bold ${warn.bg}`}>
                              <Icons.Clock className={`w-3.5 h-3.5 shrink-0 ${warn.color}`} />
                              <span className={warn.color}>{warn.text}</span>
                            </div>
                          );
                        })()}

                        {/* Row 2: Origin + Destination + Distance/Zone */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_origin')}</label>
                            <TripAirportPicker darkMode={darkMode} airports={airports} airportCodes={airportCodes} value={seg.origin} onChange={v => updateSegment(currentTrip.id, seg.id, { origin: v })} placeholder={t('mytrips_origin_placeholder')} />
                          </div>
                          <div>
                            <label className={`text-[9px] font-black uppercase tracking-widest mb-1.5 block ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('mytrips_destination')}</label>
                            <TripAirportPicker darkMode={darkMode} airports={airports} airportCodes={airportCodes} value={seg.destination} onChange={v => updateSegment(currentTrip.id, seg.id, { destination: v })} placeholder={t('mytrips_destination_placeholder')} />
                          </div>
                        </div>

                        {/* Distance + Fare auto-calc display */}
                        {segFare && (
                          <div className={`flex items-center gap-3 flex-wrap text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                            <span className={`px-3 py-1.5 rounded-xl ${darkMode ? 'bg-slate-700' : 'bg-white border border-slate-200'}`}>📏 {segFare.miles.toLocaleString()} mi</span>
                            <span className={`px-3 py-1.5 rounded-xl ${darkMode ? 'bg-slate-700' : 'bg-white border border-slate-200'}`}>📍 Zone {segFare.zone}</span>
                            <span className={`px-3 py-1.5 rounded-xl ${darkMode ? 'bg-emerald-950/50 text-emerald-400 border border-emerald-800/50' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>💲~{formatFare(segFare.fare)} base</span>
                            {seg.fareZone && <span className={`px-3 py-1 rounded-full text-[9px] font-black text-white ${seg.fareZone === 'LOW' ? 'bg-emerald-500' : seg.fareZone === 'MED' || seg.fareZone === 'MEDIUM' ? 'bg-amber-500' : seg.fareZone === 'HIGH' ? 'bg-red-500' : 'bg-slate-500'}`}>ZED {seg.fareZone}</span>}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}

              {/* Post-trip journal — only for completed trips */}
              {currentTrip.status === 'completed' && (
                <div className={`p-5 rounded-2xl border-2 ${darkMode ? 'bg-emerald-950/20 border-emerald-800/50' : 'bg-emerald-50/50 border-emerald-200'}`}>
                  <div className="flex items-center gap-2 mb-3">
                    <Icons.BookOpen className={`w-4 h-4 ${darkMode ? 'text-emerald-400' : 'text-emerald-600'}`} />
                    <label className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-emerald-400' : 'text-emerald-700'}`}>Trip Journal</label>
                    <span className={`text-[8px] font-bold ml-auto ${darkMode ? 'text-emerald-600' : 'text-emerald-400'}`}>For future reference</span>
                  </div>
                  <textarea
                    rows="4"
                    placeholder="How did the trip go? Any tips for next time? Did you get on all flights? What would you do differently?"
                    className={`w-full p-3 border rounded-xl font-medium text-sm outline-none transition-all resize-none ${darkMode ? 'bg-slate-800 border-emerald-800/30 text-white focus:border-emerald-600 placeholder-slate-500' : 'bg-white border-emerald-200 text-slate-600 focus:border-emerald-500'}`}
                    value={currentTrip.journal || ''}
                    onChange={e => updateTrip(currentTrip.id, { journal: e.target.value })}
                  />
                </div>
              )}

              {/* Fare Breakdown Summary */}
              {currentTrip.segments.length > 0 && currentTrip.segments.some(s => getSegmentFare(s)) && (
                <div className={`p-5 rounded-2xl border ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2">
                      <Icons.Ticket className={`w-4 h-4 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`} />
                      <label className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>Fare Breakdown</label>
                    </div>
                    <div className="flex items-center gap-1">
                      {['USD','CAD'].map(c => (
                        <button key={c} onClick={() => setCurrency(c)} className={`px-2.5 py-1 rounded-lg text-[8px] font-black uppercase tracking-widest transition-all ${currency === c ? (darkMode ? 'bg-emerald-600 text-white' : 'bg-emerald-500 text-white') : (darkMode ? 'bg-slate-700 text-slate-500' : 'bg-slate-100 text-slate-400')}`}>{c}</button>
                      ))}
                    </div>
                  </div>
                  <div className="space-y-2">
                    {currentTrip.segments.map((seg, idx) => {
                      const sf = getSegmentFare(seg);
                      return (
                        <div key={seg.id} className={`flex items-center justify-between py-2 ${idx < currentTrip.segments.length - 1 ? (darkMode ? 'border-b border-slate-700' : 'border-b border-slate-100') : ''}`}>
                          <div className="flex items-center gap-3 min-w-0">
                            <span className={`text-[10px] font-black ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{idx + 1}.</span>
                            <span className={`text-sm font-bold ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>{seg.origin || '?'} → {seg.destination || '?'}</span>
                            {seg.airline && <span className={`text-[9px] font-medium ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{seg.airline}</span>}
                          </div>
                          <div className="flex items-center gap-3 shrink-0">
                            {sf && <span className={`text-[9px] font-bold ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{sf.miles.toLocaleString()} mi · Z{sf.zone}</span>}
                            <span className={`text-sm font-black ${sf ? (darkMode ? 'text-emerald-400' : 'text-emerald-600') : (darkMode ? 'text-slate-600' : 'text-slate-300')}`}>{sf ? formatFare(sf.fare) : '—'}</span>
                          </div>
                        </div>
                      );
                    })}
                    <div className={`flex items-center justify-between pt-3 mt-1 ${darkMode ? 'border-t-2 border-slate-600' : 'border-t-2 border-slate-300'}`}>
                      <div>
                        <span className={`text-xs font-black uppercase tracking-widest block ${darkMode ? 'text-white' : 'text-[#152C53]'}`}>{t('calc_total_estimated_base')}</span>
                        {fareInfo.travelerCount > 1 && <span className={`text-[9px] font-bold ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{formatFare(fareInfo.totalPerPerson)}/{t('mytrips_per_person')} × {fareInfo.travelerCount} {t('mytrips_travelers')}</span>}
                      </div>
                      <span className={`text-lg font-black ${darkMode ? 'text-emerald-400' : 'text-emerald-600'}`}>~{formatFare(fareInfo.total)}</span>
                    </div>
                  </div>
                </div>
              )}

      // Remove early boot splash once React mounts

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') { setShowCommandPalette(false); return; }
          if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') { e.preventDefault(); setShowCommandPalette(true); setCommandPaletteQuery(''); return; }
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); setShowCommandPalette(true); setCommandPaletteQuery(''); }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      useEffect(() => {
        const onStorageError = () => setStorageError(true);
        window.addEventListener('storageError', onStorageError);
        return () => window.removeEventListener('storageError', onStorageError);
      }, []);

      useEffect(() => {
        const FX_LS_KEY = 'porter_fx_usd_cad_v1';
        const FX_POLL_MS = 24 * 60 * 60 * 1000;
        const apply = (rate, date) => {
          const r = Number(rate);
          if (!Number.isFinite(r) || r < 0.5 || r > 3) return;
          const d = typeof date === 'string' && date.length >= 10 ? date.slice(0, 10) : new Date().toISOString().slice(0, 10);
          cadFxRef.rate = r;
          cadFxRef.effectiveDate = d;
          setFxRefreshTick((n) => n + 1);
        };
        async function pull() {
          try {
            const res = await fetch('/api/fx/usd-cad', { credentials: 'same-origin' });
            const j = await res.json();
            if (typeof j.rate === 'number' && Number.isFinite(j.rate)) {
              apply(j.rate, j.date);
              try {
                localStorage.setItem(FX_LS_KEY, JSON.stringify({ rate: j.rate, date: j.date, fetchedAt: Date.now() }));
              } catch (_) { /* ignore */ }
            }
          } catch (_) { /* keep last good */ }
        }
        try {
          const raw = localStorage.getItem(FX_LS_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            const age = Date.now() - (p.fetchedAt || 0);
            if (p.rate != null && age >= 0 && age < FX_POLL_MS) apply(p.rate, p.date);
          }
        } catch (_) { /* ignore */ }
        pull();
        const id = setInterval(pull, FX_POLL_MS);
        return () => clearInterval(id);
      }, []);

      const startConfetti = () => {
        const canvas = document.getElementById('p20-confetti');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.display = 'block';
        canvas.style.opacity = '1';
        canvas.style.transition = 'opacity 3s ease-out';

        const colors = ['#152C53', '#FFC136', '#80c2ff', '#ffffff', '#22d3ee', '#f472b6', '#34d399'];
        const particles = [];
        let globalAlpha = 1;
        let isWindingDown = false;
        let burstFrequency = 600;

        function launchFirework() {
          const cx = canvas.width / 2 + (Math.random() - 0.5) * 500;
          const cy = canvas.height / 2 + (Math.random() - 0.5) * 350;
          const color = colors[Math.floor(Math.random() * colors.length)];
          // Fewer particles per burst as we wind down
          const count = isWindingDown ? 18 + Math.floor(Math.random() * 14) : 48 + Math.floor(Math.random() * 36);
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const speed = isWindingDown ? 3 + Math.random() * 5 : 5 + Math.random() * 10;
            particles.push({
              x: cx, y: cy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              alpha: 1,
              size: Math.random() * 6 + 3,
              color,
              gravity: 0.15,
              decay: 0.010 + Math.random() * 0.006,
              trail: []
            });
          }
        }

        // Falling confetti pieces
        const pieces = [];
        for (let i = 0; i < 72; i++) {
          pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            size: Math.random() * 7 + 3,
            color: colors[Math.floor(Math.random() * colors.length)],
            speed: Math.random() * 3 + 1.5,
            angle: Math.random() * 360,
            drift: (Math.random() - 0.5) * 1.5,
            alpha: 1
          });
        }

        // Initial burst (reduced vs full celebration)
        launchFirework();
        launchFirework();

        // Periodic bursts — starts frequent, then tapers
        let burstTimer = null;
        function scheduleBurst() {
          burstTimer = setTimeout(() => {
            if (globalAlpha <= 0) return;
            launchFirework();
            if (!isWindingDown && Math.random() > 0.45) launchFirework();
            burstFrequency = isWindingDown ? burstFrequency + 240 : 780;
            scheduleBurst();
          }, burstFrequency);
        }
        scheduleBurst();

        let animationId;
        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Draw firework particles
          particles.forEach(p => {
            p.trail.push({ x: p.x, y: p.y });
            if (p.trail.length > 6) p.trail.shift();

            p.trail.forEach((t, ti) => {
              ctx.beginPath();
              ctx.arc(t.x, t.y, p.size * (ti / p.trail.length) * 0.5, 0, Math.PI * 2);
              ctx.fillStyle = p.color;
              ctx.globalAlpha = p.alpha * (ti / p.trail.length) * 0.4 * globalAlpha;
              ctx.fill();
            });

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha * globalAlpha;
            ctx.fill();
            ctx.globalAlpha = 1;

            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= 0.98;
            p.alpha -= p.decay;
          });

          // Remove dead particles
          for (let i = particles.length - 1; i >= 0; i--) {
            if (particles[i].alpha <= 0) particles.splice(i, 1);
          }

          // Draw falling confetti with fade support
          pieces.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha * globalAlpha;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
            p.y += p.speed;
            p.x += p.drift;
            p.angle += 2;
            // During wind-down, confetti falls faster and doesn't reset
            if (isWindingDown) {
              p.speed += 0.02;
              p.alpha = Math.max(0, p.alpha - 0.003);
            } else {
              if (p.y > canvas.height) p.y = -20;
            }
          });

          // Continue drawing until fully faded
          if (globalAlpha > 0 || particles.length > 0) {
            animationId = requestAnimationFrame(draw);
          } else {
            canvas.style.display = 'none';
          }
        }
        draw();

        // Phase 1: Full celebration (shortened)
        // Phase 2: Wind down — fewer/smaller bursts, confetti starts falling away
        setTimeout(() => {
          isWindingDown = true;
          burstFrequency = 1400;
        }, 6500);

        // Phase 3: Stop new bursts, let existing particles finish, fade canvas
        setTimeout(() => {
          clearTimeout(burstTimer);
          canvas.style.opacity = '0';
          // Global alpha fades over 3s
          const fadeStart = performance.now();
          function fadeOut(now) {
            const elapsed = now - fadeStart;
            globalAlpha = Math.max(0, 1 - elapsed / 3000);
            if (globalAlpha > 0) requestAnimationFrame(fadeOut);
          }
          requestAnimationFrame(fadeOut);
        }, 11000);

        // Phase 4: Final cleanup
        setTimeout(() => {
          cancelAnimationFrame(animationId);
          canvas.style.display = 'none';
          canvas.style.opacity = '1';
        }, 15000);
