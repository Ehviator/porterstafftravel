<!DOCTYPE html>
<html lang="en" class="porter-root">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Porter Staff Travel portal for ZED fares, fare comparison, standby prediction, jumpseat references, and policy tools." />
    <title>Porter Airlines Staff Travel - Crew Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Inter:wght@300;400;500;600;700;800&amp;family=Outfit:wght@400;500;600;700;800;900&amp;display=swap" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦝</text></svg>" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#152C53" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Porter Travel" />

    <!-- Apply saved theme before first paint to avoid white flash -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
                if (localStorage.getItem('locale') === 'fr') document.documentElement.lang = 'fr';
            } catch (e) { }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* Must match Vite tailwind.config.cjs — class strategy ties to <html class="dark"> from localStorage */
      tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js" crossorigin=""></script>
    <script src="js/mytrips-timezones.js"></script>
    <script src="js/flystandby-airline-logos.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="translations-fr.js"></script>

    <style>
        /* Font loaded via link in head — Outfit site-wide; Inter fallback for rare glyphs */
        html.porter-root {
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        html.porter-root:lang(fr) {
            hyphens: auto;
            -webkit-hyphens: auto;
        }
        body {
            font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            text-align: left;
        }

        .skip-to-main {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .skip-to-main:focus {
            position: fixed;
            z-index: 99999;
            left: 1rem;
            top: 1rem;
            width: auto;
            height: auto;
            margin: 0;
            clip: auto;
            overflow: visible;
            white-space: normal;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 800;
            font-size: 0.875rem;
            text-decoration: none;
            background: #152C53;
            color: #fff;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.35);
            outline: 2px solid #FFC136;
            outline-offset: 2px;
        }

        html {
            /* Keep scrollbar space always reserved so search bar width doesn’t shrink when dropdown opens */
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

            html.dark body,
            html.dark #root {
                background-color: #0f172a;
            }

            html.dark body {
                /* Replace light-page gradient (background-image paints above background-color) */
                background-image: radial-gradient(circle at 10% -10%, rgba(56, 189, 248, 0.08), transparent 42%),
                    radial-gradient(circle at 92% 4%, rgba(255, 193, 54, 0.06), transparent 34%),
                    linear-gradient(180deg, #0f172a 0%, #020617 100%);
                color: #f8fafc;
            }

            html.dark #root {
                min-height: 100vh;
            }

        html,
        body {
            max-width: 100%;
            overflow-x: clip;
        }

        :root {
            --porter-navy: #152C53;
            --porter-navy-deep: #0f1f3b;
            --porter-yellow: #FFC136;
            --surface-light: #ffffff;
            --surface-dark: #1e293b;
            --focus-ring: 0 0 0 3px rgba(59, 130, 246, 0.2), 0 0 0 1px rgba(37, 99, 235, 0.35);
            --elevated-shadow: 0 24px 60px -32px rgba(15, 23, 42, 0.5), 0 12px 26px -18px rgba(2, 6, 23, 0.5);
        }

        html.dark {
            --focus-ring: 0 0 0 3px rgba(250, 204, 21, 0.32), 0 0 0 1px rgba(253, 224, 71, 0.55);
        }

        /* Porter UI typography utilities (readability / contrast) */
        .porter-label {
            font-size: 0.75rem;
            line-height: 1.25rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }
        html.dark .porter-label {
            color: #cbd5e1;
        }
        .porter-label--brand {
            color: #152C53;
        }
        html.dark .porter-label--brand {
            color: #FFC136;
        }
        .porter-meta-hint {
            font-size: 0.75rem;
            line-height: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }
        html.dark .porter-meta-hint {
            color: #94a3b8;
        }
        .porter-text-error {
            font-size: 0.875rem;
            line-height: 1.625;
            font-weight: 600;
            color: #dc2626;
        }
        html.dark .porter-text-error {
            color: #f87171;
        }
        .porter-callout-safety {
            font-size: 0.75rem;
            line-height: 1.5;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #b45309;
        }
        html.dark .porter-callout-safety {
            color: #fcd34d;
        }
        .porter-warning-banner {
            font-size: 0.875rem;
            line-height: 1.5;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .porter-alert-strip {
            font-size: 0.875rem;
            line-height: 1.4;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        body {
            background-image: radial-gradient(circle at 10% -10%, rgba(21, 44, 83, 0.08), transparent 42%), radial-gradient(circle at 92% 4%, rgba(255, 193, 54, 0.08), transparent 34%), linear-gradient(180deg, rgba(248, 250, 252, 1) 0%, rgba(241, 245, 249, 1) 100%);
            background-attachment: fixed;
        }

        .app-shell {
            position: relative;
            isolation: isolate;
        }

            .app-shell::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 0;
                background: radial-gradient(circle at 8% 22%, rgba(56, 189, 248, 0.05), transparent 32%), radial-gradient(circle at 86% 18%, rgba(255, 193, 54, 0.05), transparent 30%);
            }

            html.dark .app-shell::before {
                background: radial-gradient(circle at 8% 22%, rgba(56, 189, 248, 0.07), transparent 34%),
                    radial-gradient(circle at 86% 18%, rgba(255, 193, 54, 0.05), transparent 32%),
                    radial-gradient(circle at 50% 80%, rgba(15, 23, 42, 0.5), transparent 55%);
            }

        .app-main {
            position: relative;
            z-index: 1;
        }

        .app-header {
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            background: linear-gradient(180deg, rgba(13, 24, 48, 0.82) 0%, rgba(15, 28, 55, 0.75) 100%);
            box-shadow: 0 1px 0 0 rgba(255,255,255,0.04), 0 4px 16px -2px rgba(0,0,0,0.25), 0 12px 40px -8px rgba(0,0,0,0.15);
        }

            .app-header::before {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(ellipse 30% 100% at 20% 50%, rgba(52,211,153,0.04) 0%, transparent 70%), radial-gradient(ellipse 25% 100% at 50% 50%, rgba(56,189,248,0.03) 0%, transparent 70%), radial-gradient(ellipse 30% 100% at 80% 50%, rgba(139,92,246,0.03) 0%, transparent 70%);
                animation: headerAuroraShift 20s ease-in-out infinite alternate;
            }

        @keyframes headerAuroraShift {
            0% {
                opacity: 0.6;
                transform: translateX(-3%);
            }

            50% {
                opacity: 1;
                transform: translateX(3%);
            }

            100% {
                opacity: 0.7;
                transform: translateX(-2%);
            }
        }

        @keyframes zedFareHeroPop {
            0% { transform: scale(0.94); opacity: 0.78; }
            45% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .zed-fare-hero-pop {
            animation: zedFareHeroPop 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .zed-calc-travelers-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .zed-calc-travelers-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .zed-calc-travelers-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .app-header::after {
            content: "";
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 193, 54, 0.2) 30%, rgba(56,189,248,0.12) 60%, transparent);
            pointer-events: none;
        }

        .header-logo {
            transition: all 0.3s ease;
        }

            .header-logo:hover {
                filter: brightness(0) invert(1) drop-shadow(0 0 8px rgba(255,193,54,0.35));
            }

        @keyframes bellRing {
            0% {
                transform: rotate(0deg);
            }

            8% {
                transform: rotate(18deg);
            }

            16% {
                transform: rotate(-16deg);
            }

            24% {
                transform: rotate(14deg);
            }

            32% {
                transform: rotate(-10deg);
            }

            40% {
                transform: rotate(7deg);
            }

            48% {
                transform: rotate(-4deg);
            }

            55% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        .bell-ring {
            transform-origin: top center;
            animation: bellRing 1.2s ease-in-out infinite;
            animation-delay: 0.5s;
        }

        .logout-wrapper {
            position: relative;
            overflow: visible;
        }

        .raccoon-hide {
            position: absolute;
            top: 50%;
            right: -4px;
            font-size: 14px;
            line-height: 1;
            opacity: 0;
            transform: translate(0, -50%) scale(0.5);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: -1;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
        }

        .logout-wrapper:hover .raccoon-hide {
            opacity: 1;
            transform: translate(22px, -50%) scale(1) rotate(-8deg);
        }

        .module-shell {
            position: relative;
            transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
            box-shadow: var(--elevated-shadow);
        }

            .module-shell::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                background: linear-gradient(165deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.06) 40%, rgba(255, 255, 255, 0) 76%);
                opacity: 0.24;
                z-index: 0;
            }

            .module-shell > * {
                position: relative;
                z-index: 1;
            }

            /*
             * Tool modules (ZED calc, standby, agreements, etc.): ~9% larger at 100% browser zoom.
             * Uses `zoom` so Tailwind arbitrary px font sizes scale with the shell; does not fight
             * `.module-shell:hover { transform: … }` the way transform: scale() would.
             * Firefox may not apply zoom on non-root elements; layout stays usable.
             */
            .porter-tools-readable-scale.module-shell {
                zoom: 1.09;
            }

            .module-shell:hover {
                transform: none;
            }

        .dark .module-shell {
            box-shadow: 0 26px 62px -34px rgba(2, 6, 23, 0.8), 0 14px 34px -24px rgba(2, 6, 23, 0.78);
        }

        .porter-tool-surface.module-shell {
            box-shadow: 0 10px 28px -18px rgba(15, 23, 42, 0.32), 0 5px 14px -8px rgba(2, 6, 23, 0.22);
        }

        .porter-tool-surface.module-shell::before {
            opacity: 0.14;
        }

        .dark .porter-tool-surface.module-shell {
            box-shadow: 0 14px 36px -24px rgba(2, 6, 23, 0.55), 0 7px 18px -12px rgba(2, 6, 23, 0.4);
        }

        .page-frame {
            position: relative;
        }

            .page-frame p {
                text-wrap: pretty;
            }

        .featured-grid > .stagger-card {
            min-height: 215px;
        }

        @media (hover: hover) and (pointer: fine) {
            .module-shell:hover {
                transform: translateY(-1px);
            }

            .featured-grid > .stagger-card:nth-child(odd) {
                outline: 1px solid rgba(255, 255, 255, 0.06);
            }
        }

        .secondary-grid > .stagger-secondary {
            min-height: 132px;
        }

        .login-card {
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(248, 250, 252, 0.96) 100%);
            box-shadow: 0 60px 120px -44px rgba(2, 6, 23, 0.85), 0 24px 50px -34px rgba(15, 23, 42, 0.6);
        }

        .home-hero::after {
            content: "";
            position: absolute;
            inset: -18% -20% -10% -20%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(ellipse 70% 60% at 8% 18%, rgba(52, 211, 153, 0.50) 0%, transparent 55%), radial-gradient(ellipse 45% 55% at 72% 10%, rgba(168, 85, 247, 0.47) 0%, transparent 52%), radial-gradient(ellipse 58% 42% at 28% 24%, rgba(20, 184, 166, 0.43) 0%, transparent 50%), radial-gradient(ellipse 48% 52% at 52% 8%, rgba(96, 165, 250, 0.38) 0%, transparent 54%), radial-gradient(ellipse 38% 38% at 92% 26%, rgba(236, 72, 153, 0.25) 0%, transparent 46%), radial-gradient(ellipse 32% 48% at 3% 12%, rgba(110, 231, 183, 0.41) 0%, transparent 48%);
            filter: blur(22px);
            animation: auroraShimmer 18s ease-in-out infinite alternate-reverse;
            mask-image: linear-gradient(to bottom, black 55%, transparent 96%);
            -webkit-mask-image: linear-gradient(to bottom, black 55%, transparent 96%);
        }

        button,
        [role="button"] {
            transition: transform 0.18s ease, box-shadow 0.2s ease, filter 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

            button:focus-visible,
            [role="button"]:focus-visible,
            input:focus-visible,
            select:focus-visible,
            textarea:focus-visible,
            a:focus-visible {
                outline: none;
                box-shadow: var(--focus-ring);
            }

            input.outline-none:focus-visible,
            textarea.outline-none:focus-visible,
            select.outline-none:focus-visible {
                outline: none;
                box-shadow: var(--focus-ring);
            }

            button:active {
                transform: translateY(1px) scale(0.99);
            }

        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
        select,
        textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        .dark input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
        .dark select,
        .dark textarea {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .dark body {
            background-image: radial-gradient(circle at 12% -8%, rgba(56, 189, 248, 0.1), transparent 34%), radial-gradient(circle at 88% -5%, rgba(255, 193, 54, 0.08), transparent 28%), linear-gradient(180deg, #0f172a 0%, #111827 100%);
        }

        @media (max-width: 640px) {
            .featured-grid > .stagger-card {
                min-height: 176px;
            }

            .secondary-grid > .stagger-secondary {
                min-height: 108px;
            }
        }

        /* ── Northern Lights animation system (more noticeable movement) ── */
        @keyframes auroraDrift {
            0% {
                transform: translate3d(-6%, 2%, 0) scale(1) skewX(0deg);
                opacity: 0.75;
            }

            25% {
                transform: translate3d(4%, -4%, 0) scale(1.1) skewX(-2.5deg);
                opacity: 1;
            }

            50% {
                transform: translate3d(7%, -5%, 0) scale(1.14) skewX(1.8deg);
                opacity: 1;
            }

            75% {
                transform: translate3d(-3%, -2%, 0) scale(1.06) skewX(-1.5deg);
                opacity: 0.88;
            }

            100% {
                transform: translate3d(-5%, 3%, 0) scale(1.02) skewX(0.5deg);
                opacity: 0.78;
            }
        }

        @keyframes auroraShimmer {
            0% {
                transform: translate3d(5%, 3%, 0) scale(1.05) skewX(1.2deg);
                opacity: 0.5;
            }

            30% {
                transform: translate3d(-6%, -4%, 0) scale(0.98) skewX(-2.5deg);
                opacity: 1;
            }

            60% {
                transform: translate3d(3%, -3%, 0) scale(1.12) skewX(2deg);
                opacity: 0.82;
            }

            100% {
                transform: translate3d(-4%, 2%, 0) scale(1.06) skewX(-1deg);
                opacity: 0.72;
            }
        }

        @keyframes auroraFlicker {
            0%, 100% {
                opacity: 0.3;
            }

            20% {
                opacity: 0.85;
            }

            40% {
                opacity: 0.25;
            }

            60% {
                opacity: 0.9;
            }

            80% {
                opacity: 0.45;
            }
        }

        @keyframes routeGlow {
            0% {
                background-position: -20% 0;
            }

            100% {
                background-position: 120% 0;
            }
        }

        /* 20th birthday aurora burst behind easter egg */
        .hero-birthday-aurora {
            background: radial-gradient(ellipse 120% 70% at 10% 0%, rgba(52, 211, 153, 0.35) 0%, transparent 55%), radial-gradient(ellipse 110% 70% at 90% 0%, rgba(56, 189, 248, 0.35) 0%, transparent 55%), radial-gradient(ellipse 180% 80% at 50% 0%, rgba(255, 193, 54, 0.42) 0%, transparent 60%);
            filter: blur(22px);
            opacity: 0.7;
            animation: auroraDrift 16s ease-in-out infinite alternate;
            mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
        }

        .hero-birthday-timeline {
            background: linear-gradient(90deg, rgba(255, 193, 54, 0.05), rgba(255, 193, 54, 0.35), rgba(56, 189, 248, 0.3), rgba(94, 234, 212, 0.35), rgba(255, 193, 54, 0.05));
            background-size: 220% 100%;
            opacity: 0.7;
            animation: routeGlow 7s ease-in-out infinite;
        }

        @keyframes sectionReveal {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-shell::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(circle at 24% 15%, rgba(255, 255, 255, 0.14), transparent 35%), radial-gradient(circle at 76% 8%, rgba(21, 44, 83, 0.14), transparent 30%), repeating-linear-gradient(115deg, rgba(21, 44, 83, 0.025) 0 1px, transparent 1px 9px);
            opacity: 0.42;
        }

        .dark .app-shell::after {
            background-image: radial-gradient(circle at 24% 15%, rgba(147, 197, 253, 0.11), transparent 36%), radial-gradient(circle at 76% 8%, rgba(30, 64, 175, 0.1), transparent 34%), repeating-linear-gradient(115deg, rgba(148, 163, 184, 0.04) 0 1px, transparent 1px 10px);
            opacity: 0.5;
        }

        .home-hero::before {
            content: "";
            position: absolute;
            inset: -22% -18% -8% -18%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 78% 62% at 6% 20%, rgba(74, 222, 128, 0.86) 0%, rgba(52, 211, 153, 0.41) 28%, transparent 58%), radial-gradient(ellipse 55% 70% at 22% 12%, rgba(52, 211, 153, 0.79) 0%, transparent 54%), radial-gradient(ellipse 52% 68% at 40% 8%, rgba(34, 197, 194, 0.70) 0%, transparent 52%), radial-gradient(ellipse 60% 55% at 62% 16%, rgba(56, 189, 248, 0.65) 0%, transparent 54%), radial-gradient(ellipse 48% 62% at 84% 12%, rgba(139, 92, 246, 0.56) 0%, transparent 50%), radial-gradient(ellipse 44% 48% at 32% 28%, rgba(16, 185, 129, 0.52) 0%, transparent 48%), radial-gradient(ellipse 38% 40% at 54% 6%, rgba(96, 165, 250, 0.47) 0%, transparent 46%), radial-gradient(ellipse 36% 44% at 72% 30%, rgba(59, 130, 246, 0.38) 0%, transparent 48%);
            filter: blur(24px);
            animation: auroraDrift 16s ease-in-out infinite alternate;
            mask-image: linear-gradient(to bottom, black 58%, transparent 98%);
            -webkit-mask-image: linear-gradient(to bottom, black 58%, transparent 98%);
        }

        .home-hero-content {
            animation: sectionReveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.06s;
        }

        .section-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.38rem;
            padding: 0.34rem 0.72rem;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(8px) saturate(1.15);
        }

        .section-divider {
            width: min(180px, 70%);
            height: 2px;
            margin: 0.55rem auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 193, 54, 0.85), rgba(255, 255, 255, 0));
            box-shadow: 0 0 24px rgba(255, 193, 54, 0.45);
        }

        .featured-grid {
            position: relative;
        }

        @media (min-width: 1024px) {
            .featured-grid::before {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                height: 8px;
                border-radius: 999px;

            }

        .hero-cta-yellow {

            .hero-cta-yellow:hover {

        /* ── Hero search bar — glassmorphic ── */
        .hero-search-bar {

        /* ── Module header accent line ── */
        .module-shell > .bg-\[\#152C53\] {

                content: "";

                right: 0;
                bottom: 0;
                height: 2px;

        /* ── Staggered card entrance ── */
        @keyframes cardStagger {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .stagger-card {
            opacity: 0;
            animation: cardStagger 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

            .stagger-card:nth-child(1) {
                animation-delay: 0.05s;
            }

            .stagger-card:nth-child(2) {
                animation-delay: 0.12s;
            }

            .stagger-card:nth-child(3) {
                animation-delay: 0.19s;
            }

            .stagger-card:nth-child(4) {
                animation-delay: 0.26s;
            }

            .stagger-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 50%;
                border-radius: inherit;
                pointer-events: none;
                z-index: 1;
                background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
            }

            /* Kill the old swipe — no more ::after */
            .stagger-card::after {
                content: none;
            }

            .stagger-card:hover,
            .stagger-card:focus-visible {
                transform: translateY(-8px);
                box-shadow: 0 2px 6px rgba(0,0,0,0.03), 0 12px 32px -8px rgba(2,6,23,0.18), 0 36px 64px -16px rgba(2,6,23,0.14) !important;
            }

            /* ── Icon treatment ── */
            .stagger-card .w-14.h-14 {
                position: relative;
                z-index: 2;
                transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.45s ease;
                backdrop-filter: blur(16px) saturate(1.3);
            }

                .stagger-card .w-14.h-14::before {
                    content: "";
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    height: 50%;
                    border-radius: inherit;
                    pointer-events: none;
                    background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 100%);
                }

                .stagger-card .w-14.h-14 svg {
                    position: relative;
                    z-index: 1;
                    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
                    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
                }

            .stagger-card:hover .w-14.h-14,
            .stagger-card:focus-visible .w-14.h-14 {
                transform: translateY(-2px) scale(1.04);
                box-shadow: 0 6px 16px -4px rgba(0,0,0,0.2);
            }

                .stagger-card:hover .w-14.h-14 svg,
                .stagger-card:focus-visible .w-14.h-14 svg {
                    transform: scale(1.05);
                }

            /* ── Text layout ── */
            .stagger-card .relative.z-10.flex.flex-col.gap-4 {
                gap: 0.9rem;
                min-height: 9.25rem;
                justify-content: flex-end;
            }

            .stagger-card .relative.z-10 .font-black.uppercase.tracking-widest.text-sm {
                letter-spacing: 0.095em;
                line-height: 1.1;
                text-shadow: 0 1px 2px rgba(0,0,0,0.15);
            }

            .stagger-card .relative.z-10 .text-\[9px\].font-bold.uppercase.tracking-widest {
                letter-spacing: 0.11em;
                line-height: 1.25;
            }

        .stagger-secondary {
            opacity: 0;
            animation: cardStagger 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease, filter 0.3s ease;
            box-shadow: 0 14px 36px -24px rgba(2, 6, 23, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

            .stagger-secondary:nth-child(1) {
                animation-delay: 0.35s;
            }

            .stagger-secondary:nth-child(2) {
                animation-delay: 0.40s;
            }

            .stagger-secondary:nth-child(3) {
                animation-delay: 0.45s;
            }

            .stagger-secondary:nth-child(4) {
                animation-delay: 0.50s;
            }

            .stagger-secondary:nth-child(5) {
                animation-delay: 0.55s;
            }

            .stagger-secondary:nth-child(6) {
                animation-delay: 0.60s;
            }

            .stagger-secondary::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                z-index: 1;
                background: linear-gradient(145deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 40%, rgba(255, 255, 255, 0) 72%);
                opacity: 0.55;
            }

            .stagger-secondary::after {
                content: "";
                position: absolute;
                top: -60%;
                left: -95%;
                width: 55%;
                height: 220%;
                pointer-events: none;
                z-index: 1;
                transform: rotate(14deg);
                background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.24) 50%, rgba(255, 255, 255, 0) 100%);
                transition: left 0.68s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .stagger-secondary:hover,
            .stagger-secondary:focus-visible {
                transform: translateY(-4px) scale(1.016);
                filter: saturate(1.06);
                box-shadow: 0 24px 46px -24px rgba(2, 6, 23, 0.88), inset 0 1px 0 rgba(255, 255, 255, 0.16);
            }

                .stagger-secondary:hover::after,
                .stagger-secondary:focus-visible::after {
                    left: 125%;
                }

            .stagger-secondary > .flex {
                position: relative;
                z-index: 2;
            }

            .stagger-secondary .w-12.h-12 {
                position: relative;
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
                box-shadow: 0 10px 20px -14px rgba(2, 6, 23, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.28);
                backdrop-filter: blur(10px) saturate(1.2);
            }

                .stagger-secondary .w-12.h-12::before {
                    content: "";
                    position: absolute;
                    inset: 0;
                    border-radius: inherit;
                    pointer-events: none;
                    background: linear-gradient(165deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0) 70%);
                }

            .stagger-secondary:hover .w-12.h-12,
            .stagger-secondary:focus-visible .w-12.h-12 {
                transform: translateY(-2px) scale(1.08);
                box-shadow: 0 16px 28px -14px rgba(2, 6, 23, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            }

            .stagger-secondary .flex.flex-col.items-center.gap-3.text-center {
                gap: 0.72rem;
                min-height: 5.75rem;
                justify-content: center;
            }

            .stagger-secondary .font-black.uppercase.tracking-widest.text-\[10px\].leading-tight {
                letter-spacing: 0.1em;
                line-height: 1.2;
            }

        /* ── Resource tools: matte, non-glossy cards ── */
        .resource-card {
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 20px -8px rgba(0, 0, 0, 0.35);
            border-radius: 1.2rem;
        }

            .resource-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 28px -10px rgba(0, 0, 0, 0.4);

            .resource-card:active {
                transform: translateY(0);

            .resource-card .resource-icon {

        /* ── Home: Tools + Resources portal tiles (unified) ── */
        .home-portal-grid {
            display: grid;
            gap: 0.85rem;
            /* Stretch rows so FR / long copy doesn’t leave one short card in a row */
            align-items: stretch;
        }

        @media (min-width: 640px) {
            .home-portal-grid--tools {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1024px) {
            .home-portal-grid--tools {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .home-portal-grid--resources {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (min-width: 640px) {
            .home-portal-grid--resources {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (min-width: 1280px) {
            .home-portal-grid--resources {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }

        .home-portal-tile {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            border-radius: 1.15rem;
            border: 1px solid rgba(255, 255, 255, 0.11);
            background: linear-gradient(152deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.035) 42%, rgba(13, 30, 58, 0.42) 100%);

            min-height: 5.25rem;

            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;

            animation: cardStagger 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            .home-portal-tile:nth-child(1) {
                animation-delay: 0.04s;
            }

            .home-portal-tile:nth-child(2) {
                animation-delay: 0.1s;
            }

            .home-portal-tile:nth-child(3) {
                animation-delay: 0.16s;
            }

            .home-portal-tile:nth-child(4) {
                animation-delay: 0.22s;
            }

            .home-portal-tile:nth-child(5) {
                animation-delay: 0.28s;
            }

            .home-portal-tile:nth-child(6) {
                animation-delay: 0.34s;
            }

                box-shadow: 0 0 14px rgba(255, 193, 54, 0.35);
                pointer-events: none;
                z-index: 1;

            .home-portal-tile--muted-bar::before {

                opacity: 0.9;
            }

        /* Home dashboard — light mode (html without .dark from app toggle) */
        html:not(.dark) .home-dashboard .home-portal-tile {
            border: 1px solid rgba(15, 23, 42, 0.08);

            box-shadow: 0 4px 20px -8px rgba(15, 23, 42, 0.1);

        html:not(.dark) .home-dashboard .home-portal-tile:hover {

            width: 2.65rem;
            height: 2.65rem;

        @keyframes ripple-pulse {
            0% {
                transform: scale(0);
                opacity: 0.35;
            }

            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .card-press {
            position: relative;
            overflow: hidden;
        }

            .card-press .ripple-circle {
                position: absolute;
                border-radius: 50%;

                pointer-events: none;

            animation: loginStagger 0.6s 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-stagger-3 {
            opacity: 0;
            animation: loginStagger 0.6s 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-stagger-4 {
            opacity: 0;
            animation: loginStagger 0.6s 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        .login-stagger-5 {
            opacity: 0;
            animation: loginStagger 0.6s 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            inset: 0;

            z-index: 1;

        /* ── Dark mode: AirportInput ── */

    // ── Error Boundary ──
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        if (DEV_MODE) console.error('ErrorBoundary caught:', error, info);
      }
      render() {
        if (this.state.hasError) {
          const darkMode = document.documentElement.classList.contains('dark');
          return (
            <div className={`min-h-screen flex items-center justify-center p-8 ${darkMode ? 'bg-[#0f172a]' : 'bg-[#f8fafc]'}`}>
              <div className={`max-w-md w-full rounded-[2.5rem] p-10 text-center shadow-xl border ${darkMode ? 'bg-[#1e293b] border-slate-700' : 'bg-white border-slate-200'}`}>
                <div className="text-5xl mb-5">✈️</div>
                <h2 className={`text-xl font-black uppercase tracking-tight mb-3 ${darkMode ? 'text-white' : 'text-[#152C53]'}`}>Something went wrong</h2>
                <p className={`text-sm font-medium leading-relaxed mb-6 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                  An unexpected error occurred. Try refreshing the page.
                </p>
                {DEV_MODE && this.state.error && (
                  <pre className={`text-left text-[11px] p-4 rounded-xl mb-6 overflow-auto max-h-40 ${darkMode ? 'bg-slate-800 text-red-300' : 'bg-red-50 text-red-700'}`}>
                    {this.state.error.toString()}
                  </pre>
                )}
                <button
                  onClick={() => window.location.reload()}
                  className="px-8 py-3 bg-[#152C53] text-white font-black uppercase tracking-widest text-xs rounded-2xl shadow-lg hover:bg-[#1e3a6e] active:scale-95 transition-all"
                >
                  Refresh Page
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ── Typewriter Placeholder Component ──
    function TypewriterInput({ suggestions, className, value, onChange, onFocus, onKeyDown }) {
      const [placeholderText, setPlaceholderText] = React.useState('');
      const [suggIdx, setSuggIdx] = React.useState(0);
      const [charIdx, setCharIdx] = React.useState(0);
      const [isDeleting, setIsDeleting] = React.useState(false);

      React.useEffect(() => {
        if (value) return; // Don't animate when user is typing
        const current = suggestions[suggIdx];
        let timer;
        if (!isDeleting) {
          if (charIdx < current.length) {
            timer = setTimeout(() => {
              setPlaceholderText(current.slice(0, charIdx + 1));
              setCharIdx(charIdx + 1);
            }, 55 + Math.random() * 35);
          } else {
            timer = setTimeout(() => setIsDeleting(true), 2200);
          }
        } else {
          if (charIdx > 0) {
            timer = setTimeout(() => {
              setPlaceholderText(current.slice(0, charIdx - 1));
              setCharIdx(charIdx - 1);
            }, 28);
          } else {
            setIsDeleting(false);
            setSuggIdx((suggIdx + 1) % suggestions.length);
          }
        }
        return () => clearTimeout(timer);
      }, [charIdx, isDeleting, suggIdx, value, suggestions]);

      return (
        <input
          type="text"
          className={className}
          placeholder={value ? '' : placeholderText + '|'}
          value={value}
          onChange={onChange}
          onFocus={onFocus}
          onKeyDown={onKeyDown}
        />
      );

    }

    // ── Animated Counter Component ──
    function AnimatedCounter({ value, prefix = '$', className, duration = 600 }) {
      const toNum = (v) => {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      };
      const safeValue = toNum(value);
      const [display, setDisplay] = React.useState(safeValue);
      const prevRef = React.useRef(safeValue);
      const [popping, setPopping] = React.useState(false);

      React.useEffect(() => {
        const from = prevRef.current;
        const to = toNum(value);
        if (from === to) return;
        prevRef.current = to;
        setPopping(true);
        const start = performance.now();
        const step = (now) => {
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          // Ease out cubic
          const eased = 1 - Math.pow(1 - progress, 3);
          setDisplay(Math.round(from + (to - from) * eased));
          if (progress < 1) requestAnimationFrame(step);
          else setTimeout(() => setPopping(false), 300);
        };
        requestAnimationFrame(step);
      }, [value, duration]);

      return (
        <span className={`${className} ${popping ? 'count-pop' : ''}`}>
          {prefix}{display.toLocaleString()}
        </span>
      );
    }

    // ── Recent Searches Helper (persisted) ──
    function useRecentSearches(maxItems = 6) {
      const [recents, setRecents] = React.useState(() => {
        return getJSON('recent_searches', []);
      });
      const add = (term) => {
        setRecents(prev => {
          const filtered = prev.filter(r => r !== term);
          const updated = [term, ...filtered].slice(0, maxItems);
          setJSON('recent_searches', updated);
          return updated;
        });
      };
      return { recents, addRecent: add };
    }

    // ── Favorites Helper (persisted) ──
    function useFavoriteAirlines() {
      const [favorites, setFavorites] = React.useState(() => {
        return getJSON('favorite_airlines', []);
      });
      const toggle = (airlineName) => {
        setFavorites(prev => {
          const updated = prev.includes(airlineName)
            ? prev.filter(n => n !== airlineName)
            : [...prev, airlineName];
          setJSON('favorite_airlines', updated);
          return updated;
        });
      };
      const isFav = (airlineName) => favorites.includes(airlineName);
      return { favorites, toggleFavorite: toggle, isFavorite: isFav };
    }

    // ── Login Floating Particles ──
    function LoginParticles() {
      const canvasRef = React.useRef(null);
      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        let animId;

        const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
        resize();
        window.addEventListener('resize', resize);

        const particles = [];
        const count = 34;
        for (let i = 0; i < count; i++) {
          const isGold = Math.random() < 0.25;
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height * 0.55,
            size: 0.6 + Math.random() * 1.0,
            speedX: (Math.random() - 0.5) * 0.18,
            speedY: (Math.random() - 0.5) * 0.12 - 0.06,
            opacity: 0.06 + Math.random() * 0.16,
            pulse: Math.random() * Math.PI * 2,
            pulseSpeed: 0.002 + Math.random() * 0.006,
            r: isGold ? 255 : 255,
            g: isGold ? 193 : 255,
            b: isGold ? 54 : 255,
          });
        }

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;
            p.pulse += p.pulseSpeed;
            const alpha = p.opacity * (0.4 + 0.6 * Math.sin(p.pulse));

            // Gentle wrap: keep most particles in upper band so they sit behind logo, not the card footer
            if (p.x < -12) p.x = canvas.width + 12;
            if (p.x > canvas.width + 12) p.x = -12;
            if (p.y < -16 || p.y > canvas.height * 0.7) {
              p.y = canvas.height * (0.15 + Math.random() * 0.3);
            }

            // Main dot
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha})`;
            ctx.fill();

            // Soft glow halo
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha * 0.04})`;
            ctx.fill();
          });

          animId = requestAnimationFrame(draw);
        };
        draw();

        return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); };
      }, []);
      return <canvas ref={canvasRef} className="login-particles-canvas" />;
    }

    // ── Hero shooting stars canvas (night sky) ──
    function HeroPlaneCanvas() {
      const canvasRef = React.useRef(null);
      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animId;
        let stars = [];

        const makeShootingStar = (delayOnly = false) => {
          const w = canvas.width || canvas.offsetWidth || 0;
          const h = canvas.height || canvas.offsetHeight || 0;
          if (!w || !h) return null;

          const fromLeft = Math.random() > 0.5;
          const fromTop = !fromLeft && Math.random() > 0.5;

          let x, y, vx, vy;
          if (fromLeft) {
            x = -40;
            y = Math.random() * h * 0.55;
            vx = (3.2 + Math.random() * 2.6) * 0.72;
            vy = (0.85 + Math.random() * 1.35) * 0.72;
          } else if (fromTop) {
            x = Math.random() * w;
            y = -40;
            vx = (0.85 + Math.random() * 1.5) * 0.72;
            vy = (2.8 + Math.random() * 2.1) * 0.72;
          } else {
            x = w + 40;
            y = Math.random() * h * 0.55;
            vx = -((3.2 + Math.random() * 2.6) * 0.72);
            vy = (0.85 + Math.random() * 1.35) * 0.72;
          }

          const length = 12 + Math.random() * 16;
          const maxLife = 48 + Math.random() * 32;
          const lineWidth = 0.85 + Math.random() * 0.5;

          return {
            x,
            y,
            vx,
            vy,
            length,
            lineWidth,
            life: 0,
            maxLife,
            delay: delayOnly ? Math.floor(Math.random() * 220) + 40 : 0
          };
        };

        const initStars = () => {
          stars = [];
          const count = 2 + Math.floor(Math.random() * 2);
          for (let i = 0; i < count; i++) {
            const s = makeShootingStar(true);
            if (s) stars.push(s);
          }
        };

        const resize = () => {
          const w = canvas.offsetWidth;
          const h = canvas.offsetHeight;
          if (!w || !h) return;
          canvas.width = w;
          canvas.height = h;
          initStars();
        };
        resize();
        window.addEventListener('resize', resize);

        const drawStar = (star) => {
          if (star.delay > 0) {
            star.delay--;
            return;
          }

          star.life++;
          star.x += star.vx;
          star.y += star.vy;

          const w = canvas.width;
          const h = canvas.height;
          if (
            star.life > star.maxLife ||
            star.x < -80 || star.x > w + 80 ||
            star.y < -80 || star.y > h + 80
          ) {
            const replacement = makeShootingStar(true);
            if (replacement) {
              Object.assign(star, replacement);
            }
            return;
          }

          const t = star.life / star.maxLife;
          const alpha = t < 0.2
            ? t / 0.2
            : t > 0.8
              ? (1 - t) / 0.2
              : 1;

          const tailX = star.x - star.vx * star.length;
          const tailY = star.y - star.vy * star.length;

          const grad = ctx.createLinearGradient(tailX, tailY, star.x, star.y);
          grad.addColorStop(0, `rgba(186, 230, 253, 0)`);
          grad.addColorStop(0.4, `rgba(224, 242, 254, ${0.22 * alpha})`);
          grad.addColorStop(1, `rgba(255, 255, 255, ${0.58 * alpha})`);

          ctx.strokeStyle = grad;
          ctx.lineWidth = star.lineWidth != null ? star.lineWidth : 1.2;
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(star.x, star.y);
          ctx.stroke();

          ctx.fillStyle = `rgba(255, 255, 255, ${0.72 * alpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, 1.15, 0, Math.PI * 2);
          ctx.fill();
        };

        const draw = () => {
          if (!canvas.width || !canvas.height || stars.length === 0) {
            animId = requestAnimationFrame(draw);
            return;
          }
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < stars.length; i++) {
            drawStar(stars[i]);
          }
          animId = requestAnimationFrame(draw);
        };
        draw();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', resize);
        };
      }, []);
      return <canvas ref={canvasRef} className="hero-plane-canvas" />;
    }

    // ── Hero decorative lock: 2:1 aspect box that *covers* the hero (full width on wide screens), clipped by wrapper ──
    function HeroDecorativeLock({ children }) {
      const lockRef = React.useRef(null);
      React.useEffect(() => {
        const el = lockRef.current;
        if (!el) return;
        const parent = el.parentElement;
        if (!parent) return;
        const update = () => {
          const r = parent.getBoundingClientRect();
          const w = r.width, h = r.height;
          if (w <= 0 || h <= 0) return;
          // Cover: smallest 2:1 rect that covers the parent (no horizontal restriction)
          const coverW = Math.max(w, 2 * h);
          const coverH = Math.max(h, w / 2);
          el.style.width = coverW + 'px';
          el.style.height = coverH + 'px';
        };
        update();
        const ro = new ResizeObserver(update);
        ro.observe(parent);
        window.addEventListener('resize', update);
        return () => { ro.disconnect(); window.removeEventListener('resize', update); };
      }, []);
      return <div ref={lockRef} className="hero-decorative-lock">{children}</div>;
    }

    // ── Region-based modal header colors ──
    function getRegionTheme(country) {
      const c = (country || '').toLowerCase();
      // Canada — Porter home, navy + maple warmth
      if (c === 'canada') return { bg: 'linear-gradient(135deg, #152C53 0%, #1e3a6e 50%, #2d1b3d 100%)', accent: 'text-red-300', icon: 'text-red-300' };
      // USA
      if (c === 'usa') return { bg: 'linear-gradient(135deg, #1a2744 0%, #1e3050 50%, #152040 100%)', accent: 'text-blue-300', icon: 'text-blue-300' };
      // Mexico, Central & South America, Caribbean
      if (['mexico','argentina','brazil','chile','colombia','bolivia','venezuela','dominican rep.','trinidad','cayman is.','sint maarten','guadeloupe','saint pierre','cook islands'].includes(c))
        return { bg: 'linear-gradient(135deg, #1a3a2a 0%, #1e4d3a 50%, #0f2b1f 100%)', accent: 'text-emerald-300', icon: 'text-emerald-300' };
      // UK & Ireland
      if (['uk','iceland'].includes(c)) return { bg: 'linear-gradient(135deg, #1e2a45 0%, #2a3555 50%, #1a2540 100%)', accent: 'text-sky-300', icon: 'text-sky-300' };
      // Western Europe — France, Germany, Italy, Spain, etc
      if (['france','germany','italy','spain','belgium','netherlands','switzerland','austria','portugal','malta','greece','croatia','denmark','poland','czech rep.','greenland'].includes(c))
        return { bg: 'linear-gradient(135deg, #2a1f3d 0%, #352a50 50%, #1e1830 100%)', accent: 'text-violet-300', icon: 'text-violet-300' };
      // Scandinavia & Nordics
      if (['norway','finland','scandinavia'].includes(c)) return { bg: 'linear-gradient(135deg, #0f2a3d 0%, #163850 50%, #0d2030 100%)', accent: 'text-cyan-300', icon: 'text-cyan-300' };
      // Middle East
      if (['uae','qatar','saudi arabia','oman','bahrain','kuwait','jordan','israel','turkey'].includes(c))
        return { bg: 'linear-gradient(135deg, #3d2a0f 0%, #4d3518 50%, #2d1f08 100%)', accent: 'text-amber-300', icon: 'text-amber-300' };

    function getMergedAirlineFares() {
      const base = { ...AIRLINE_FARES };
      try {
        const raw = getJSON('admin_zed_fare_tables', null);
        if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
          Object.keys(raw).forEach((name) => {
            const entry = raw[name];
            if (!entry || typeof entry !== 'object') return;
            const zones = entry.zones;
            const cur = toText(entry.currency, '').toUpperCase();
            if (!Array.isArray(zones) || (cur !== 'USD' && cur !== 'CAD')) return;
            base[toText(name, '').trim() || name] = { currency: cur, zones, fromAdmin: true };
          });
        }
      } catch (_) {}
      return base;
    }

    // Helper: get fare for a specific airline + mileage
    function getAirlineFare(airlineName, miles) {
      const merged = getMergedAirlineFares();
      const custom = merged[airlineName];
      if (!custom || !miles || miles <= 0) return null;
      for (const z of custom.zones) {
        if (miles <= z.max) {
          return z.fare !== null ? { fare: z.fare, zone: z.label, currency: custom.currency, isCustom: true } : { fare: null, zone: z.label, currency: custom.currency, isCustom: true, unavailable: true };
        }
      }
      return { fare: null, zone: 'Beyond', currency: custom.currency, isCustom: true, unavailable: true };
    }

      const n = Number(usd);
      if (!Number.isFinite(n)) return 0;

      1: { LOW: 22, MED: 33, HIGH: 49 }, 2: { LOW: 29, MED: 44, HIGH: 66 },
      3: { LOW: 39, MED: 59, HIGH: 89 }, 4: { LOW: 52, MED: 78, HIGH: 117 },

    };
    function getZoneByMiles(miles) {
      if (!miles || miles <= 0) return 0;
      if (miles <= 450) return 1;
      if (miles <= 1250) return 2;
      if (miles <= 2300) return 3;
      if (miles <= 3500) return 4;
      if (miles <= 5200) return 5;
      if (miles <= 7100) return 6;
      if (miles <= 9200) return 7;
      if (miles <= 12000) return 8;
      return 9;
    }
    function calculateGreatCircleMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2
        + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }
    function getGenericZedFareUSD(zedTier, miles) {
      const zone = getZoneByMiles(miles);
      if (!zone) return null;
      const rates = BASE_ZED_RATES[zone];
      if (!rates) return null;
      const zed = (zedTier || '').toUpperCase();
      if (zed === 'NOT ACTIVE') return null;
      if (zed === 'LOW') return rates.LOW;
      if (zed === 'MED' || zed === 'MEDIUM') return rates.MED;
      if (zed === 'HIGH') return rates.HIGH;
      // SPECIAL: midpoint of LOW/MED — approximate; confirm with carrier.
      if (zed === 'SPECIAL') return Math.round((rates.LOW + rates.MED) / 2);
      return null;
    }

    function countryToTaxRegion(country) {
      const c = toText(country, '').trim();
      if (!c) return 'INTL';
      if (c === 'Canada') return 'CA';
      if (c === 'USA') return 'US';
      if (c === 'Mexico') return 'MX';
      const eu = new Set(['UK', 'France', 'Germany', 'Spain', 'Italy', 'Netherlands', 'Ireland', 'Portugal', 'Greece', 'Switzerland', 'Belgium', 'Austria', 'Norway', 'Sweden', 'Denmark', 'Finland', 'Iceland', 'Poland', 'Czech Rep.', 'Croatia', 'Turkey', 'Hungary', 'Romania', 'Estonia', 'Latvia', 'Lithuania', 'Luxembourg', 'Malta', 'Cyprus', 'Slovakia', 'Slovenia']);
      if (eu.has(c)) return 'EU';
      const longHaul = new Set(['Australia', 'New Zealand', 'Japan', 'China', 'South Korea', 'India', 'Singapore', 'Thailand', 'United Arab Emirates', 'Qatar', 'Hong Kong', 'Taiwan', 'Philippines', 'Malaysia', 'Indonesia', 'Vietnam', 'Israel', 'S. Africa', 'Brazil', 'Argentina', 'Chile', 'Colombia', 'Peru']);
      if (longHaul.has(c)) return 'LH';
      const carib = new Set(['Bahamas', 'Jamaica', 'Cuba', 'Dominican Republic', 'Puerto Rico', 'Haiti', 'Trinidad and Tobago', 'Barbados', 'Cayman Islands', 'Aruba', 'Curaçao', 'Sint Maarten', 'Turks and Caicos', 'Bermuda']);
      if (carib.has(c)) return 'CB';
      return 'INTL';
    }

    function estimateTaxCadForRoute(originAirport, destinationAirport, segments) {
      const s = Math.max(1, segments || 1);
      if (!originAirport || !destinationAirport) {
        return { taxLow: 30 * s, taxHigh: 80 * s, bucketKey: 'default' };
      }
      const a = countryToTaxRegion(originAirport.country);
      const b = countryToTaxRegion(destinationAirport.country);
      let low = 35;
      let high = 95;
      if (a === 'CA' && b === 'CA') { low = 24; high = 72; }
      else if ((a === 'CA' && b === 'US') || (a === 'US' && b === 'CA')) { low = 42; high = 100; }
      else if (a === 'US' && b === 'US') { low = 34; high = 90; }
      else if (a === 'EU' && b === 'EU') { low = 28; high = 82; }
      else if (a === 'EU' || b === 'EU') { low = 78; high = 190; }
      else if (a === 'LH' || b === 'LH') { low = 88; high = 215; }
      else if (a === 'CB' || b === 'CB') { low = 44; high = 115; }
      else if (a === 'MX' || b === 'MX') { low = 42; high = 108; }
      return { taxLow: low * s, taxHigh: high * s, bucketKey: `${a}-${b}` };
    }

    function normalizeIataCode(v) {
      return toText(v, '').trim().toUpperCase();
    }
    function parseBookingDays(periodText) {
      const t = toText(periodText, '').toLowerCase();
      if (!t) return 0;
      if (t.includes('call') || t.includes('contact')) return 0;
      const match = t.match(/(\d{1,3})/);
      return match ? Number(match[1]) : 0;
    }
    function getTravelerTierForAirline(airline, travelerType) {
      if (!airline) return 'NOT ACTIVE';
      const rawTier = travelerType === 'PARENT'
        ? (airline.parentOverride || airline.zed)
        : airline.zed;
      const tier = toText(rawTier, '').toUpperCase();
      return tier || 'NOT ACTIVE';
    }
    function convertUsdToDisplayAmount(usd, currency, isRoundTrip) {
      const mult = isRoundTrip ? 2 : 1;
      return currency === 'CAD'
        ? Math.round((usd || 0) * getCadRate() * mult)
        : roundUsdCents((usd || 0) * mult);
    }
    function getFareResultForAirline({ airline, miles, travelerType, currency, isRoundTrip, originAirport, destinationAirport }) {
      if (!airline) return { available: false, reason: 'No airline selected', notActive: false };
      if (!miles || miles <= 0) return { available: false, reason: 'Distance not available', notActive: false };
      const tier = getTravelerTierForAirline(airline, travelerType);
      if (tier === 'NOT ACTIVE') return { available: false, reason: 'No active agreement', notActive: true, tier };

      const custom = getAirlineFare(airline.name, miles);
      const customUnavailable = !!(custom && custom.isCustom && custom.unavailable);
      if (customUnavailable) {
        return {
          available: false,
          reason: 'Route unavailable in airline fare table',
          notActive: false,
          tier,
          source: 'verified',
          zoneLabel: custom.zone || 'N/A'
        };
      }

      const baseUsd = custom && custom.isCustom
        ? (custom.currency === 'CAD' ? custom.fare / getCadRate() : custom.fare)
        : getGenericZedFareUSD(tier, miles);
      if (!baseUsd || !Number.isFinite(baseUsd) || baseUsd <= 0) {
        return { available: false, reason: 'Fare not available', notActive: false, tier };
      }

      const baseAmount = convertUsdToDisplayAmount(baseUsd, currency, isRoundTrip);
      const segments = isRoundTrip ? 2 : 1;
      const taxCad = estimateTaxCadForRoute(originAirport, destinationAirport, segments);
      const taxLow = currency === 'CAD' ? taxCad.taxLow : Math.round(taxCad.taxLow / getCadRate());
      const taxHigh = currency === 'CAD' ? taxCad.taxHigh : Math.round(taxCad.taxHigh / getCadRate());
      const zone = getZoneByMiles(miles);

      return {
        available: true,
        notActive: false,
        tier,
        source: custom && custom.isCustom ? 'verified' : 'generic',
        zoneLabel: custom && custom.isCustom ? custom.zone : `Zone ${zone}`,
        baseUsd,
        baseAmount,
        currency,
        taxLow,
        taxHigh,
        totalLow: baseAmount + taxLow,
        totalHigh: baseAmount + taxHigh,
        taxBucketKey: taxCad.bucketKey,
        bookingDays: parseBookingDays(airline.bookingPeriod),
        bookingPeriod: toText(airline.bookingPeriod, 'N/A')
      };
    }
    function getLatestAirlineAdminUpdate(historyRows) {
      if (!Array.isArray(historyRows)) return null;
      const sorted = [...historyRows]
        .filter(x => isPlainObject(x) && toText(x.at, ''))
        .sort((a, b) => Date.parse(toText(b.at, '')) - Date.parse(toText(a.at, '')));
      const match = sorted.find(item => toText(item.detail, '').toLowerCase().includes('airlines'));
      return match ? toText(match.at, '') : null;

    /** When total + open seats are both valid, map load factor to risk delta (aligns with SEAT_HINT scale). */
    function standbySeatCountAdjustment(totalStr, freeStr) {
      const total = parseInt(String(totalStr || '').replace(/[^\d]/g, ''), 10);
      const free = parseInt(String(freeStr || '').replace(/[^\d]/g, ''), 10);
      if (!Number.isFinite(total) || !Number.isFinite(free) || total < 1 || free < 0 || free > total) return null;
      const r = free / total;
      let pts;
      if (r >= 0.32) pts = -10;
      else if (r <= 0.11) pts = 20;
      else pts = 6;
      const pct = Math.round(r * 100);
      return { pts, label: `${free} open / ${total} seats (~${pct}% available)` };
    }

    function standbyTimeAddMinutes(timeStr, deltaMins) {
      const parts = String(timeStr || '12:00').split(':');
      const hh = Number(parts[0]) || 0;
      const mm = Number(parts[1]) || 0;
      let total = hh * 60 + mm + deltaMins;
      total = ((total % 1440) + 1440) % 1440;
      const h = Math.floor(total / 60);
      const m = total % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }
    function standbyDateAddDays(dateStr, days) {
      const s = String(dateStr || '').trim().replace(/\//g, '-');
      const today = () => new Date().toISOString().slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s || today();
      const d = new Date(`${s}T12:00:00`);
      if (Number.isNaN(d.getTime())) return today();
      d.setDate(d.getDate() + days);
      if (Number.isNaN(d.getTime())) return s;
      return d.toISOString().slice(0, 10);
    }

    /** Map departure date (YYYY-MM-DD) → check-timing bucket vs today’s calendar date (UTC-safe day diff). */
    function standbyCheckTimingFromDeparture(dateStr) {
      const s = String(dateStr || '').trim().replace(/\//g, '-');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '1-2-days';
      const p = s.split('-').map(Number);
      const depUtc = Date.UTC(p[0], p[1] - 1, p[2]);
      if (Number.isNaN(depUtc)) return '1-2-days';
      const n = new Date();
      const todayUtc = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
      const diffDays = Math.round((depUtc - todayUtc) / 86400000);
      if (diffDays <= 0) return 'same-day';
      if (diffDays <= 2) return '1-2-days';
      if (diffDays < 14) return 'this-week';
      return '2plus-weeks';
    }

    const STANDBY_TIME_BANDS = [
      { min: 0,    max: 239,  points: -4, key: 'standby_overnight' },
      { min: 240,  max: 359,  points: -8, key: 'standby_very_early' },
