                      <div className="rounded-2xl border border-slate-200 bg-slate-50/80 px-4 py-3">
                        <p className="text-[9px] font-black uppercase tracking-widest text-slate-400">Night flights</p>
                        <p className="text-lg font-black text-[#152C53] leading-tight">∞</p>
                        <p className="text-[10px] text-slate-500 mt-0.5">Auroras spotted from 36,000 ft</p>
                      </div>
                    </div>

                    {/* Role picker + dynamic line */}
                    <div className="space-y-2">
                      <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">
                        Where were you in 2006?
                      </p>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { id: 'crew', label: 'Cabin / Flight Crew' },
                          { id: 'ground', label: 'CSA / Ramp' },
                          { id: 'ops', label: 'Dispatch / OCC' },
                          { id: 'hq', label: 'HQ / Support' },
                          { id: 'new', label: 'Joined later' },
                        ].map(opt => (
                          <button
                            key={opt.id}
                            type="button"
                            onClick={() => setEasterEggRole(opt.id)}
                            className={`px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border transition-all ${
                              easterEggRole === opt.id
                                ? 'bg-[#152C53] text-white border-[#152C53]'
                                : 'bg-white text-slate-500 border-slate-200 hover:border-slate-400'
                            }`}
                          >
                            {opt.label}
                          </button>
                        ))}
                      </div>
                      <p className="text-[11px] text-slate-600 font-medium">
                        {easterEggRole === 'crew' && "Here’s to every jumpseat, RON, and deadhead that turned into a story."}
                        {easterEggRole === 'ground' && "Here’s to every tight turn, gate change, and “one more standby” you made happen."}
                        {easterEggRole === 'ops' && "Here’s to every slot swap, reroute, and weather night you quietly rescued."}
                        {easterEggRole === 'hq' && "Here’s to the tooling, policies, and support that keep the non‑rev magic running."}
                        {easterEggRole === 'new' && "Here’s to being part of the next 20 years of Porter stories."}
                      </p>
                    </div>

                    {/* Discovery code + share */}
                    <div className="mt-4 grid grid-cols-1 sm:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)] gap-3 items-stretch">
                      <div className="p-4 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50/80 flex flex-col justify-center">
                        <p className="text-[9px] font-black uppercase text-slate-400 tracking-[0.2em] mb-1">Discovery code</p>
                        <span className="text-2xl font-black text-[#152C53] tracking-[0.3em] font-mono break-all">{easterEggCode}</span>
                        <p className="text-[10px] text-slate-500 mt-2">
                          Screenshot this or copy the message below and send it to Mitchell Byers. Prize for the first eligible finder.
                        </p>
                      </div>
                      <div className="p-4 rounded-2xl border border-slate-200 bg-white flex flex-col justify-between gap-2">
                        <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">Shareable text</p>
                        <p className="text-[11px] text-slate-600 leading-relaxed">
                          “Found the Porter 20th birthday easter egg in the staff tools — code <span className="font-mono font-bold">{easterEggCode}</span>.”
                        </p>
                        <button
                          type="button"
                          onClick={async () => {
                            const ok = await copyText(
                              `Found the Porter 20th birthday easter egg in the staff tools — code ${easterEggCode}.`
                            );
                            if (ok) {
                              setEasterEggCopied(true);
                              setTimeout(() => setEasterEggCopied(false), 2000);
                            }
                          }}
                          className="mt-1 inline-flex items-center justify-center px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest bg-[#152C53] text-white hover:bg-[#1f325f] active:scale-95 transition-all"
                        >
                          {easterEggCopied ? 'Copied!' : 'Copy text'}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="relative mt-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                  <p className="text-[10px] text-slate-400">
                    Thank you for being part of the first 20 years of Porter. Here’s to the next chapters. ✨
                  </p>
                  <button
                    onClick={() => setShowEasterEgg(false)}
                    className="w-full sm:w-auto px-6 py-3 bg-[#152C53] text-white font-black uppercase tracking-widest rounded-2xl shadow-lg active:scale-95 transition-all text-[11px]"
                  >
                    Close & keep exploring
                  </button>
                </div>
              </div>
            </div>
          )}

          {selectedAirline && (() => {
            const zed = selectedAirline.zed?.toUpperCase();
            const isActive = zed && zed !== 'NOT ACTIVE';
            const zedBadgeColor = zed === 'LOW' ? 'bg-emerald-500' : zed === 'MED' || zed === 'MEDIUM' ? 'bg-amber-400' : zed === 'HIGH' ? 'bg-red-500' : 'bg-slate-500';
            const hasEmbargoes = selectedAirline.embargoes && selectedAirline.embargoes.trim().toLowerCase() !== 'none.' && selectedAirline.embargoes.trim() !== '';
            const regionTheme = getRegionTheme(selectedAirline.country);
            const parentFareRaw = selectedAirline.parentOverride != null ? selectedAirline.parentOverride : selectedAirline.zed;
            const parentFareU = String(parentFareRaw || '').toUpperCase();
            const parentsStatus = selectedAirline.parentOverride !== 'NOT ACTIVE' && (isActive || selectedAirline.parentOverride !== null);
            const showParentFareBadge = parentsStatus && parentFareU !== zed;
            return (
              <div
                className="fixed inset-0 z-[300] flex items-end sm:items-center justify-center p-0 sm:p-6 animate-fade-in"
                style={{ animationDuration: '0.25s' }}
                role="dialog"
                aria-modal="true"
                aria-labelledby="airline-modal-title"
              >
                <div
                  className="absolute inset-0 bg-[#001529]/70 transition-opacity"
                  style={{ backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)' }}
                  onClick={() => setSelectedAirline(null)}
                  aria-hidden="true"
                ></div>
                <p className="absolute top-6 left-1/2 -translate-x-1/2 text-[9px] font-medium text-white/25 uppercase tracking-widest pointer-events-none sm:hidden">{t('airline_modal_tap_close')}</p>
                <div className={`relative w-full sm:max-w-3xl max-h-[92vh] sm:max-h-[88vh] rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl animate-slide-up flex flex-col bg-[#152C53]`} style={{ overflow: 'clip' }}>

                  {/* Hero header — region-colored gradient */}
                  <div className="relative shrink-0 text-white" style={{ background: regionTheme.bg }}>
                    <div className="absolute inset-0" style={{ background: 'linear-gradient(to top, rgba(0,0,0,0.25) 0%, transparent 55%)' }}></div>
                    {/* Subtle flag watermark */}
                    <div className="absolute top-14 sm:top-16 right-4 sm:right-8 text-[70px] sm:text-[100px] leading-none opacity-[0.05] pointer-events-none select-none">{selectedAirline.flag}</div>
                    {/* Favorite (left) + Close (right) — close matches common pattern & high contrast */}
                    <div className="relative z-20 flex items-center justify-between gap-3 px-4 sm:px-6 pt-4">
                      <button type="button" onClick={(e) => { e.stopPropagation(); toggleFavorite(selectedAirline.name); }} className={`p-3 min-w-[44px] min-h-[44px] rounded-full transition-all border flex items-center justify-center shrink-0 group/star ${isFavorite(selectedAirline.name) ? 'bg-[#FFC136] border-[#FFC136] text-[#152C53] hover:scale-110' : 'bg-white/10 hover:bg-white/20 hover:scale-105 border-white/10 text-white'}`} title={isFavorite(selectedAirline.name) ? 'Remove from favorites' : 'Add to favorites'} aria-label={isFavorite(selectedAirline.name) ? 'Remove from favorites' : 'Add to favorites'}>
                        {isFavorite(selectedAirline.name) ? <Icons.StarFilled className="w-5 h-5" /> : <Icons.Star className="w-5 h-5 group-hover/star:opacity-100 opacity-70" />}
                      </button>
                      <button type="button" onClick={() => setSelectedAirline(null)} aria-label={t('airline_modal_close_aria')} className="p-3 min-w-[44px] min-h-[44px] bg-white text-[#152C53] hover:bg-slate-100 rounded-full transition-all shadow-lg border-2 border-[#FFC136]/70 flex items-center justify-center shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FFC136] focus-visible:ring-offset-2 focus-visible:ring-offset-transparent">
                        <Icons.X className="w-6 h-6" />
                      </button>
                    </div>
                    <div className="relative z-10 px-6 pt-2 sm:pt-3 pb-6 flex flex-col items-center text-center gap-3">
                      <div className="flex justify-center modal-stagger-1">
                        <AirlineFlyStandbyLogo
                          name={selectedAirline.name}
                          wrapClassName="rounded-2xl bg-white p-2 shadow-lg border border-white/30 w-[4.5rem] h-[4.5rem] sm:w-[5.25rem] sm:h-[5.25rem] flex items-center justify-center overflow-hidden"
                        />
                      </div>
                      {/* Airline name */}
                      <h2 id="airline-modal-title" className="text-3xl sm:text-5xl font-black text-white tracking-tight leading-tight modal-stagger-1">{selectedAirline.name}</h2>
                      {/* Country + flag */}
                      <div className={`flex items-center gap-2 text-white/60 text-[10px] font-black uppercase tracking-widest modal-stagger-1`}>
                        <Icons.Plane className={`w-3.5 h-3.5 ${regionTheme.icon}`} />
                        <span className="text-2xl leading-none">{selectedAirline.flag}</span>
                        <span>{selectedAirline.country}</span>
                      </div>
                      {/* Key stats row */}
                      <div className="flex flex-wrap items-center justify-center gap-3 mt-1 modal-stagger-2">
                        {/* ZED tier badge */}
                        <div className={`px-4 py-2 rounded-2xl flex items-center gap-2 ${isActive ? zedBadgeColor : 'bg-slate-600'}`}>
                          <Icons.Ticket className="w-3.5 h-3.5 text-white/80" />
                          <span className="text-white font-black text-[10px] uppercase tracking-widest">
                            {isActive ? `${t('eligibility_fare_zed_prefix')} ${zed}` : t('airline_modal_zed_inactive')}
                          </span>
                        </div>
                        {/* Booking period */}
                        <div className="px-4 py-2 rounded-2xl bg-white/10 border border-white/10 flex items-center gap-2">
                          <Icons.Calendar className="w-3.5 h-3.5 text-white/60" />
                          <span className="text-white font-black text-[10px] uppercase tracking-widest">{selectedAirline.bookingPeriod}</span>
                        </div>
                        {/* JS badge if available */}
                        {(selectedAirline.js || selectedAirline.faJs) && (
                          <div className="px-4 py-2 rounded-2xl bg-cyan-500/80 flex items-center gap-2">
                            <Icons.Briefcase className="w-3.5 h-3.5 text-white/80" />
                            <span className="text-white font-black text-[10px] uppercase tracking-widest">
                              {t(selectedAirline.js && selectedAirline.faJs ? 'airline_modal_js_badge_both' : selectedAirline.js ? 'airline_modal_js_badge_pilot' : 'airline_modal_js_badge_fa')}
                            </span>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Body */}
                  <div className={`px-4 sm:px-8 py-6 overflow-y-auto custom-scroll flex-1 space-y-6 ${darkMode ? 'bg-[#1e293b] text-slate-200' : 'bg-white text-slate-800'}`}>

                    {/* Eligibility grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 modal-stagger-3">
                      <div className="space-y-3">
                        <h3 className={`text-[10px] font-black uppercase tracking-widest pb-2 border-b mb-4 ${darkMode ? 'text-slate-400 border-slate-700' : 'text-slate-400 border-slate-200'}`}>Employee / Retiree</h3>
                        <EligibilityItem darkMode={darkMode} icon={Icons.User} label="Employee (R2)" status={isActive} fare={selectedAirline.zed} showFareBadge={!isActive} />
                        <EligibilityItem darkMode={darkMode} icon={Icons.User} label="Retiree (R2)" status={isActive} fare={selectedAirline.zed} showFareBadge={!isActive} />
                        <EligibilityItem darkMode={darkMode} icon={Icons.Briefcase} label="Pilot Jumpseat" status={selectedAirline.js} fare="JS" showFareBadge />
                        <EligibilityItem darkMode={darkMode} icon={Icons.Briefcase} label="F/A Jumpseat" status={selectedAirline.faJs} fare="JS" showFareBadge />
                      </div>
                      <div className="space-y-3">
                        <h3 className={`text-[10px] font-black uppercase tracking-widest pb-2 border-b mb-4 ${darkMode ? 'text-slate-400 border-slate-700' : 'text-slate-400 border-slate-200'}`}>Dependents & Guests</h3>
                        <EligibilityItem darkMode={darkMode} icon={Icons.Heart} label="Spouse / Partner" status={isActive} fare={selectedAirline.zed} showFareBadge={!isActive} />
                        <EligibilityItem darkMode={darkMode} icon={Icons.Users} label="Children (< 24)" status={isActive} fare={selectedAirline.zed} showFareBadge={!isActive} />
                        <EligibilityItem darkMode={darkMode} icon={Icons.Users} label="Parents" status={parentsStatus} fare={selectedAirline.parentOverride || selectedAirline.zed} showFareBadge={parentsStatus && showParentFareBadge} />
                        <EligibilityItem darkMode={darkMode} icon={Icons.Heart} label="Travel Companion" status={isActive} fare={selectedAirline.zed} showFareBadge={!isActive} />
                      </div>
                    </div>

                    {/* Verified fare table — when airline has custom fare data */}
                    {typeof hasCustomFares === 'function' && hasCustomFares(selectedAirline.name) && AIRLINE_FARES[selectedAirline.name] && (
                      <div className={`rounded-2xl border p-5 modal-stagger-4 ${darkMode ? 'bg-emerald-950/20 border-emerald-800/50' : 'bg-emerald-50/80 border-emerald-200'}`}>
                        <div className="flex items-center gap-2 mb-3">
                          <Icons.Ticket className={`w-4 h-4 shrink-0 ${darkMode ? 'text-emerald-400' : 'text-emerald-600'}`} />
                          <span className={`text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-emerald-400' : 'text-emerald-700'}`}>Verified fare table (base, one-way)</span>
                          <span className={`text-[9px] font-bold ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>{AIRLINE_FARES[selectedAirline.name].currency}</span>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left border-collapse">
                            <thead>
                              <tr className={`border-b ${darkMode ? 'border-slate-700' : 'border-emerald-200'}`}>
                                <th className={`py-2 pr-4 text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>Zone</th>
                                <th className={`py-2 pr-4 text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>Max mi</th>
                                <th className={`py-2 text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>Fare</th>
                              </tr>
                            </thead>
                            <tbody>
                              {(AIRLINE_FARES[selectedAirline.name].zones || []).map((z, i) => (
                                <tr key={i} className={`border-b last:border-0 ${darkMode ? 'border-slate-700/50' : 'border-emerald-100'}`}>
                                  <td className={`py-2 pr-4 text-[11px] font-bold ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>{z.label}</td>
                                  <td className={`py-2 pr-4 text-[11px] font-bold ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>{z.max.toLocaleString()}</td>
                                  <td className={`py-2 text-[11px] font-black ${z.fare != null ? (darkMode ? 'text-emerald-400' : 'text-emerald-700') : (darkMode ? 'text-slate-500' : 'text-slate-400')}`}>{z.fare != null ? `${AIRLINE_FARES[selectedAirline.name].currency === 'CAD' ? 'C' : ''}$${z.fare}` : 'N/A'}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                        <p className={`mt-2 text-[9px] font-bold ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>Taxes and fees not included. Confirm on myIDTravel.</p>
                      </div>
                    )}

                    {/* Embargoes — only if non-empty */}
                    {hasEmbargoes && (
                      <div className={`rounded-2xl border p-5 modal-stagger-4 ${darkMode ? 'bg-amber-950/30 border-amber-800/50' : 'bg-amber-50 border-amber-200'}`}>
                        <div className="flex items-center gap-2 mb-3">
                          <Icons.AlertTriangle className="w-4 h-4 text-amber-500 shrink-0" />
                          <span className="text-[9px] font-black uppercase tracking-widest text-amber-500">Important</span>
                          <span className="text-[10px] font-black uppercase tracking-widest text-amber-600">— Embargoes / Restrictions</span>
                        </div>
                        <p className={`text-[13px] font-medium leading-[1.7] whitespace-pre-line ${darkMode ? 'text-amber-200' : 'text-amber-900'}`}>{selectedAirline.embargoes}</p>
                      </div>
                    )}

                    {/* Bottom padding for mobile scroll */}
                    <div className="h-4"></div>
                  </div>

                  {/* Full-width Calculate fare CTA bar — #1 user flow */}
                  {isActive && (
                    <div className="shrink-0 border-t border-white/10 bg-[#152C53]">
                      <button                        onClick={() => { const airline = selectedAirline; setSelectedAirline(null); setCalcAirline(airline); navigateTo('calculator'); }}
                        className="w-full px-6 py-4 min-h-[56px] bg-[#FFC136] hover:bg-yellow-300 text-[#152C53] text-[13px] font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2.5 shadow-[0_-4px_20px_rgba(0,0,0,0.15)] hover:shadow-[0_-4px_24px_rgba(255,193,54,0.35)] active:scale-[0.99]"
                      >
                        <Icons.Calculator className="w-5 h-5 shrink-0" />
                        <span>{t('airline_modal_calc_cta').replace('{name}', selectedAirline.name)}</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            );
          })()}
          {/* Command palette — Ctrl+K or / */}
          {isAuthenticated && showCommandPalette && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4" role="dialog" aria-label={t('command_palette_aria')}>
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowCommandPalette(false)} />
              <div className={`relative w-full max-w-lg rounded-2xl border-2 shadow-2xl overflow-hidden animate-fade-in ${darkMode ? 'bg-[#1e293b] border-slate-600' : 'bg-white border-slate-200'}`}>
                <div className="flex items-center gap-2 px-4 py-3 border-b border-slate-200/50">
                  <Icons.Search className={`w-5 h-5 shrink-0 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`} />
                  <input type="text" autoFocus value={commandPaletteQuery} onChange={e => setCommandPaletteQuery(e.target.value)} placeholder={t('command_palette_placeholder')} className={`flex-1 bg-transparent outline-none font-bold text-sm ${darkMode ? 'text-slate-100 placeholder-slate-500' : 'text-[#152C53] placeholder-slate-400'}`} onKeyDown={e => { if (e.key === 'Escape') setShowCommandPalette(false); }} />
                </div>
                <div className="max-h-72 overflow-y-auto py-2 custom-scroll">
                  {(() => {
                    const q = (commandPaletteQuery || '').trim().toLowerCase();
                    const calcMatch = ['calc', 'calculator', 'zed'].some(k => q === k || q.startsWith(k + ' '));
                    const airlineMatches = q.length >= 2 ? editableAirlines.filter(a => a.name.toLowerCase().includes(q)) : [];
                    const items = [];
                    if (calcMatch) items.push({ type: 'calc', label: t('command_palette_open_calc'), subtitle: t('command_palette_go_calc') });
                    airlineMatches.slice(0, 8).forEach(a => items.push({ type: 'airline', airline: a, label: a.name, subtitle: a.country }));
                    if (items.length === 0) {
                      return <div className={`px-4 py-6 text-center text-sm ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('command_palette_empty')}</div>;
                    }
                    return items.map((item, i) => (
                      <button key={i} className={`w-full px-4 py-3 text-left flex items-center gap-3 border-b last:border-0 ${darkMode ? 'border-slate-700/50 hover:bg-slate-700/50' : 'border-slate-100 hover:bg-slate-50'} ${i === 0 ? 'bg-[#152C53]/10' : ''}`}
                        onClick={() => {
                          if (item.type === 'calc') { setShowCommandPalette(false); navigateTo('calculator'); }
                          else if (item.type === 'airline') { setSelectedAirline(item.airline); setShowCommandPalette(false); }
                        }}
                      >
                        {item.type === 'airline' && (
                          <div className="flex items-center gap-2 shrink-0">
                            <AirlineFlyStandbyLogo
                              name={item.airline.name}
                              wrapClassName={`shrink-0 rounded-xl p-1 flex items-center justify-center overflow-hidden w-9 h-9 ${darkMode ? 'bg-white border border-slate-600' : 'bg-white border border-slate-200'}`}
                            />
                            <span className="text-lg">{item.airline.flag}</span>
                          </div>
                        )}
                        <div className="min-w-0 flex-1">
                          <span className={`block font-bold text-sm ${darkMode ? 'text-slate-200' : 'text-slate-800'}`}>{item.label}</span>
                          {item.subtitle && <span className={`block text-xs leading-relaxed ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>{item.subtitle}</span>}
                        </div>
                      </button>
                    ));
                  })()}
                </div>
              </div>
            </div>
          )}

          {/* Floating back-to-top button */}
          {showBackToTop && currentPage !== 'database' && (
            <button
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              className="fixed bottom-6 right-4 sm:bottom-8 sm:right-8 z-[999] w-12 h-12 bg-[#152C53] hover:bg-[#FFC136] text-white hover:text-[#152C53] rounded-full shadow-2xl flex items-center justify-center transition-all active:scale-90 animate-fade-in border border-white/10"
              title="Back to top" aria-label="Scroll back to top"
            >
              <span className="text-lg font-black leading-none">↑</span>
            </button>
          )}
        </div>
      )}
      </div>
        </I18nContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>

    <script>
        // PWA Service Worker Registration
        const SW_DEBUG = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => { })
                    .catch(() => { });
            });
        }
    </script>
</body>
</html>
