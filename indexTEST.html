    function standbyGetTimePoints(timeStr) {
      const [hh, mm] = timeStr.split(':').map(Number);
      const mins = hh * 60 + mm;
      const band = STANDBY_TIME_BANDS.find(b => mins >= b.min && mins <= b.max);
      return band ? band.points : 22;
    }

    function standbySuggestHubRoutes(from, to, tFn) {
      const o = (from || '').trim().toUpperCase();
      const d = (to || '').trim().toUpperCase();
      const gen = () => [tFn('standby_planb_hub_generic'), tFn('standby_planb_hub_generic2'), tFn('standby_planb_avoid_last')];
      if (!/^[A-Z]{3}$/.test(o) || !/^[A-Z]{3}$/.test(d)) return gen();
      const hit = (STANDBY_CONFIG.BACKUP_RULES || []).find(r => r.match(o, d));
      if (hit) return hit.suggestions(o, d);
      const oA = AIRPORTS_DB[o];
      const dA = AIRPORTS_DB[d];
      if (!oA || !dA) return gen();
      const hubs = STANDBY_CONFIG.SMART_HUBS || [];
      const direct = calculateGreatCircleMiles(oA.lat, oA.lon, dA.lat, dA.lon);
      const scored = [];
      for (let i = 0; i < hubs.length; i++) {
        const h = hubs[i];
        if (h === o || h === d) continue;
        const Ha = AIRPORTS_DB[h];
        if (!Ha) continue;
        const leg1 = calculateGreatCircleMiles(oA.lat, oA.lon, Ha.lat, Ha.lon);
        const leg2 = calculateGreatCircleMiles(Ha.lat, Ha.lon, dA.lat, dA.lon);
        const detour = leg1 + leg2 - direct;
        if (detour < 4200) scored.push({ h, detour });
      }
      scored.sort((a, b) => a.detour - b.detour);
      const top = scored.slice(0, 3);
      if (top.length === 0) return [`${o} → YYZ → ${d}`, `${o} → YUL → ${d}`, tFn('standby_planb_avoid_last')];
      return top.map(x => `${o} → ${x.h} → ${d}`);
    }

    function computeStandbyResult(params) {
      const { from, to, date, time, type, freq, gauge, priority, listPos, checkTiming, seatHint, seatTotal, seatFree, connection, specialEvent, t: tFn } = params;
      const DOW_KEYS = ['standby_sunday_departures', 'standby_monday_departures', 'standby_tuesday_departures', 'standby_wednesday_departures', 'standby_thursday_departures', 'standby_friday_departures', 'standby_saturday_departures'];
      const MONTH_KEYS = { 1: 'standby_january', 2: 'standby_february', 3: 'standby_march', 4: 'standby_april', 5: 'standby_may', 6: 'standby_june', 7: 'standby_july', 8: 'standby_august', 9: 'standby_september', 10: 'standby_october', 11: 'standby_november', 12: 'standby_december' };
      const getTimeBandKey = (timeStr) => {
        const [hH, mM] = timeStr.split(':').map(Number);
        const mins = hH * 60 + mM;
        const band = STANDBY_TIME_BANDS.find(b => mins >= b.min && mins <= b.max);
        return band ? band.key : 'standby_late_night';
      };
      const getLabel = (score) => {
        if (score <= 30) return { label: tFn('standby_low_risk'), blurb: tFn('standby_blurb_low'), color: 'text-emerald-500', bg: 'bg-emerald-50', border: 'border-emerald-300', barColor: 'bg-emerald-500' };
        if (score <= 65) return { label: tFn('standby_medium_risk'), blurb: tFn('standby_blurb_med'), color: 'text-amber-500', bg: 'bg-amber-50', border: 'border-amber-300', barColor: 'bg-amber-500' };
        return { label: tFn('standby_high_risk'), blurb: tFn('standby_blurb_high'), color: 'text-red-500', bg: 'bg-red-50', border: 'border-red-300', barColor: 'bg-red-500' };
      };

      const timeNorm = (() => {
        const raw = String(time ?? '12:00').trim();
        const m = raw.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return '12:00';
        let hh = parseInt(m[1], 10);
        let mm = parseInt(m[2], 10);
        if (!Number.isFinite(hh) || !Number.isFinite(mm)) return '12:00';
        hh = Math.max(0, Math.min(23, hh));
        mm = Math.max(0, Math.min(59, mm));
        return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
      })();
      const dateNorm = String(date ?? '').trim().replace(/\//g, '-');
      const dt = new Date(`${dateNorm}T${timeNorm}`);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateNorm) || Number.isNaN(dt.getTime())) {
        const info = getLabel(50);
        const fu = (from || '').trim().toUpperCase();
        const tu = (to || '').trim().toUpperCase();
        return { score: 50, ...info, why: [], backups: standbySuggestHubRoutes(from, to, tFn), route: `${fu} → ${tu}`, confidence: 'low', noShowEst: null, confidenceFactors: 0 };
      }
      const dow = dt.getDay();
      const month = dt.getMonth() + 1;
      const dayOfMonth = dt.getDate();
      const n = STANDBY_CONFIG.NEUTRAL;
      const scale = STANDBY_CONFIG.RISK_SCALE;
      const whyList = [];
      let confidenceFactors = 0; // count of specific data points applied

      // --- Core temporal factors ---
      const dp = STANDBY_CONFIG.DOW_POINTS[dow] ?? 0;
      const deltaDow = dp - n.DOW;
      whyList.push({ points: Math.round(deltaDow * scale), textKey: DOW_KEYS[dow] });

      // Month with early/late-month refinement
      const baseMp = STANDBY_CONFIG.MONTH_POINTS[month] ?? 0;
      let monthAdj = 0;
      if (month === 7 && dayOfMonth > 15) monthAdj = 2;
      else if (month === 8 && dayOfMonth <= 15) monthAdj = 2;
      else if (month === 12 && dayOfMonth >= 20) monthAdj = 6;
      else if (month === 12 && dayOfMonth < 20) monthAdj = -4;
      else if (month === 3 && dayOfMonth > 14) monthAdj = 4;
      else if (month === 1 && dayOfMonth <= 5) monthAdj = 4;
      const mp = baseMp + monthAdj;
      const deltaMonth = mp - n.MONTH;
      whyList.push({ points: Math.round(deltaMonth * scale), textKey: MONTH_KEYS[month] });

      const tp = standbyGetTimePoints(timeNorm);
      const deltaTime = tp - n.TIME;
      whyList.push({ points: Math.round(deltaTime * scale), textKey: getTimeBandKey(timeNorm) });

      // Route type with DOW interaction matrix
      const typePts = STANDBY_CONFIG.TYPE_POINTS[type] ?? 0;
      const deltaType = typePts - n.TYPE;
      const typeKey = type === 'business' ? 'standby_business_route' : type === 'leisure' ? 'standby_leisure_route' : 'standby_mixed_route';
      whyList.push({ points: Math.round(deltaType * scale), textKey: typeKey });

      // TYPE × DOW interaction
      const typeDowMatrix = STANDBY_CONFIG.TYPE_DOW_MATRIX || {};
      const typeDowRow = typeDowMatrix[type] || {};
      const typeDowAdj = typeDowRow[dow] || 0;
      if (typeDowAdj !== 0) {
        whyList.push({ points: Math.round(typeDowAdj * scale), text: typeDowAdj > 0 ? `${type === 'business' ? 'Business' : 'Leisure'} peak on ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]}` : `${type === 'business' ? 'Business' : 'Leisure'} lull on ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]}` });
        confidenceFactors++;
      }

      const fp = STANDBY_FREQ_PTS[freq] ?? 0;
      const deltaFreq = fp - n.FREQ;
      const freqKey = freq === '1' ? 'standby_1x_on_route' : freq === '2-3' ? 'standby_2_3x_on_route' : 'standby_4_plus_on_route';
      whyList.push({ points: Math.round(deltaFreq * scale), textKey: freqKey });

      let deltaGauge = 0;
      if (gauge) {
        const gp = STANDBY_CONFIG.GAUGE_POINTS[gauge] ?? 0;
        deltaGauge = gp - n.GAUGE;
        const gaugeKey = gauge === 'small' ? 'standby_small_aircraft' : gauge === 'medium' ? 'standby_med_aircraft' : 'standby_large_aircraft';
        whyList.push({ points: Math.round(deltaGauge * scale), textKey: gaugeKey });
        confidenceFactors++;
      }

      let rawDelta = deltaDow + deltaMonth + deltaTime + deltaType + typeDowAdj + deltaFreq + deltaGauge;

      // --- Pass priority (ZED vs jumpseat only) ---
      if (priority) {
        const priorityPts = (STANDBY_CONFIG.PRIORITY_POINTS || {})[priority] ?? 0;
        if (priorityPts !== 0) {
          rawDelta += priorityPts;
          const priorityLabel = priority === 'jump'
            ? 'Jumpseat listing — typically below ZED staff priority on partners'
            : 'ZED / partner staff travel';
          whyList.push({ points: Math.round(priorityPts * scale), text: priorityLabel });
          confidenceFactors += 2;
        }
      }

      // --- Standby list position ---
      if (listPos && listPos !== '1-3') {
        const listPts = (STANDBY_CONFIG.LIST_POS_POINTS || {})[listPos] ?? 0;
        if (listPts !== 0) {
          rawDelta += listPts;
          const listLabel = { '0': 'First on the standby list', '4-7': '4–7 passengers ahead on list', '8plus': '8+ passengers ahead on list' }[listPos] || listPos;
          whyList.push({ points: Math.round(listPts * scale), text: listLabel });
          confidenceFactors += 2;
        }
      }

      // --- Seat availability (numeric counts override pill hint) ---
      const seatNum = standbySeatCountAdjustment(seatTotal, seatFree);
      if (seatNum) {
        if (seatNum.pts !== 0) {
          rawDelta += seatNum.pts;
          whyList.push({ points: Math.round(seatNum.pts * scale), text: seatNum.label });
        }
        confidenceFactors += 3;
      } else if (seatHint && seatHint !== 'unknown') {
        const seatPts = (STANDBY_CONFIG.SEAT_HINT_POINTS || {})[seatHint] ?? 0;
        if (seatPts !== 0) {
          rawDelta += seatPts;
          const seatLabel = seatHint === 'full' ? 'Flight appears mostly full' : 'Seats currently showing available';
          whyList.push({ points: Math.round(seatPts * scale), text: seatLabel });
          confidenceFactors += 3;
        }
      }

      // --- Check timing (same-day no-show offset) ---
      if (checkTiming) {
        const timingPts = (STANDBY_CONFIG.CHECK_TIMING_POINTS || {})[checkTiming] ?? 0;
        if (timingPts !== 0) {
          rawDelta += timingPts;
          const timingLabel = {
            'same-day': 'Same-day check — no-show buffer applies (~8–12%)',
            'this-week': 'Checking this week — low certainty',
            '2plus-weeks': 'Checking 2+ weeks out — low predictability',
          }[checkTiming];
          if (timingLabel) whyList.push({ points: Math.round(timingPts * scale), text: timingLabel });
          if (checkTiming === 'same-day') confidenceFactors++;
        }
      }

      // --- Special event at destination ---
      if (specialEvent) {
        rawDelta += 16;
        whyList.push({ points: Math.round(16 * scale), text: 'Major event at destination (extra demand spike)' });
        confidenceFactors += 2;
      }

      // --- Connection compound risk ---
      if (connection && connection !== 'direct') {
        const connPts = connection === '1-stop' ? 10 : 22;
        rawDelta += connPts;
        whyList.push({ points: Math.round(connPts * scale), text: connection === '1-stop' ? 'Connecting itinerary — compound risk on 2 legs' : '2-connection itinerary — very high compound risk' });
        confidenceFactors++;
      }

      // --- Route/region specific factors ---
      const fromCode = (from || '').trim().toUpperCase();
      const toCode = (to || '').trim().toUpperCase();
      let fromRegion = null;
      let toRegion = null;
      if (fromCode && toCode && AIRPORTS_DB[fromCode] && AIRPORTS_DB[toCode]) {
        const countryToRegion = STANDBY_CONFIG.COUNTRY_TO_REGION || {};
        fromRegion = countryToRegion[AIRPORTS_DB[fromCode].country] || 'Other';
        toRegion = countryToRegion[AIRPORTS_DB[toCode].country] || 'Other';
        confidenceFactors++;
      }

      whyList.splice(1, 1, { points: Math.round((mp - n.MONTH) * scale), textKey: MONTH_KEYS[month] });

      if (fromCode && toCode && AIRPORTS_DB[fromCode] && AIRPORTS_DB[toCode]) {
        const routePairs = STANDBY_CONFIG.ROUTE_REGION_PAIRS || [];
        const pairKey = (a, b) => [a, b].sort().join(',');
        const routeMatch = routePairs.find(r => pairKey(r.regions[0], r.regions[1]) === pairKey(fromRegion, toRegion));
        if (routeMatch && routeMatch.points) {
          rawDelta += routeMatch.points;
          whyList.push({ points: Math.round(routeMatch.points * scale), text: routeMatch.label });
          confidenceFactors++;
        }
        const holidays = STANDBY_CONFIG.REGIONAL_HOLIDAYS || [];
        holidays.forEach(h => {
          if (month !== h.month || dayOfMonth < h.dayStart || dayOfMonth > h.dayEnd) return;
          const touchesRegion = h.regions.includes(fromRegion) || h.regions.includes(toRegion);
          if (!touchesRegion) return;
          if (h.points) {
            rawDelta += h.points;
            whyList.push({ points: Math.round(h.points * scale), text: h.label });
            confidenceFactors++;
          }
        });

        const peakConfig = STANDBY_CONFIG.REGION_PEAK_MONTHS || {};
        const fromPeak = peakConfig[fromRegion];
        const toPeak = peakConfig[toRegion];
        if (fromPeak && fromPeak.months.includes(month) && fromPeak.points) {
          rawDelta += fromPeak.points;
          whyList.push({ points: Math.round(fromPeak.points * scale), text: fromPeak.labelOrigin });
          confidenceFactors++;
        }
        if (toPeak && toPeak.months.includes(month) && toPeak.points) {
          rawDelta += toPeak.points;
          whyList.push({ points: Math.round(toPeak.points * scale), text: toPeak.labelDest });
          confidenceFactors++;
        }

        const hubBump = STANDBY_CONFIG.MEGAHUB_BUMP || {};
        [fromCode, toCode].forEach(code => {
          const b = hubBump[code];
          if (b) {
            rawDelta += b;
            whyList.push({ points: Math.round(b * scale), text: tFn('standby_megahub_airport').replace('{code}', code) });
            confidenceFactors++;
          }
        });

        // Long weekend adjacent-day bump
        const lwAdj = STANDBY_CONFIG.LONG_WEEKEND_ADJACENT || [];
        lwAdj.forEach(lw => {
          if (lw.month === month && lw.day === dayOfMonth) {
            rawDelta += lw.points;
            whyList.push({ points: Math.round(lw.points * scale), text: lw.label });
            confidenceFactors++;
          }
        });

        // Sun destination Saturday rule
        const isSaturday = dow === 6;
        const sunDestSatOrigins = STANDBY_CONFIG.SUN_DEST_SAT_ORIGINS || [];
        const sunDestSatRegions = STANDBY_CONFIG.SUN_DEST_SAT_REGIONS || [];
        if (isSaturday && sunDestSatOrigins.includes(fromRegion) && sunDestSatRegions.includes(toRegion)) {
          const sdPts = STANDBY_CONFIG.SUN_DEST_SAT_POINTS || 14;
          rawDelta += sdPts;
          whyList.push({ points: Math.round(sdPts * scale), text: 'Saturday sun-destination departure (charter pattern — nearly always full)' });
          confidenceFactors++;
        }

        // Leisure airport destination bump
        const leisureAirports = STANDBY_CONFIG.LEISURE_AIRPORTS || [];
        if (leisureAirports.includes(toCode) && type === 'leisure') {
          rawDelta += 6;
          whyList.push({ points: Math.round(6 * scale), text: `Leisure destination airport (${toCode}) + leisure traffic = extra demand` });
          confidenceFactors++;
        }

        // YYZ↔YVR and YYZ↔YUL named-route bonus
        const namedRouteKey = [fromCode, toCode].sort().join('-');
        const namedRouteBonus = { 'YUL-YYZ': 3, 'YVR-YYZ': 4, 'YUL-YVR': 3 }[namedRouteKey] || 0;
        if (namedRouteBonus) {
          rawDelta += namedRouteBonus;
          whyList.push({ points: Math.round(namedRouteBonus * scale), text: `High-frequency domestic corridor (${fromCode}–${toCode})` });
          confidenceFactors++;
        }
      }

      const isWeekend = dow === 0 || dow === 5 || dow === 6;
      const weekendLeisureBump = isWeekend && type === 'leisure' ? 10 : 0;
      if (weekendLeisureBump) whyList.push({ points: Math.round(weekendLeisureBump * scale), textKey: 'standby_weekend_leisure' });
      rawDelta += weekendLeisureBump;

      const finalScore = Math.max(0, Math.min(100, Math.round(50 + rawDelta * scale)));
      const info = getLabel(finalScore);
      const backups = standbySuggestHubRoutes(from, to, tFn);

      // Confidence level
      const confidence = confidenceFactors >= 6 ? 'high' : confidenceFactors >= 3 ? 'medium' : 'low';

      // No-show seat estimate (only when gauge selected)
      let noShowEst = null;
      if (gauge) {
        const seats = (STANDBY_CONFIG.GAUGE_SEAT_COUNTS || {})[gauge] || 140;
        const loadPct = Math.min(0.99, finalScore / 100 * 0.9 + 0.30);
        const occupied = Math.round(seats * loadPct);
        const noShowRate = checkTiming === 'same-day' ? 0.10 : 0.07;
        const noShows = Math.max(0, Math.round(occupied * noShowRate));
        noShowEst = { seats, noShows, loadPct: Math.round(loadPct * 100) };
      }

      return { score: finalScore, ...info, why: whyList, backups, route: `${String(from).toUpperCase()} → ${String(to).toUpperCase()}`, confidence, noShowEst, confidenceFactors };
    }
    function readStandbyUrlPrefill() {

    }

    // ── Linkify helper — converts URLs in text to clickable links ──
    function linkify(text) {
      if (!text) return null;
      const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(?:\/[^\s]*)?)/g;
      const parts = text.split(urlRegex);
      return parts.map((part, i) => {
        if (urlRegex.test(part)) {
          urlRegex.lastIndex = 0;
          const href = part.startsWith('http') ? part : `https://${part}`;
          return <a key={i} href={href} target="_blank" rel="noopener noreferrer" className="text-[#152C53] font-black underline underline-offset-2 hover:text-blue-600 transition-colors">{part}</a>;
        }
        return part;
      });
    }
    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function highlightText(text, query) {
      if (!text) return '';
      const q = (query || '').trim();
      if (!q) return text;
      const regex = new RegExp(`(${escapeRegExp(q)})`, 'ig');
      return text.split(regex).map((part, i) => (
        part.toLowerCase() === q.toLowerCase()
          ? <mark key={i} className="bg-[#FFC136]/35 text-inherit rounded px-0.5">{part}</mark>
          : <React.Fragment key={i}>{part}</React.Fragment>
      ));
    }
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text || '');
        return true;
      } catch {
        return false;
      }
    }

        const base = computeStandbyResult(baseParams).score;

        }
        if (!best) return null;
        // Only surface if meaningfully better than current
        const currentScore = computeStandbyResult({ ...baseParams, date, time }).score;
        if (best.score >= currentScore - 5) return null;
        const bdt = new Date(`${best.date}T${best.time}`);
        const dayLabel = best.dayDelta === 0 ? 'Today' : best.dayDelta === -1 ? 'Yesterday' : best.dayDelta === 1 ? 'Tomorrow' : bdt.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
        return { ...best, dayLabel };
      }, [from, to, date, time, type, freq, gauge, priority, listPos, checkTiming, seatHint, seatTotal, seatFree, connection, specialEvent, t]);

      const handleReset = () => {
        setFrom(''); setTo('');
        setDate(new Date().toISOString().split('T')[0]);
        setTime(nowRounded());
        setType('mixed'); setFreq('4+'); setGauge('');
        setCompareOn(false);
        setDateB(new Date().toISOString().split('T')[0]);
        setTimeB(nowRounded());
        setTypeB('mixed');
        setPriority('zed'); setListPos('1-3');
        setSeatHint('unknown'); setSeatTotal(''); setSeatFree(''); setConnection('direct'); setSpecialEvent(false);
      };

      const toggleCompare = () => {
        if (!compareOn) {
          setDateB(date);
          setTimeB(time);
          setTypeB(type);
        }
        setCompareOn(!compareOn);
      };

      const standbyRecentRoutes = useLocalMemo(() => {
        const raw = getJSON('zed_recent_routes', []);
        if (!Array.isArray(raw)) return [];
        return raw.filter(r => isPlainObject(r) && /^[A-Z]{3}$/.test(toText(r.origin, '').toUpperCase()) && /^[A-Z]{3}$/.test(toText(r.destination, '').toUpperCase()))
          .map(r => ({ from: toText(r.origin, '').toUpperCase(), to: toText(r.destination, '').toUpperCase() })).slice(0, 5);
      }, []);
      const [savedStandbyRoutes, setSavedStandbyRoutes] = useLocalState(() => {
        const raw = getJSON('standby_saved_routes', []);
        return Array.isArray(raw) ? raw.filter(r => isPlainObject(r) && /^[A-Z]{3}$/.test(toText(r.from, '')) && /^[A-Z]{3}$/.test(toText(r.to, ''))).slice(0, 5) : [];
      });
      const saveCurrentRoute = () => {
        const f = (from || '').trim().toUpperCase();
        const dest = (to || '').trim().toUpperCase();
        if (!/^[A-Z]{3}$/.test(f) || !/^[A-Z]{3}$/.test(dest)) return;
        const next = [{ from: f, to: dest }, ...savedStandbyRoutes.filter(r => !(r.from === f && r.to === dest))].slice(0, 5);
        setSavedStandbyRoutes(next);
        setJSON('standby_saved_routes', next);
      };

      const oCode = (from || '').trim().toUpperCase();
      const dCode = (to || '').trim().toUpperCase();
      const validStandby = /^[A-Z]{3}$/.test(oCode) && /^[A-Z]{3}$/.test(dCode);
      const dayCurveMax = useLocalMemo(() => (dayCurve.length ? Math.max(1, ...dayCurve.map(x => x.score)) : 100), [dayCurve]);

      return (
        <div className={toolShellClass(darkMode)}>
          {/* Header */}
          <div className={TOOL_HEADER_CLASS}>
            <div className="flex items-center justify-between gap-4 flex-wrap">
              <div className="flex items-center gap-4">
                <div className={toolIconWrapClass(darkMode)}>
                  <Icons.Gauge className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h2 className={TOOL_H2_CLASS}>{t('page_standby')}</h2>
                  <p className={TOOL_SUBTITLE_CLASS}>{t('standby_live_risk')}</p>
                  <p className={TOOL_DESC_CLASS}>{t('standby_description')}</p>
                  <ToolTrustChips darkMode={darkMode} t={t} estimate />
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2">

                      <Icons.Copy className="w-3 h-3" /> {t('standby_copy_summary')}
                    </button>
                    <button type="button" onClick={toggleCompare} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest border transition-all flex items-center gap-1.5 ${compareOn ? 'bg-[#FFC136] text-[#152C53] border-[#FFC136]' : 'bg-white/10 hover:bg-white/20 text-white border-white/20'} ${sbHdrFocus}`}>

                        <Icons.Scale className="w-3 h-3" /> {t('standby_open_fare_compare')}
                      </button>
                    )}

                )}
                <button type="button" onClick={handleReset} className={`px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[9px] font-black uppercase tracking-widest text-white transition-all flex items-center gap-1.5 ${sbHdrFocus}`}>

              </div>
            </div>
          </div>

            {/* Inputs */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

              {/* Airports */}
              <div className="space-y-2">
                <label className="porter-label ml-1">{t('standby_route')}</label>
                <div className="grid grid-cols-2 gap-2 min-h-[72px]">
                  <div className="min-h-[72px]"><AirportInput label={t('standby_route_departure')} value={from} onChange={v => setFrom(v)} placeholder="YYZ" inputClassName={darkMode ? 'bg-slate-800 border-slate-600 text-slate-100 placeholder:text-slate-500 focus:border-slate-400' : ''} /></div>

                  {[['','standby_any'],['small','standby_small'],['medium','standby_med'],['large','standby_large']].map(([val, key]) => (
                    <button key={val} onClick={() => setGauge(val)}
                      className={`flex-1 py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest transition-all border ${gauge === val ? 'bg-[#152C53] text-white border-[#152C53] shadow-lg' : darkMode ? 'bg-slate-700 text-slate-400 border-slate-600 hover:border-slate-400 hover:text-white' : 'bg-slate-50 text-slate-500 border-slate-200 hover:border-slate-400'}`}>
                      {t(key)}
                    </button>
                  ))}
                </div>
              </div>

            </div>

            {/* Personal Factors — separated section so they're always visible */}
            <div className={`p-5 sm:p-6 rounded-2xl border space-y-4 ${darkMode ? 'bg-slate-800/60 border-[#FFC136]/30' : 'bg-[#152C53]/[0.04] border-[#FFC136]/40'}`}>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-[#FFC136] text-base">★</span>
                <p className={`text-[10px] font-black uppercase tracking-widest ${darkMode ? 'text-[#FFC136]' : 'text-[#152C53]'}`}>Personal Factors — sharpen your estimate</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

                {/* Pass Priority */}
                <div className="space-y-2">
                  <label className="porter-label ml-1">{t('standby_pass_priority')}</label>
                  <div className="flex flex-wrap gap-2">
                    {[['zed','standby_priority_zed'],['jump','standby_priority_jump']].map(([val, key]) => (
                      <button key={val} type="button" onClick={() => setPriority(val)}
                        className={`flex-1 min-w-[44%] py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest transition-all border ${priority === val ? 'bg-[#152C53] text-white border-[#152C53] shadow-lg' : darkMode ? 'bg-slate-700 text-slate-400 border-slate-600 hover:border-slate-400 hover:text-white' : 'bg-slate-50 text-slate-500 border-slate-200 hover:border-slate-400'}`}>
                        {t(key)}
                      </button>
                    ))}
                  </div>
                </div>

                {/* List Position */}
                <div className="space-y-2">
                  <label className="porter-label ml-1">{t('standby_list_position')}</label>
                  <div className="flex flex-wrap gap-2">
                    {[['0','standby_list_first'],['1-3','standby_list_1_3'],['4-7','standby_list_4_7'],['8plus','standby_list_8plus']].map(([val, key]) => (
                      <button key={val} onClick={() => setListPos(val)}
                        className={`flex-1 py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest transition-all border ${listPos === val ? 'bg-[#152C53] text-white border-[#152C53] shadow-lg' : darkMode ? 'bg-slate-700 text-slate-400 border-slate-600 hover:border-slate-400 hover:text-white' : 'bg-slate-50 text-slate-500 border-slate-200 hover:border-slate-400'}`}>
                        {t(key)}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Check Timing (auto from departure date — display only) */}
                <div className="space-y-2">
                  <div className="flex flex-wrap items-center gap-2 ml-1">
                    <label className="porter-label shrink-0" id="standby-timing-label">{t('standby_check_timing')}</label>
                    <span className={`inline-flex items-center px-2 py-0.5 rounded-md text-[8px] font-black uppercase tracking-widest border ${darkMode ? 'bg-[#FFC136]/15 text-[#FFC136] border-[#FFC136]/45' : 'bg-amber-50 text-amber-900 border-amber-200'}`}>{t('standby_timing_auto')}</span>
                  </div>
                  <span className="sr-only" aria-live="polite" aria-atomic="true">{t('standby_timing_auto_sr_prefix')} {t(checkTimingI18nKey)}</span>
                  <div className="flex flex-wrap gap-2 select-none pointer-events-none" role="group" aria-labelledby="standby-timing-label">
                    {[['same-day','standby_timing_same_day'],['1-2-days','standby_timing_1_2_days'],['this-week','standby_timing_this_week'],['2plus-weeks','standby_timing_2plus_weeks']].map(([val, key]) => {
                      const on = checkTiming === val;
                      return (
                        <div key={val} className={`flex-1 min-w-[5.5rem] py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest text-center transition-all duration-300 border ${on ? 'bg-[#152C53] text-white border-[#152C53] shadow-lg ring-2 ring-[#FFC136]/55 scale-[1.02]' : darkMode ? 'bg-slate-800/60 text-slate-500 border-slate-700 opacity-50' : 'bg-slate-100/90 text-slate-400 border-slate-200 opacity-55'}`}>
                          {t(key)}

                  <p className={`porter-meta-hint ml-1 text-[9px] leading-snug ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>{t('standby_timing_auto_hint')}</p>

                {/* Seat Availability */}
                <div className="space-y-2 md:col-span-2 lg:col-span-3">
                  <label className="porter-label ml-1">{t('standby_seat_hint')}</label>
                  <div className="flex flex-wrap gap-2">
                    {[['unknown','standby_seat_unknown'],['some','standby_seat_some'],['full','standby_seat_full']].map(([val, key]) => (
                      <button key={val} type="button" onClick={() => setSeatHint(val)}
                        className={`flex-1 py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest transition-all border ${seatHint === val ? 'bg-[#152C53] text-white border-[#152C53] shadow-lg' : darkMode ? 'bg-slate-700 text-slate-400 border-slate-600 hover:border-slate-400 hover:text-white' : 'bg-slate-50 text-slate-500 border-slate-200 hover:border-slate-400'}`}>
                        {t(key)}

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2 items-end">

                      <label className="porter-label ml-1 text-[9px]">{t('standby_seat_open')}</label>
                      <input type="text" inputMode="numeric" autoComplete="off" value={seatFree} onChange={e => setSeatFree(e.target.value.replace(/[^\d]/g, ''))} placeholder="—" className={`w-full px-3 py-2.5 rounded-xl text-sm font-bold border outline-none ${darkMode ? 'bg-slate-900 border-slate-600 text-slate-100' : 'bg-white border-slate-200 text-[#152C53]'}`} />

            : (darkMode ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-600');

      const estimatedTaxes = useLocalMemo(() => {
        const segments = isRoundTrip ? 2 : 1;
        const taxCad = estimateTaxCadForRoute(isManual ? null : originAirport, isManual ? null : destinationAirport, segments);
        if (currency === 'CAD') return { low: taxCad.taxLow, high: taxCad.taxHigh };
        return { low: Math.round(taxCad.taxLow / getCadRate()), high: Math.round(taxCad.taxHigh / getCadRate()) };
      }, [isRoundTrip, currency, isManual, originAirport, destinationAirport]);

      const tierBaseAmounts = useLocalMemo(() => {
        const mult = isRoundTrip ? 2 : 1;
        const convert = (usd) => currency === 'CAD' ? Math.round(usd * getCadRate() * mult) : roundUsdCents(usd * mult);
        return {
          LOW: convert(currentRates.LOW || 0),
          MED: convert(currentRates.MED || 0),
          HIGH: convert(currentRates.HIGH || 0),
        };
      }, [currentRates, isRoundTrip, currency]);

      const customBaseAmount = useLocalMemo(() => {
        if (!customFare || customFare.unavailable) return 0;
        return getCustomFareValue(customFare.fare, customFare.currency);
      }, [customFare, currency, isRoundTrip]);

      const selectedFareResult = useLocalMemo(() => getFareResultForAirline({
        airline: selectedAirline,
        miles: effectiveMiles,
        travelerType,
        currency,
        isRoundTrip,
        originAirport: isManual ? null : originAirport,
        destinationAirport: isManual ? null : destinationAirport,
      }), [selectedAirline, effectiveMiles, travelerType, currency, isRoundTrip, isManual, originAirport, destinationAirport]);

      const filteredAirlines = useLocalMemo(() =>
        (airlines || []).filter(a => a.name.toLowerCase().includes(search.toLowerCase())),
      [search, airlines]);
      const insightWarnings = useLocalMemo(() => {
        const items = [];
        if (selectedAirline && hasResult) {
          const emb = toText(selectedAirline.embargoes, '').trim();
          if (emb && !/^none/i.test(emb)) items.push('Embargo notes exist for this airline. Review restrictions before listing.');
          if (!hasCustom) items.push('Using generic fare estimate; carrier checkout may differ.');
          if (selectedFareResult && !selectedFareResult.available && !selectedFareResult.notActive) items.push(selectedFareResult.reason || 'Fare not available for this route.');
          if (activeType === 'SPECIAL') items.push('SPECIAL tier is approximated as the average of LOW and MED — verify with the carrier.');
        }
        if (effectiveMiles > 0 && calculatedMiles > 0 && effectiveMiles !== calculatedMiles) {
          items.push(t('calc_insight_zone_distance_cap').replace('{capped}', effectiveMiles.toLocaleString()).replace('{gc}', calculatedMiles.toLocaleString()));
        }
        if (!isManual && originCode && !originAirport) items.push(`Departure code "${originCode}" not found.`);
        if (!isManual && destinationCode && !destinationAirport) items.push(`Arrival code "${destinationCode}" not found.`);
        return items.slice(0, 6);
      }, [selectedAirline, hasResult, hasCustom, selectedFareResult, isManual, originCode, destinationCode, originAirport, destinationAirport, activeType, effectiveMiles, calculatedMiles, t]);
      const transparencyRows = useLocalMemo(() => {
        if (!selectedAirline) return [];
        const distLabel = effectiveMiles > 0
          ? (calculatedMiles > 0 && effectiveMiles !== calculatedMiles
            ? `${effectiveMiles.toLocaleString()} mi priced (GC ${calculatedMiles.toLocaleString()} mi) / Zone ${zone}`
            : `${effectiveMiles.toLocaleString()} mi / Zone ${zone}`)
          : 'N/A';
        return [
          [t('calc_why_row_airline'), selectedAirline.name],
          [t('calc_why_row_traveler'), calcTravelerLabel()],
          [t('calc_why_row_tier'), activeType || 'N/A'],
          [t('calc_why_row_route'), isManual ? `${t('calc_manual_miles')}: ${Math.round(manualMilesNumber || 0).toLocaleString()} mi` : `${originCode || '---'} → ${destinationCode || '---'}`],
          [t('calc_why_row_distance'), distLabel],
          [t('calc_why_row_source'), hasCustom ? `${selectedAirline.name} (${t('calc_compare_verified')})` : t('calc_source_generic_line')],
          [t('calc_why_row_round'), isRoundTrip ? t('calc_round_trip') : t('calc_one_way')],
          [t('calc_why_row_currency'), currency],
          [t('calc_why_row_booking'), selectedAirline.bookingPeriod || 'N/A']
        ];
      }, [selectedAirline, travelerType, activeType, isManual, manualMilesNumber, originCode, destinationCode, effectiveMiles, calculatedMiles, zone, hasCustom, isRoundTrip, currency, t]);

      const handleSwap = () => {
        const activeTestId = document.activeElement ? document.activeElement.getAttribute('data-testid') : null;
        const tmp = origin;
        setOrigin(destination);
        setDestination(tmp);
        setIsDropdownOpen(false);
        setTimeout(() => {
          if (isManual) return;
          if (activeTestId === 'zed-origin-input') {
            const el = document.querySelector('[data-testid="zed-destination-input"]');
            if (el && typeof el.focus === 'function') el.focus();
          } else if (activeTestId === 'zed-destination-input') {
            const el = document.querySelector('[data-testid="zed-origin-input"]');
            if (el && typeof el.focus === 'function') el.focus();
          }
        }, 0);
      };

      const handleReset = () => {
        setOrigin(''); setDestination(''); setManualMiles('');
        setSearch(''); setSelectedAirline(null); setTravelerType('EMPLOYEE');
        setIsRoundTrip(false); setCurrency('CAD'); setIsManual(false);
        setShowAdvanced(false);
      };
      const handleUseRecentRoute = (route) => {
        if (!route) return;
        setIsManual(false);
        setOrigin(route.origin);
        setDestination(route.destination);
      };
      const handleCopySummary = async () => {
        if (!selectedAirline || !hasResult || isNotActive) return;
        const customMode = !!(customFare && customFare.isCustom && !customFare.unavailable);
        const summaryLines = [
          `Airline: ${selectedAirline.name}`,
          `Traveler: ${calcTravelerLabel()}`,
          `Route: ${isManual ? `Manual ${Math.round(manualMilesNumber).toLocaleString()} mi` : `${originCode} -> ${destinationCode}`}`,
          calculatedMiles > 0 && effectiveMiles !== calculatedMiles
            ? `Distance: ${effectiveMiles.toLocaleString()} mi (great circle ${calculatedMiles.toLocaleString()} mi)`
            : `Distance: ${effectiveMiles.toLocaleString()} mi`,
          `Zone: ${zone} (${DEFAULT_ZONE_RANGES[zone] || 'N/A'})`,
          `Currency: ${currency} (indicative CAD/USD rate dated ${getCadEffectiveDate()})`,
          `Trip: ${isRoundTrip ? 'Round Trip' : 'One Way'}`,
          selectedFareResult?.taxBucketKey ? `Tax estimate bucket: ${selectedFareResult.taxBucketKey}` : null,
          customMode
            ? `Base Fare (${selectedAirline.name} verified): ${currency === 'CAD' ? `$${customBaseAmount.toLocaleString()}` : `$${roundUsdCents(customBaseAmount).toFixed(2)}`}`
            : `Base Fare (${activeType || 'LOW'} estimate): ${formatPrice(currentRates[activeType === 'MEDIUM' ? 'MED' : (activeType || 'LOW')] || currentRates.LOW || 0)}`,
          `Est. Taxes: $${estimatedTaxes.low.toLocaleString()}–$${estimatedTaxes.high.toLocaleString()}`,
          'Disclaimer: Estimate only — confirm taxes and fare on myIDTravel or the carrier before travel.',
        ].filter(Boolean);
        const ok = await copyText(summaryLines.join('\n'));
        if (!ok) return;
        setCopiedSummary(true);
        setTimeout(() => setCopiedSummary(false), 1400);
      };
      useLocalEffect(() => {
        if (isManual || !hasResult) return;
        if (!originCode || !destinationCode || isSameAirport) return;
        const route = { origin: originCode, destination: destinationCode };
        setRecentRoutes(prev => {
          const merged = [route, ...prev.filter(r => !(r.origin === route.origin && r.destination === route.destination))].slice(0, 5);
          setJSON('zed_recent_routes', merged);
          return merged;
        });
      }, [isManual, hasResult, originCode, destinationCode, isSameAirport]);

      const tierConfig = [
        { key: 'LOW',  label: 'Low Agreement',    active: activeType === 'LOW',  colors: { on: darkMode ? 'bg-emerald-950/40 border-emerald-700' : 'bg-emerald-50 border-emerald-400', badge: 'bg-emerald-500', text: 'text-emerald-600', price: darkMode ? 'text-emerald-400' : 'text-emerald-700' }, off: darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200' },
        { key: 'MED',  label: 'Med Agreement',    active: activeType === 'MED' || activeType === 'MEDIUM', colors: { on: darkMode ? 'bg-amber-950/40 border-amber-700' : 'bg-amber-50 border-amber-400', badge: 'bg-amber-500', text: 'text-amber-600', price: darkMode ? 'text-amber-400' : 'text-amber-700' }, off: darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200' },
        { key: 'HIGH', label: 'High Agreement',   active: activeType === 'HIGH', colors: { on: darkMode ? 'bg-red-950/40 border-red-700' : 'bg-red-50 border-red-400',     badge: 'bg-red-500',     text: 'text-red-600',     price: darkMode ? 'text-red-400' : 'text-red-700'     }, off: darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200' },
      ];
      const zedHdrFocus = 'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FFC136] focus-visible:ring-offset-2 focus-visible:ring-offset-[#152C53]';
      const zedBodyFocus = `focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FFC136] focus-visible:ring-offset-2 ${darkMode ? 'focus-visible:ring-offset-[#0f172a]' : 'focus-visible:ring-offset-white'}`;

      return (

                <div className={toolIconWrapClass(darkMode)}>
                  <Icons.Ticket className="w-6 h-6 text-white" />
                </div>
                <div className="space-y-0.5">
                  <h2 className={TOOL_H2_CLASS}>{t('calc_title')}</h2>
                  <p className={TOOL_SUBTITLE_CLASS}>{t('calc_base_fare')}</p>
                  <p className={TOOL_DESC_CLASS}>{t('calc_subtitle')}</p>
                  <ToolTrustChips darkMode={darkMode} t={t} estimate />
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button type="button" onClick={handleCopySummary} disabled={!selectedAirline || !hasResult || isNotActive}
                  className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all flex items-center gap-1.5 ${zedHdrFocus} ${(!selectedAirline || !hasResult || isNotActive) ? 'bg-white/5 text-white/20 cursor-not-allowed' : 'bg-white/10 hover:bg-white/20 text-white border border-white/20'}`}>
                  <Icons.Copy className="w-3 h-3" /> {copiedSummary ? t('common_copied') : t('common_copy')}
                </button>
                <button type="button" onClick={handleReset} className={`px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[9px] font-black uppercase tracking-widest text-white transition-all flex items-center gap-1.5 ${zedHdrFocus}`}>
                  <Icons.X className="w-3 h-3" /> {t('common_reset')}
                </button>
              </div>
            </div>
            {/* Inline options bar */}
            <div className={`flex flex-wrap items-center gap-2 mt-6 pt-6 border-t border-white/10`}>
              <button type="button" onClick={() => setIsRoundTrip(!isRoundTrip)}
                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all ${zedHdrFocus} ${isRoundTrip ? 'bg-[#FFC136] text-[#152C53]' : 'bg-white/10 text-white/70 hover:bg-white/20 hover:text-white'}`}>
                {isRoundTrip ? `⇄ ${t('calc_round_trip')}` : `→ ${t('calc_one_way')}`}
              </button>
              <div className="flex rounded-xl overflow-hidden border border-white/15">
                {['CAD', 'USD'].map(c => (
                  <button type="button" key={c} onClick={() => setCurrency(c)}
                    className={`px-4 py-2 text-[9px] font-black uppercase tracking-widest transition-all ${zedHdrFocus} ${currency === c ? 'bg-white text-[#152C53]' : 'bg-white/5 text-white/50 hover:bg-white/10 hover:text-white'}`}>
                    {c}
                  </button>
                ))}
              </div>
              {currency === 'USD' && <span className="text-[8px] text-white/30 font-bold uppercase tracking-widest ml-1">1 CAD ≈ {(1/getCadRate()).toFixed(2)} USD</span>}
              <span className="text-[8px] text-white/35 font-bold uppercase tracking-widest ml-1 max-w-md leading-snug">
                {t('calc_fx_indicative').replace('{rate}', (Math.round(getCadRate() * 100) / 100).toFixed(2)).replace('{date}', getCadEffectiveDate())}
              </span>
            </div>
            <p className="text-[8px] text-white/25 font-bold uppercase tracking-widest mt-2 px-1">{t('calc_base_table_as_of').replace('{date}', ZED_BASE_TABLE_AS_OF)}</p>
            <div className="mt-5">
              <span id="zed-calc-traveler-label" className="text-[9px] font-black uppercase tracking-widest text-white/30 block mb-2">{t('mytrips_whos_traveling')}</span>
              <div className="relative -mx-1">
                <div className="zed-calc-travelers-scroll flex gap-2 overflow-x-auto pb-1 snap-x snap-mandatory sm:flex-wrap sm:overflow-visible" role="radiogroup" aria-labelledby="zed-calc-traveler-label">
                  {CALC_TRAVELER_OPTIONS.map(tr => (
                    <button key={tr.id} type="button" role="radio" aria-checked={travelerType === tr.id} onClick={() => setTravelerType(tr.id)}
                      className={`snap-start shrink-0 min-w-[8.25rem] sm:min-w-0 px-3.5 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all border ${zedHdrFocus} ${travelerType === tr.id ? 'bg-white/20 text-white border-white/20' : 'bg-white/5 text-white/30 hover:bg-white/10 hover:text-white/60 border border-white/5'}`}>
                      <span className="text-sm" aria-hidden="true">{tr.icon}</span> {t(tr.labelKey)}
                      {travelerType === tr.id ? <span className="text-[8px] ml-0.5" aria-hidden="true">✓</span> : null}
                    </button>
                  ))}
                </div>
              </div>
              <p className="text-[8px] font-medium text-white/25 mt-2 max-w-xl leading-relaxed">{t('calc_traveler_parent_hint')}</p>
            </div>
          </div>

          {/* Two-panel body */}
          <div className="p-4 sm:p-8 lg:p-10">
            <div className="grid grid-cols-1 lg:grid-cols-[1fr_1.3fr] gap-6 lg:gap-10 items-start">

            {/* ─── LEFT: Configuration ─── */}
            <div className="space-y-5">

              {/* Airline selector */}
              <div className="relative" ref={dropdownRef}>
                <label className={`block text-[9px] font-black uppercase tracking-widest mb-2 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('calc_select_airline')}</label>
                <div className="relative">
                  <Icons.Search className={`absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none ${darkMode ? 'text-slate-500' : 'text-slate-300'}`} />
                  <input type="text" placeholder={t('calc_search_airline')} data-testid="zed-airline-search"
                    className={`w-full pl-11 pr-10 py-3.5 border rounded-2xl text-sm font-bold outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-600 text-slate-100 focus:border-slate-400' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`}
                    value={search}
                    onChange={e => {
                      const v = e.target.value;
                      setSearch(v);
                      setIsDropdownOpen(true);
                      if (!v.trim()) setSelectedAirline(null);
                    }}
                    onFocus={() => setIsDropdownOpen(true)}
                  />
                  {selectedAirline && <Icons.Check className="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-500 pointer-events-none" />}
                </div>
                {isDropdownOpen && (
                  <div className={`absolute top-full mt-1 left-0 w-full rounded-2xl border shadow-2xl z-[100] max-h-56 overflow-y-auto custom-scroll animate-fade-in ${darkMode ? 'bg-[#1e293b] border-slate-700' : 'bg-white border-slate-200'}`}>
                    {filteredAirlines.length > 0 ? filteredAirlines.map(a => (
                      <button key={a.name} className={`w-full px-5 py-3 text-left flex items-center gap-3 border-b last:border-0 transition-colors ${darkMode ? 'border-slate-700/50 hover:bg-slate-700/50' : 'border-slate-100 hover:bg-slate-50'}`}
                        onClick={() => { setSelectedAirline(a); setSearch(a.name); setIsDropdownOpen(false); }}>
                        <span className="text-base">{a.flag}</span>
                        <div className="min-w-0">
                          <span className={`font-bold text-sm block truncate ${darkMode ? 'text-slate-200' : 'text-slate-700'}`}>{a.name}</span>
                          <span className={`text-[8px] font-black uppercase px-2 py-0.5 rounded-full ${a.zed === 'NOT ACTIVE' ? (darkMode ? 'bg-slate-700 text-slate-400' : 'bg-slate-100 text-slate-400') : (darkMode ? 'bg-emerald-900/40 text-emerald-300' : 'bg-emerald-50 text-emerald-600')}`}>{a.zed}</span>
                        </div>
                      </button>
                    )) : <div className={`p-6 text-center font-bold text-sm ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('calc_no_results')}</div>}
                  </div>
                )}
              </div>

              {/* Route section */}
              <div className={`rounded-2xl border p-4 ${darkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-50/80 border-slate-200'}`}>
                <div className="flex items-center justify-between mb-3">
                  <label className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('common_route')}</label>
                  <div className={`flex rounded-lg overflow-hidden border ${darkMode ? 'border-slate-600' : 'border-slate-200'}`}>
                    <button type="button" onClick={() => setIsManual(false)}
                      className={`text-[8px] font-black uppercase tracking-widest px-3 py-1.5 transition-all ${zedBodyFocus} ${!isManual ? (darkMode ? 'bg-[#152C53] text-white' : 'bg-[#152C53] text-white') : (darkMode ? 'bg-slate-800 text-slate-400 hover:text-slate-200' : 'bg-slate-50 text-slate-500 hover:text-slate-700')}`}>
                      {t('calc_airport_codes')}
                    </button>
                    <button type="button" onClick={() => setIsManual(true)}
                      className={`text-[8px] font-black uppercase tracking-widest px-3 py-1.5 transition-all ${zedBodyFocus} ${isManual ? (darkMode ? 'bg-[#152C53] text-white' : 'bg-[#152C53] text-white') : (darkMode ? 'bg-slate-800 text-slate-400 hover:text-slate-200' : 'bg-slate-50 text-slate-500 hover:text-slate-700')}`}>
                      {t('calc_manual_miles')}
                    </button>
                  </div>
                </div>
                <div className={`mt-3 rounded-xl border p-2.5 ${darkMode ? 'border-slate-600/80 bg-slate-900/40' : 'border-slate-200 bg-white'}`}>
                {isManual ? (
                  <div className="relative animate-fade-in">
                    <Icons.Plane className={`absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 ${darkMode ? 'text-slate-500' : 'text-slate-300'}`} />
                    <input type="number" placeholder={t('calc_enter_miles')} min="1" max="20000" data-testid="zed-manual-miles"
                      className={`w-full pl-11 pr-4 py-3 border rounded-xl text-sm font-bold outline-none transition-all ${zedBodyFocus} ${darkMode ? 'bg-slate-800 border-slate-600 text-slate-100 focus:border-slate-400' : 'bg-slate-50 border-slate-200 text-[#152C53] focus:border-[#152C53]'}`}
                      value={manualMiles}
                      onChange={e => {
                        const raw = String(e.target.value || '').replace(/[^\d]/g, '');
                        if (!raw) { setManualMiles(''); return; }
                        const n = Math.max(1, Math.min(20000, Number(raw)));
                        setManualMiles(String(n));
                      }} />
                  </div>
                ) : (
                  <div className="animate-fade-in">
                    <div className="flex items-start gap-2">
                      <div className="flex-1 min-w-0">
                        <AirportInput label="" value={origin} onChange={v => setOrigin(v)} placeholder="YYZ" inputTestId="zed-origin-input" />
                      </div>
                      <button type="button" onClick={handleSwap} data-testid="zed-swap-route"
                        className={`w-9 h-9 mt-[0.55rem] rounded-full flex items-center justify-center transition-all border shadow-sm shrink-0 ${zedBodyFocus} ${darkMode ? 'bg-slate-700 border-slate-600 text-slate-400 hover:bg-[#152C53] hover:text-white hover:border-[#152C53]' : 'bg-slate-100 border-slate-200 text-slate-400 hover:bg-[#152C53] hover:text-white hover:border-[#152C53]'}`}
                        title={t('calc_swap_airports')} aria-label={t('calc_swap_airports')}>
                        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                          <path d="M7 16l-4-4 4-4" /><path d="M3 12h18" /><path d="M17 8l4 4-4 4" />
                        </svg>
                      </button>
                      <div className="flex-1 min-w-0">
                        <AirportInput label="" value={destination} onChange={v => setDestination(v)} placeholder="LAX" inputTestId="zed-destination-input" />
                      </div>
                    </div>
                  </div>

                </div>
                <div data-testid="zed-status" className={`mt-3 px-3 py-2 rounded-xl border flex items-center justify-between gap-2 text-[9px] ${statusClasses}`}>
                  <span className="font-black uppercase tracking-widest shrink-0">{routeStatus.labelKey ? t(routeStatus.labelKey) : routeStatus.label}</span>

    function FareComparison({ darkMode, airlineData, prefillRoute, onPrefillConsumed }) {
      const { t } = React.useContext(I18nContext);
      const { useState: useLocalState, useMemo: useLocalMemo, useEffect: useLocalEffect } = React;
      const fcHdrFocus = 'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FFC136] focus-visible:ring-offset-2 focus-visible:ring-offset-[#152C53]';
      const fcBodyFocus = `focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FFC136] focus-visible:ring-offset-2 ${darkMode ? 'focus-visible:ring-offset-[#0f172a]' : 'focus-visible:ring-offset-white'}`;

      const getFare = (airline, miles) => {
        if (!airline || !miles) return null;

        // Check for airline-specific fare data first
        const custom = getAirlineFare(airline.name, miles);
        if (custom && custom.isCustom) {
          if (custom.unavailable) return null;
          // Convert custom fare to USD for consistent internal handling
          if (custom.currency === 'CAD') return { amount: Math.round(custom.fare / getCadRate()), isCustom: true, zone: custom.zone, originalFare: custom.fare, originalCurrency: 'CAD' };
          return { amount: custom.fare, isCustom: true, zone: custom.zone, originalFare: custom.fare, originalCurrency: 'USD' };
        }

        // Fall back to generic rates
        const amount = getGenericZedFareUSD(airline.zed, miles);
        if (amount === null) return null;
        return { amount, isCustom: false };
      };

      const [origin, setOrigin] = useLocalState('');
      const [destination, setDestination] = useLocalState('');
      const [isManual, setIsManual] = useLocalState(false);
      const [manualMiles, setManualMiles] = useLocalState('');
      const [airlines, setAirlines] = useLocalState([null, null, null]);
      const [searches, setSearches] = useLocalState(['', '', '']);
      const [shows, setShows] = useLocalState([false, false, false]);
      const [isRoundTrip, setIsRoundTrip] = useLocalState(false);
      const [currency, setCurrency] = useLocalState('CAD');
      useLocalEffect(() => {
        if (!prefillRoute) return;
        if (prefillRoute.origin) setOrigin(String(prefillRoute.origin).toUpperCase().slice(0, 3));
        if (prefillRoute.destination) setDestination(String(prefillRoute.destination).toUpperCase().slice(0, 3));
        if (onPrefillConsumed) onPrefillConsumed();
      }, [prefillRoute]);
      const originCode = (origin || '').trim().toUpperCase();
      const destinationCode = (destination || '').trim().toUpperCase();
      const codePattern = /^[A-Z]{3}$/;
      const originFormatValid = originCode.length === 0 || codePattern.test(originCode);
      const destinationFormatValid = destinationCode.length === 0 || codePattern.test(destinationCode);
      const isSameAirport = originCode.length > 0 && originCode === destinationCode;
      const originAirport = AIRPORTS_DB[originCode];
      const destinationAirport = AIRPORTS_DB[destinationCode];
      const manualMilesNumber = Number(manualMiles);
      const manualMilesValid = manualMiles.trim() !== '' && Number.isFinite(manualMilesNumber) && manualMilesNumber > 0;

      const miles = useLocalMemo(() => {
        if (isManual) return manualMilesValid ? Math.round(manualMilesNumber) : 0;
        if (!originAirport || !destinationAirport || isSameAirport) return 0;
        if (!originFormatValid || !destinationFormatValid) return 0;
        const o = originAirport;
        const d = destinationAirport;
        if (o && d) return calculateGreatCircleMiles(o.lat, o.lon, d.lat, d.lon);
        return 0;
      }, [isManual, manualMilesValid, manualMilesNumber, originAirport, destinationAirport, isSameAirport, originFormatValid, destinationFormatValid]);

      const zone = getZoneByMiles(miles);

      const fares = useLocalMemo(() =>
        airlines.map(a => getFare(a, miles)),
      [airlines, miles]);

      const formatPrice = (fareObj) => {
        if (!fareObj) return null;
        const mult = isRoundTrip ? 2 : 1;
        if (fareObj.isCustom && fareObj.originalCurrency === 'CAD') {
          // Custom fare already in CAD
          return currency === 'CAD' ? Math.round(fareObj.originalFare * mult) : roundUsdCents(fareObj.originalFare / getCadRate() * mult);
        }
        // Generic fare (in USD base)
        const amount = currency === 'CAD' ? Math.round(fareObj.amount * getCadRate() * mult) : roundUsdCents(fareObj.amount * mult);
        return amount;
      };

      const formattedFares = useLocalMemo(() => fares.map(f => formatPrice(f)), [fares, isRoundTrip, currency]);

      const validFares = formattedFares.filter(f => f !== null);
      const minFare = validFares.length > 0 ? Math.min(...validFares) : null;
      const maxFare = validFares.length > 0 ? Math.max(...validFares) : null;

      const updateSearch = (i, val) => {
        const s = [...searches]; s[i] = val; setSearches(s);
        const sh = [...shows]; sh[i] = true; setShows(sh);
        const a = [...airlines]; a[i] = null; setAirlines(a);
      };
      const selectAirline = (i, airline) => {
        const a = [...airlines]; a[i] = airline; setAirlines(a);
        const s = [...searches]; s[i] = airline.name; setSearches(s);
        const sh = [...shows]; sh[i] = false; setShows(sh);
      };
      const closeDropdown = (i) => {
        const sh = [...shows]; sh[i] = false; setShows(sh);
      };

      const handleSwap = () => { const tmp = origin; setOrigin(destination); setDestination(tmp); };
      const handleReset = () => {
        setOrigin(''); setDestination('');
        setIsManual(false); setManualMiles('');
        setAirlines([null, null, null]);
        setSearches(['', '', '']);
        setShows([false, false, false]);
        setIsRoundTrip(false); setCurrency('CAD');
      };

      const [recentRoutes, setRecentRoutes] = useLocalState(() => {
        const raw = getJSON('zed_recent_routes', []);
        if (!Array.isArray(raw)) return [];
        return raw
          .filter(r => r && typeof r === 'object' && /^[A-Z]{3}$/.test(String(r.origin || '').toUpperCase()) && /^[A-Z]{3}$/.test(String(r.destination || '').toUpperCase()))
          .map(r => ({ origin: String(r.origin || '').toUpperCase(), destination: String(r.destination || '').toUpperCase() }))
          .slice(0, 5);
      });
      const handleUseRecentRoute = (r) => { setOrigin(r.origin); setDestination(r.destination); };

      const hasRoute = miles > 0;
      const activeCount = airlines.filter(Boolean).length;
      const hasResults = hasRoute && activeCount >= 2;
      useLocalEffect(() => {
        if (!hasRoute || !hasResults || isManual) return;
        if (!originCode || !destinationCode || isSameAirport) return;
        const route = { origin: originCode, destination: destinationCode };
        setRecentRoutes(prev => {
          const merged = [route, ...prev.filter(x => !(x.origin === route.origin && x.destination === route.destination))].slice(0, 5);
          setJSON('zed_recent_routes', merged);
          return merged;
        });
      }, [hasRoute, hasResults, isManual, originCode, destinationCode, isSameAirport]);
      const sourceAirlines = useLocalMemo(() => {
        return Array.isArray(airlineData) && airlineData.length > 0 ? airlineData : AIRLINE_DATA;
      }, [airlineData]);
      const routeStatus = useLocalMemo(() => {
        if (isManual) {
          if (!manualMiles.trim()) return { tone: 'slate', labelKey: 'calc_missing_distance', detailKey: 'calc_enter_miles_manually' };
          if (!manualMilesValid) return { tone: 'red', labelKey: 'calc_invalid_miles', detailKey: 'calc_miles_gt_zero' };
          return { tone: 'emerald', labelKey: 'calc_ready', detailKey: null, detail: t('calc_manual_distance_detail').replace('{miles}', Math.round(manualMilesNumber).toLocaleString()) };
        }
        if (!originCode && !destinationCode) return { tone: 'slate', labelKey: 'farecompare_missing_route', detailKey: 'farecompare_enter_codes' };
        if ((originCode && !originFormatValid) || (destinationCode && !destinationFormatValid)) return { tone: 'red', labelKey: 'calc_invalid_code', detailKey: 'calc_use_iata' };
        if (!originCode || !destinationCode) return { tone: 'amber', labelKey: 'farecompare_missing_route', detailKey: 'calc_both_required' };
        if (isSameAirport) return { tone: 'red', labelKey: 'calc_invalid_route', detailKey: 'calc_same_airport' };
        if (!originAirport || !destinationAirport) return { tone: 'red', labelKey: 'calc_code_not_found', detailKey: 'calc_code_not_found' };
        return { tone: 'emerald', labelKey: 'calc_ready', detailKey: null, detail: `${originCode} → ${destinationCode}` };
      }, [isManual, manualMiles, manualMilesValid, manualMilesNumber, originCode, destinationCode, originFormatValid, destinationFormatValid, isSameAirport, originAirport, destinationAirport, t]);
      const routeStatusClasses = routeStatus.tone === 'emerald'
        ? (darkMode ? 'bg-emerald-900/30 border-emerald-700 text-emerald-300' : 'bg-emerald-50 border-emerald-200 text-emerald-700')
        : routeStatus.tone === 'red'
          ? (darkMode ? 'bg-red-950/40 border-red-800 text-red-300' : 'bg-red-50 border-red-200 text-red-700')
          : routeStatus.tone === 'amber'
            ? (darkMode ? 'bg-amber-950/40 border-amber-800 text-amber-300' : 'bg-amber-50 border-amber-200 text-amber-700')
            : (darkMode ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-600');

      const sourceSummary = useLocalMemo(() => {
        const selIdx = [0, 1, 2].filter(i => airlines[i]);
        if (selIdx.length === 0) return '';
        const nVerified = selIdx.filter(i => fares[i] && fares[i].isCustom).length;
        if (nVerified === 0) return t('farecompare_source_generic_only');
        if (nVerified === selIdx.length) return t('farecompare_source_all_verified');
        return t('farecompare_source_line').replace('{verified}', String(nVerified));
      }, [airlines, fares, t]);

      const slotColors = [
        { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-700', label: 'A', dot: 'bg-blue-500' },
        { bg: 'bg-purple-50', border: 'border-purple-200', text: 'text-purple-700', label: 'B', dot: 'bg-purple-500' },
        { bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-700', label: 'C', dot: 'bg-orange-500' },

      return (
        <div className={toolShellClass(darkMode, { overflow: 'visible' })}>

          {/* ─── Header ─── */}
          <div className={TOOL_HEADER_CLASS}>
            <div className="flex items-center justify-between gap-4 flex-wrap">
              <div className="flex items-center gap-4">
                <div className={toolIconWrapClass(darkMode)}>
                  <Icons.Scale className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h2 className={TOOL_H2_CLASS}>{t('farecompare_title')}</h2>
                  <p className={TOOL_SUBTITLE_CLASS}>{t('farecompare_side_by_side')}</p>
                  <p className={TOOL_DESC_CLASS}>{t('farecompare_subtitle')}</p>
                  <ToolTrustChips darkMode={darkMode} t={t} estimate />
                </div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                {hasResults && (
                  <button type="button" onClick={() => { const routePart = isManual ? `${miles.toLocaleString()} mi` : `${originCode} → ${destinationCode}`; const parts = [`${routePart} · Zone ${zone} · ${currency} ${isRoundTrip ? 'RT' : 'OW'}`]; airlines.forEach((a, i) => { if (a && formattedFares[i] != null) parts.push(`${a.name}: ${currency === 'USD' ? `$${Number(formattedFares[i]).toFixed(2)}` : `$${formattedFares[i]}`}`); }); copyText(parts.join('\n')).then(() => {}); }} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest bg-white/10 hover:bg-white/20 text-white border border-white/20 transition-all flex items-center gap-1.5 ${fcHdrFocus}`}>

                  <Icons.X className="w-3 h-3" /> {t('common_reset')}
                </button>
              </div>
            </div>
            {/* Inline options bar */}
            <div className="flex flex-wrap items-center gap-2 mt-6 pt-6 border-t border-white/10">
              <button type="button" onClick={() => setIsRoundTrip(!isRoundTrip)}

                {isRoundTrip ? `⇄ ${t('calc_round_trip')}` : `→ ${t('calc_one_way')}`}
              </button>
              <div className="flex rounded-xl overflow-hidden border border-white/15">
                {['CAD','USD'].map(c => (
                  <button type="button" key={c} onClick={() => setCurrency(c)}
                    className={`px-4 py-2 text-[9px] font-black uppercase tracking-widest transition-all ${fcHdrFocus} ${currency === c ? 'bg-white text-[#152C53]' : 'bg-white/5 text-white/50 hover:bg-white/10 hover:text-white'}`}>{c}</button>
                ))}
              </div>
              {currency === 'USD' && <span className="text-[8px] text-white/30 font-bold uppercase tracking-widest ml-1">1 CAD ≈ {(1/getCadRate()).toFixed(2)} USD</span>}
            </div>
          </div>

          {/* ─── Body: Two-panel layout ─── */}
          <div className="grid grid-cols-1 lg:grid-cols-[1fr_1.4fr] min-h-[400px]">

            {/* ─── LEFT PANEL: Configuration ─── */}
            <div className={`p-5 sm:p-7 space-y-5 ${darkMode ? 'border-slate-700' : 'border-slate-200'} lg:border-r`}>

              {/* Route */}

                      <button type="button" onClick={() => setIsManual(true)}

                        {t('calc_manual_miles')}
                      </button>
                    </div>
                  </div>
                  <div className={`rounded-xl border p-2.5 ${darkMode ? 'border-slate-600/80 bg-slate-900/40' : 'border-slate-200 bg-white'}`}>
                    {isManual ? (
                      <div className="relative animate-fade-in">
                        <Icons.Plane className={`absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 ${darkMode ? 'text-slate-500' : 'text-slate-300'}`} />

                <div className="space-y-2">
                  {[0,1,2].map(i => {
                    const col = slotColors[i];
                    const darkCol = [
                      { bg: 'bg-blue-950/40', border: 'border-blue-800/60', text: 'text-blue-300', dot: 'bg-blue-500' },
                      { bg: 'bg-purple-950/40', border: 'border-purple-800/60', text: 'text-purple-300', dot: 'bg-purple-500' },
                      { bg: 'bg-orange-950/40', border: 'border-orange-800/60', text: 'text-orange-300', dot: 'bg-orange-500' },
                    ][i];
                    const activeCol = darkMode ? darkCol : col;
                    const filtered = sourceAirlines.filter(a => a.name.toLowerCase().includes(searches[i].toLowerCase()));
                    return (
                      <div key={i} className="relative">
                        <div className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border transition-all ${airlines[i] ? (darkMode ? `${darkCol.bg} ${darkCol.border}` : `${col.bg} ${col.border}`) : (darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200')}`}>
                          <span className={`w-5 h-5 rounded-full ${col.dot} text-white text-[8px] font-black flex items-center justify-center shrink-0`}>{col.label}</span>
                          <input
                            type="text"
                            placeholder={i === 2 ? t('farecompare_airline_c') : (i === 0 ? t('farecompare_airline_a') : t('farecompare_airline_b'))}
                            className={`farecompare-airline-input flex-1 bg-transparent outline-none font-bold text-xs min-w-0 border-0 ring-0 focus:ring-0 focus:border-0 ${airlines[i] ? (darkMode ? darkCol.text : col.text) : (darkMode ? 'text-slate-200 placeholder-slate-600' : 'text-slate-700 placeholder-slate-400')}`}
                            value={searches[i]}
                            onChange={e => updateSearch(i, e.target.value)}
                            onFocus={() => { const sh = [...shows]; sh[i] = true; setShows(sh); }}
                            onBlur={() => setTimeout(() => closeDropdown(i), 150)}
                          />
                          {airlines[i] && <span className={`text-[8px] font-black uppercase tracking-widest shrink-0 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{airlines[i].zed}</span>}
                          {airlines[i] && fares[i] && fares[i].isCustom && <Icons.Check className="w-3.5 h-3.5 text-emerald-500 shrink-0" aria-hidden title={t('farecompare_row_verified')} />}
                          {searches[i] && !airlines[i] && <button onMouseDown={e => e.preventDefault()} onClick={() => { updateSearch(i, ''); const a = [...airlines]; a[i] = null; setAirlines(a); }} className="text-slate-400 hover:text-slate-600 shrink-0 text-[10px] font-black">✕</button>}
                        </div>
                        {shows[i] && !airlines[i] && (
                          <div className={`absolute top-[calc(100%+2px)] left-0 w-full rounded-xl border shadow-2xl z-[200] max-h-[min(16rem,45vh)] overflow-y-auto overscroll-y-contain custom-scroll animate-fade-in ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            {filtered.length > 0 ? filtered.map(a => (
                              <button key={a.name}
                                onMouseDown={e => e.preventDefault()}
                                className={`w-full px-3 py-2 text-left flex items-center gap-2.5 border-b last:border-0 transition-colors ${darkMode ? 'border-slate-700 hover:bg-slate-700' : 'border-slate-100 hover:bg-slate-50'}`}
                                onClick={() => selectAirline(i, a)}>
                                <span className="text-sm">{a.flag}</span>
                                <span className={`font-bold text-xs flex-1 ${darkMode ? 'text-slate-200' : 'text-slate-700'}`}>{a.name}</span>
                                <span className={`text-[8px] font-black uppercase px-1.5 py-0.5 rounded-full shrink-0 ${a.zed === 'NOT ACTIVE' ? (darkMode ? 'bg-slate-700 text-slate-500' : 'bg-slate-100 text-slate-400') : (darkMode ? 'bg-emerald-900/50 text-emerald-400' : 'bg-emerald-50 text-emerald-600')}`}>{a.zed}</span>
                              </button>
                            )) : <div className={`p-4 text-center font-bold text-xs ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{t('calc_no_results')}</div>}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Prompt if not enough info */}
              {!hasResults && (activeCount > 0 || hasRoute) && (
                <div className={`px-4 py-3 border rounded-xl text-center text-[9px] font-black uppercase tracking-widest animate-fade-in ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-500' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                  {routeStatus.tone === 'red'
                    ? (routeStatus.detailKey ? t(routeStatus.detailKey) : routeStatus.detail)
                    : (!hasRoute ? t('farecompare_enter_route_see_fares') : t('farecompare_select_at_least_2'))}
                </div>
              )}

              {/* Disclaimer */}
              <p className={`text-[9px] leading-relaxed font-medium italic px-1 ${darkMode ? 'text-slate-600' : 'text-slate-400'}`}>
                {t('farecompare_disclaimer')}
              </p>
            </div>

            {/* ─── RIGHT PANEL: Results ─── */}
            <div className={`p-5 sm:p-7 lg:border-l-4 lg:border-l-[#FFC136]/90 ${darkMode ? 'bg-slate-800/30' : 'bg-slate-50/50'}`}>

              {!hasResults ? (
                <div className="flex flex-col items-center justify-center h-full min-h-[300px] gap-4">
                  <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-2xl ${darkMode ? 'bg-slate-800 border border-slate-700' : 'bg-white border border-slate-200 shadow-sm'}`}>⚖️</div>
                  <p className={`text-[10px] font-black uppercase tracking-widest text-center ${darkMode ? 'text-slate-600' : 'text-slate-300'}`}>
                    {!hasRoute ? t('farecompare_enter_route_pick') : activeCount < 2 ? t('farecompare_pick_at_least_2') : t('farecompare_calculating')}
                  </p>
                </div>
              ) : (
                <div className="space-y-4 animate-slide-up">

                  {/* Winner callout */}
                  {validFares.length >= 2 && minFare !== maxFare && (() => {
                    const winnerIdx = formattedFares.indexOf(minFare);
                    const winner = airlines[winnerIdx];
                    const savings = maxFare - minFare;
                    return winner ? (
                      <div className={`p-4 rounded-2xl border-2 flex items-center gap-3 animate-fade-in ${darkMode ? 'bg-emerald-950/50 border-emerald-700' : 'bg-emerald-50 border-emerald-300'}`}>
                        <span className="text-2xl">🏆</span>
                        <div className="min-w-0">
                          <p className={`font-black text-xs uppercase tracking-tight ${darkMode ? 'text-emerald-400' : 'text-emerald-700'}`}>{t('farecompare_winner_saves').replace('{name}', winner.name).replace('{amount}', currency === 'USD' ? roundUsdCents(savings).toFixed(2) : String(Math.round(savings))).replace('{currency}', currency)}</p>
                          <p className={`text-[10px] font-medium mt-0.5 ${darkMode ? 'text-emerald-500' : 'text-emerald-600'}`}>{t('farecompare_winner_sub').replace('{trip}', isRoundTrip ? t('calc_round_trip') : t('calc_one_way'))}</p>
                        </div>
                      </div>

                                    isLoser ? (darkMode ? 'text-slate-500' : 'text-slate-400') :
                                    darkMode ? 'text-slate-100' : 'text-[#152C53]'

                            <div className="w-16 text-center shrink-0">
                              {isWinner && <span className="px-2 py-1 bg-emerald-500 text-white rounded-lg text-[8px] font-black uppercase tracking-widest">{t('farecompare_badge_best')}</span>}
                              {isLoser && minFare !== null && <span className={`text-[9px] font-bold ${darkMode ? 'text-slate-600' : 'text-slate-400'}`}>{t('farecompare_plus_vs_best').replace('{amount}', currency === 'USD' ? `$${roundUsdCents(fare - minFare).toFixed(2)}` : `$${Math.round(fare - minFare)}`)}</span>}
                              {isTie && <span className={`text-[9px] font-bold ${darkMode ? 'text-blue-500' : 'text-blue-500'}`}>{t('farecompare_badge_tied')}</span>}
                            </div>
                          </div>

                          {/* Progress bar */}
                          {fare !== null && (
                            <div className={`h-1 w-full ${darkMode ? 'bg-slate-700' : 'bg-slate-100'}`}>
                              <div className={`h-full transition-all duration-700 ${isWinner ? 'bg-emerald-400' : isTie ? 'bg-blue-400' : (darkMode ? 'bg-slate-600' : 'bg-slate-300')}`} style={{ width: `${barWidth}%` }}></div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Taxes note */}
                  <div className={`flex items-start gap-2.5 p-3 rounded-xl border ${darkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-blue-50/60 border-blue-100'}`}>
                    <Icons.HelpCircle className={`w-4 h-4 shrink-0 mt-0.5 ${darkMode ? 'text-blue-400' : 'text-blue-400'}`} />
                    <div className="space-y-0.5">
                      <p className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-blue-300' : 'text-blue-700'}`}>{t('farecompare_zone_line').replace('{zone}', String(zone)).replace('{range}', DEFAULT_ZONE_RANGES[zone] || '')}</p>
                      <p className={`text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-blue-300' : 'text-blue-700'}`}>{t('calc_taxes_fees_title')}</p>
                      <p className={`text-[9px] font-medium ${darkMode ? 'text-slate-500' : 'text-blue-600/70'}`}>{t('calc_taxes_fees_body')}</p>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }
